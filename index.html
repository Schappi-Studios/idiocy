// ---------- email ----------
// Settings section: add and verify an email (so a forgotten password can be reset).
function emailSection(refresh, startNow) {
  const box = h('div', { class: 'emailbox' });
  const title = h('b', null, 'Email');
  const hint = t => h('div', { class: 'hint', style: 'color:var(--muted);font-size:12px' }, t);
  const run = async (btn, action, data) => {
    btn.disabled = true; btn.classList.add('busy');
    try {
      const d = await api(action, data);
      if (!d.ok) { if (!d.auth) toast(d.error || 'Something went wrong', true); return null; }
      return d;
    } catch (e) { toast('Could not reach the server', true); return null; }
    finally { btn.disabled = false; btn.classList.remove('busy'); }
  };
  const askEmail = () => {
    const changing = me.verified && me.email;
    const email = h('input', { type: 'email', placeholder: changing ? 'New email' : 'you@example.com', autocomplete: 'email', value: changing ? '' : me.email || '' });
    // Changing it needs your password, so nobody on your unlocked phone can take the account.
    const pass = changing && serverApi >= 14 ? h('input', { type: 'password', placeholder: 'Current password', autocomplete: 'current-password' }) : null;
    const send = h('button', { class: 'primary', type: 'button' }, 'Send code');
    send.onclick = async () => {
      if (await run(send, 'emailStart', { email: email.value, ...(pass && { password: pass.value }) })) askCode(email.value.trim().toLowerCase());
    };
    box.replaceChildren(title,
      hint(changing ? `We'll send a code to the new address. ${me.email} stays until you verify it.` : 'Lets you reset your password if you forget it. Nobody else can see it.'),
      ...(pass ? [pass] : []), h('div', { class: 'row2' }, email, send),
      ...(changing ? [h('button', { class: 'linkbtn', type: 'button', onclick: () => refresh() }, 'Cancel')] : []));
    email.focus();
  };
  const askCode = address => {
    const code = h('input', { inputmode: 'numeric', placeholder: '6-digit code', maxlength: 7, autocomplete: 'one-time-code' });
    const verify = h('button', { class: 'primary', type: 'button' }, 'Verify');
    verify.onclick = async () => {
      const d = await run(verify, 'emailVerify', { code: code.value });
      if (!d) return;
      me.email = d.email; me.verified = true; me.mustVerify = false;
      toast('Email verified \u2713');
      profiles.delete(key(me.name));
      refresh();
    };
    box.replaceChildren(title, hint(`We sent a code to ${address}. It expires in 10 minutes.`), spamNote(),
      h('div', { class: 'row2' }, code, verify), h('button', { class: 'linkbtn', type: 'button', onclick: askEmail }, 'Use a different email'));
    code.focus();
  };
  if (me.verified && me.email) {
    const remove = h('button', { class: 'ghost danger', type: 'button' }, 'Remove');
    remove.onclick = async () => {
      if (!confirm('Remove your email? You won\u2019t be able to reset your password if you forget it.')) return;
      if (await run(remove, 'emailRemove', {})) { me.email = ''; me.verified = false; profiles.delete(key(me.name)); refresh(); }
    };
    box.replaceChildren(title, h('div', null, me.email, ' ', h('span', { class: 'vbadge' }, '\u2713 Verified')),
      h('div', { class: 'row2' }, h('button', { class: 'ghost', type: 'button', onclick: askEmail }, 'Change email'),
        serverApi < 14 && remove));
  } else {
    box.replaceChildren(title, hint('Add an email so you can reset your password if you forget it. Nobody else can see it.'),
      h('button', { class: 'ghost', type: 'button', style: 'align-self:flex-start', onclick: askEmail }, 'Add email'));
    if (startNow) setTimeout(askEmail, 0);
  }
  return box;
}

    openRev = d.rev; // we already applied our own delete, no need to reload

  if (shown.has(m.id)) return;

// Consecutive messages from one person within 5 minutes share a header.
function groupMessages() {
  if (isFeed()) return; // posts stand alone
  let prev = null;
  for (const el of log.children) {
    const isMsg = el.classList.contains('msg') && !el.classList.contains('sysline');
    el.classList.toggle('cont', isMsg && !!prev && !el.classList.contains('pending') &&
      prev.dataset.user === el.dataset.user && el.dataset.time - prev.dataset.time < 300000);
    prev = isMsg && !el.classList.contains('pending') ? el : null;
  }
}

function sys(text, isErr) {
  const stick = nearBottom();
  const el = h('div', { class: 'sys' + (isErr ? ' err' : '') }, text);
  if (isFeed()) log.prepend(el); else log.appendChild(el);
  if (stick) scrollDown();
  return el;
}

function renderBatch(msgs, animate) {
  if (!msgs.length) return;
  if (!isFeed()) notePreview(openId, msgs[msgs.length - 1]);
  const stick = nearBottom();
  log.querySelectorAll('.sys.empty').forEach(e => e.remove());
  const before = new Set(log.children);
  msgs.forEach(addMessage);
  if (animate) {
    // Slide in only what just arrived, not a whole chat loading at once.
    for (const el of log.children) {
      if (!before.has(el) && el.classList.contains('msg') && !el.classList.contains('pending')) el.classList.add('new');
    }
  }
  lastId = Math.max(lastId, ...msgs.map(m => m.id));
  // Keep messages still being sent at the end new things appear.
  log.querySelectorAll('.pending').forEach(p => isFeed() ? log.prepend(p) : log.appendChild(p));
  groupMessages();
  if (stick) scrollDown();
  else $('newmsgs').style.display = 'block';
}

// ---------- composer state: timeouts and slow mode ----------
let slowUntil = 0, slowTimer = null;

function updateComposer() {
  const note = $('composernote');
  const btn = isFeed() ? $('postbtn') : document.querySelector('#send button[type=submit]');
  const muted = me && me.muted > Date.now();
  const slowLeft = Math.ceil((slowUntil - Date.now()) / 1000);
  const waiting = isPendingChat(openId); // DM still being created
  const locked = mustVerify();
  textEl.disabled = !!muted || waiting || locked;
  $('attach').disabled = !!muted || waiting || locked;
  $('posttext').disabled = !!muted || locked;
  $('postimg').disabled = !!muted || locked;
  $('postcam').disabled = !!muted || locked;
  $('mic').disabled = !!muted || waiting || locked;
  $('mic').classList.toggle('hidden', serverApi < 11);
  $('postpoll').classList.toggle('hidden', serverApi < 11);
  $('postpoll').disabled = !!muted || locked;
  note.onclick = null;
  document.querySelectorAll('.verifybar').forEach(b => b.classList.toggle('hidden', !locked));
  if (locked) {
    note.textContent = '\u{1F4E7} Verify your email to post and send messages. Tap here.';
    note.className = 'composer-note warn verify';
    note.onclick = openVerify;
  } else if (muted) {
    note.textContent = `You're timed out until ${new Date(me.muted).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}. You can still read messages.`;
    note.className = 'composer-note warn';
  } else if (openId === 'global' && settings.slow && slowLeft > 0) {
    note.textContent = `Slow mode is on. You can post again in ${slowLeft}s.`;
    note.className = 'composer-note';
  } else {
    note.className = 'composer-note hidden';
  }
  if (!btn.classList.contains('busy')) btn.disabled = !!muted || waiting || locked || (openId === 'global' && slowLeft > 0);
  clearTimeout(slowTimer);
  if (slowLeft > 0 || muted) slowTimer = setTimeout(updateComposer, 500);
}

async function send(text, att, extra = {}) {
  const btn = isFeed() ? $('postbtn') : document.querySelector('#send button[type=submit]');
  const myEpoch = epoch, sentTo = openId;
  btn.disabled = true;
  // Show the message right away while the server catches up.
  const rp = !isFeed() && replying ? replying : null;
  const pending = buildMessage({
    name: me ? me.name : '', admin: me && me.role === 'admin', text,
    ...(att && { img: 'local', local: att.data, w: att.w, h: att.h }),
    ...(rp && { rp: { id: rp.id, name: rp.name, text: (rp.text || '[image]').slice(0, 100) } }),
    ...(extra.poll && { pl: { o: extra.poll, v: {} } }),
    ...(extra.voice && { img: 'local', local: extra.voice, vo: extra.dur }),
  }, true);
  if (rp) setReply(null);
  log.querySelectorAll('.sys.empty').forEach(e => e.remove());
  if (isFeed()) log.prepend(pending); else log.appendChild(pending);
  scrollDown();
  try {
    const d = await api('send', { convo: openId, text, ...(att && { image: att.data, w: att.w, h: att.h }), ...(rp && { replyTo: rp.id }),
      ...(extra.poll && { poll: { options: extra.poll } }), ...(extra.voice && { voice: extra.voice, dur: extra.dur }) });
    if (!d.ok) { pending.remove(); if (rp && !replying) setReply(rp); if (verifyError(d.error)) openVerify(); else if (!d.auth) sys(d.error || 'Could not send', true); return false; }
    if (sentTo !== 'global') notePreview(sentTo, d.message);
    if (myEpoch !== epoch || !pending.isConnected) return true; // polling will deliver it
    const m = d.message;
    if (att && m.img) rememberImage(m.img, att.data); // no need to download what we just sent
    if (extra.voice && m.img) rememberImage(m.img, extra.voice);
    if (openId === 'global' && settings.slow && me.role !== 'admin') slowUntil = Date.now() + settings.slow * 1000;
    lastActivity = Date.now();
    if (shown.has(m.id)) {
      pending.remove(); // a poll already delivered it
    } else {
      shown.add(m.id);
      lastId = Math.max(lastId, m.id);
      const el = buildMessage(m);
      el.classList.add('arrived');
      pending.replaceWith(el);
      log.querySelectorAll('.sys.empty').forEach(e => e.remove());
      groupMessages();
      markRead();
    }
    return true;
  } catch (e) {
    pending.remove();
    sys('Could not send — check your connection', true);
    return false;
  } finally {
    btn.disabled = false;
    updateComposer();
  }
}

// ---------- images ----------
const MAX_IMAGE_CHARS = 290000; // server limit is 300,000
const imageCache = new Map();   // image id -> data URL
let attachment = null;          // { data, w, h } waiting to be sent

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("Couldn't read that image"));
    i.src = src;
  });
}

function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Shrinks photos to fit the server limit. Small GIFs are kept as-is so they stay animated.
async function prepareImage(file) {
  if (!file || !file.type.startsWith('image/')) throw new Error("That file isn't an image");
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (file.type === 'image/gif') {
      const data = await readAsDataURL(file);
      if (data.length - data.indexOf(',') - 1 <= MAX_IMAGE_CHARS) return { data, w: w0, h: h0 };
    }
    for (const max of [1280, 1024, 800, 640, 480]) {
      const scale = Math.min(1, max / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; // transparent parts would turn black in a JPEG
      g.fillRect(0, 0, w, h);
      g.drawImage(img, 0, 0, w, h);
      for (const q of [0.82, 0.7]) {
        const data = c.toDataURL('image/jpeg', q);
        if (data.length - data.indexOf(',') - 1 <= MAX_IMAGE_CHARS) return { data, w, h };
      }
    }
    throw new Error('That image is too big');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function setAttachment(att) {
  attachment = att;
  $('attachbar').classList.toggle('hidden', !att);
  if (att) {
    $('attachimg').src = att.data;
    $('attachinfo').textContent = isFeed()
      ? `Picture added (${att.w}×${att.h}). Write something or just press Post.`
      : `Image ready to send (${att.w}×${att.h}). Add a caption or press Send.`;
  } else {
    $('attachimg').removeAttribute('src');
  }
}

async function attachFile(file) {
  try {
    setAttachment(await prepareImage(file));
    textEl.focus();
  } catch (e) {
    toast(e.message || "Couldn't read that image", true);
  }
}

function rememberImage(id, data) {
  imageCache.set(id, data);
  // Images are big, so only keep the most recent ones in memory.
  while (imageCache.size > 60) imageCache.delete(imageCache.keys().next().value);
}

function imageBlock(m, max = 320) {
  const scale = Math.min(1, max / m.w, max / m.h);
  const box = h('div', { class: 'shot', style: `width:${Math.round(m.w * scale)}px;aspect-ratio:${m.w}/${m.h}` });
  const img = h('img', { alt: 'Image' });
  box.append(img);
  box.onclick = () => { if (img.src) openLightbox(img.src); };
  img.onload = () => box.classList.add('loaded');
  if (m.local) img.src = m.local;
  else if (imageCache.has(m.img)) img.src = imageCache.get(m.img);
  else {
    // Download only when scrolled near, a few at a time.
    box.dataset.img = m.img;
    box.dataset.convo = openId;
    imageObserver.observe(box);
  }
  return box;
}

const imageQueue = [];
let imagesLoading = 0;
const imageObserver = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  imageObserver.unobserve(e.target);
  imageQueue.push(e.target);
  pumpImages();
}), { root: log, rootMargin: '400px' });

function pumpImages() {
  while (imagesLoading < 3 && imageQueue.length) {
    const box = imageQueue.shift();
    imagesLoading++;
    fetchImage(box).finally(() => { imagesLoading--; pumpImages(); });
  }
}

async function fetchImage(box) {
  const id = box.dataset.img;
  try {
    let src = imageCache.get(id);
    if (!src) {
      const d = await api('image', { convo: box.dataset.convo, id });
      if (!d.ok) throw new Error(d.error);
      src = d.image;
      rememberImage(id, src);
    }
    const img = box.querySelector('img');
    img.onload = () => box.classList.add('loaded');
    img.src = src;
  } catch (e) {
    box.classList.add('failed');
    box.onclick = null;
    box.replaceChildren(e.message && !/fetch/i.test(e.message) ? e.message : "Couldn't load image");
  }
}

function openLightbox(src) {
  const overlay = h('div', { class: 'overlay lightbox', onclick: () => overlay.remove() }, h('img', { src, alt: 'Image' }));
  document.body.append(overlay);
}

// The chat box's "+": a picture, a photo, or (on newer backends) a poll.
let plusMenu = null;
function closePlus() { if (plusMenu) { plusMenu.remove(); plusMenu = null; } }
$('attach').onclick = () => {
  if (plusMenu) return closePlus();

};

// ---------- taking a photo ----------
// Phones open their own camera from the file picker. Computers can't, so they get a
// little camera window instead.
let photoTarget = attachFile; // where the photo goes: the message being written, or a story
function takePhoto(target = attachFile) {

  openCamera();
}
$('postcam').onclick = () => takePhoto();
$('camfile').onchange = () => {
  const f = $('camfile').files[0];
  $('camfile').value = '';
  if (f) photoTarget(f);

async function openCamera() {
  const video = h('video', { autoplay: '', playsinline: '' });
  video.muted = true;
  let stream = null;
  const stop = () => { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  const snap = h('button', { class: 'snap', title: 'Take photo', 'aria-label': 'Take photo', disabled: '' });
  const m = modal('camera', h('h2', null, 'Take a photo'), video, snap,
    h('div', { class: 'btns' }, h('button', { class: 'ghost', onclick: () => m.close() }, 'Cancel')));
  // However the window closes (Cancel, clicking outside, Escape), let go of the camera.
  const watch = setInterval(() => { if (!m.overlay.isConnected) { stop(); clearInterval(watch); } }, 300);
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 } }, audio: false });
  } catch (e) {
    m.close();
    toast(e && e.name === 'NotAllowedError' ? 'Idiocy isn\u2019t allowed to use your camera.' : 'Couldn\u2019t find a camera. Pick a picture instead.', true);
    return;
  }
  if (!m.overlay.isConnected) return stop();
  video.srcObject = stream;
  video.onloadedmetadata = () => snap.removeAttribute('disabled');
  snap.onclick = () => {
    const c = document.createElement('canvas');
    c.width = video.videoWidth; c.height = video.videoHeight;
    c.getContext('2d').drawImage(video, 0, 0);
    c.toBlob(b => { if (b) photoTarget(new File([b], 'photo.jpg', { type: 'image/jpeg' })); }, 'image/jpeg', 0.9);
    m.close();
  };
}
$('attachfile').onchange = () => {
  const f = $('attachfile').files[0];
  $('attachfile').value = '';
  if (f) attachFile(f);
};
$('attachx').onclick = () => { setAttachment(null); textEl.focus(); };

textEl.addEventListener('paste', e => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  attachFile(item.getAsFile());
});

// Drag and drop onto the chat. The counter stops flicker when crossing child elements.
let dragDepth = 0;
const mainEl = document.querySelector('main');
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
mainEl.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; mainEl.classList.add('dragging'); });
mainEl.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
mainEl.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; mainEl.classList.remove('dragging'); } });
mainEl.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  mainEl.classList.remove('dragging');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) attachFile(f); else toast("That file isn't an image", true);
});

// ---------- calls ----------
// Audio/video goes straight between the two browsers (WebRTC). The server only
// passes each side's connection details along and rings the other person.
// Some networks (often schools) block direct connections; a TURN relay server
// can be added to CALL_ICE_SERVERS to get through those.
const CALL_ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }];
let call = null; // the call in progress, if any

const cbtn = (cls, label, title, fn) => h('button', { class: 'cbtn ' + cls, title, 'aria-label': title, onclick: fn }, label);

// state: 'incoming' | 'ringing' | 'connecting' | 'connected'
function callUi(state) {
  call.state = state;
  if (state === 'incoming') {
    $('callring').replaceChildren(
      avatar(call.peer, { click: false }),
      h('div', { class: 't' }, h('b', null, call.peer), h('span', null, call.video ? 'Incoming video call\u2026' : 'Incoming call\u2026')),
      cbtn('hang', '\u2715', 'Decline', () => endCall(true)),
      cbtn('accept', '\u{1F4DE}', 'Accept', () => acceptCall()));
    $('callring').classList.remove('hidden');
    syncCallView();
    return;
  }
  $('callring').classList.add('hidden');
  $('rlabel').textContent = call.peer;
  paintRemoteTile();
  const muteBtn = cbtn('', '\u{1F399}\uFE0F', call.micOff ? 'Unmute' : 'Mute', () => toggleMute());
  muteBtn.classList.toggle('off', !!call.micOff);
  call.muteBtns = [muteBtn];
  const camBtn = call.video && cbtn('', '\u{1F4F7}', 'Turn camera off', () => {
    const t = call.local && call.local.getVideoTracks()[0];
    if (!t) return;
    t.enabled = !t.enabled;
    camBtn.classList.toggle('off', !t.enabled);
    camBtn.title = t.enabled ? 'Turn camera off' : 'Turn camera on';
  });
  const vol = h('input', { type: 'range', min: 0, max: 200, step: 5, 'aria-label': 'Volume' });
  const pct = h('span', { class: 'pct' });
  vol.value = peerVolume(call.peer);
  pct.textContent = vol.value + '%';
  vol.oninput = () => { pct.textContent = vol.value + '%'; setPeerVolume(Number(vol.value)); };
  const full = call.video && cbtn('', '\u26F6', 'Full screen', () => {
    const t = $('rtile');
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (t.requestFullscreen) t.requestFullscreen().catch(() => {});
  });
  $('cctrls').replaceChildren(...[muteBtn, camBtn,
    h('label', { class: 'vol', title: `${call.peer}'s volume` }, '\u{1F50A}', vol, pct),
    full, cbtn('hang', '\u{1F4DE}', 'Hang up', () => endCall(true))].filter(Boolean));
  setCallStatus(state === 'ringing' ? 'Ringing\u2026' : state === 'connecting' ? 'Connecting\u2026' : '');
  syncCallView();
}

function toggleMute() {
  const c = call || gcall;
  const t = c && c.local && c.local.getAudioTracks()[0];
  if (!t) return;
  t.enabled = !t.enabled;
  c.micOff = !t.enabled;
  document.querySelectorAll('.cbtn[title="Mute"], .cbtn[title="Unmute"]').forEach(b => {
    b.classList.toggle('off', c.micOff);
    b.title = c.micOff ? 'Unmute' : 'Mute';
  });
}

// Their video, or their picture for voice calls (and until video arrives).
function paintRemoteTile() {
  const tile = $('rtile');
  tile.querySelectorAll('.avatar').forEach(a => a.remove());
  const hasVideo = call.video && call.remote && call.remote.getVideoTracks().length;
  $('rvid').classList.toggle('hidden', !hasVideo);
  if (!hasVideo) tile.prepend(avatar(call.peer, { click: false }));
  tile.classList.toggle('ringing', call.state === 'ringing' || call.state === 'connecting');
}

// Shows the panel when you're looking at the call's DM, the small sidebar bar otherwise.
function syncCallView() {
  if (gcall) return syncGroupView();
  const active = call && call.state && call.state !== 'incoming';
  const here = active && openId === call.convo;
  $('callpanel').classList.toggle('hidden', !here);
  $('callmini').classList.toggle('hidden', !active || here);
  if (active && !here) {
    const mute = cbtn('', '\u{1F399}\uFE0F', call.micOff ? 'Unmute' : 'Mute', e => { e.stopPropagation(); toggleMute(); });
    mute.classList.toggle('off', !!call.micOff);
    $('callmini').replaceChildren(
      h('div', { class: 't' }, h('b', { id: 'ministatus' }, miniStatus()), call.peer),
      mute, cbtn('hang', '\u{1F4DE}', 'Hang up', e => { e.stopPropagation(); endCall(true); }));
  }
}
$('callmini').onclick = () => { const c = call || gcall; if (c) switchTo(c.convo); };

function miniStatus() {
  if (!call) return '';
  if (call.connected) {
    const s = Math.floor((Date.now() - call.since) / 1000);
    return `Call connected \u00b7 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }
  return call.state === 'ringing' ? 'Ringing\u2026' : 'Connecting\u2026';
}

function setCallStatus(text) {
  $('cstatus').textContent = text;
  const m = $('ministatus');
  if (m) m.textContent = miniStatus();
}

// Their volume, 0-200%, remembered per person. Above 100% needs Web Audio.
function peerVolume(name) {
  const v = (prefs.vol || {})[key(name)];
  return v == null ? 100 : v;
}

function setPeerVolume(v) {
  prefs.vol = Object.assign({}, prefs.vol, { [key(call.peer)]: v });
  savePrefs();
  if (call.gain) call.gain.gain.value = v / 100;
  else $('rvid').volume = Math.min(1, v / 100);
}

// Plays their audio through a volume control (so it can go above 100%).
function routeAudio(stream) {
  if (call.audioSrc || !stream.getAudioTracks().length) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    call.audioSrc = audio.createMediaStreamSource(stream);
    call.gain = audio.createGain();
    call.gain.gain.value = peerVolume(call.peer) / 100;
    call.audioSrc.connect(call.gain).connect(audio.destination);
    $('rvid').muted = true; // the audio now comes through the volume control instead
  } catch (e) {
    $('rvid').muted = false;
    $('rvid').volume = Math.min(1, peerVolume(call.peer) / 100);
  }
}

// Two-tone ring, repeating, made in code like the ping.
// Call sounds, made in code like the ping. The person being called hears a
// two-note ring; the caller hears a "brrr... brrr..." ringback while waiting.
// Both follow the "Call ringtone" setting, separate from message pings.
let ringTimer = null;
function ringtone(kind) {
  clearInterval(ringTimer);
  ringTimer = null;
  if (!kind || prefs.ring === false) return;
  const once = kind === 'incoming' ? () => { ding(); setTimeout(ding, 350); } : ringback;
  once();
  ringTimer = setInterval(once, kind === 'incoming' ? 2200 : 4000);
}

// Two seconds of the classic 440 + 480 Hz ringback tone.
function ringback() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const g = audio.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.05);
    g.gain.setValueAtTime(0.06, t + 1.9);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2);
    g.connect(audio.destination);
    [440, 480].forEach(f => {
      const o = audio.createOscillator();
      o.frequency.value = f;
      o.connect(g);
      o.start(t);
      o.stop(t + 2.05);
    });
  } catch (e) {}
}

async function getMedia(video) {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: true, video: video ? { width: 640, height: 480 } : false });
  } catch (e) {
    toast(video ? 'Allow camera and microphone access to call' : 'Allow microphone access to call', true);
    return null;
  }
}

function newPeer() {
  const pc = new RTCPeerConnection({ iceServers: CALL_ICE_SERVERS });
  pc.ontrack = e => {
    if (!call) return;
    call.remote = e.streams[0];
    $('rvid').srcObject = e.streams[0];
    $('rvid').play().catch(() => {});
    routeAudio(e.streams[0]);
    paintRemoteTile();
  };
  pc.onconnectionstatechange = () => {
    if (!call || call.pc !== pc) return;
    if (pc.connectionState === 'connected') onConnected();
    if (pc.connectionState === 'failed') {
      toast("Couldn't connect the call. The network might be blocking calls.", true);
      endCall(true);
    }
    if (pc.connectionState === 'disconnected') setCallStatus('Reconnecting\u2026');
  };
  pc.ondatachannel = e => wireChannel(e.channel);
  return pc;
}

// A tiny side channel so hanging up reaches the other person instantly.
function wireChannel(dc) {
  call.dc = dc;
  dc.onmessage = e => { if (e.data === 'bye' && call) endCall(false, 'Call ended'); };
}

// Sends our connection details only once they're complete (no trickling),
// because each trip through the server takes a couple of seconds.
function iceDone(pc) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise(res => {
    const t = setTimeout(res, 1500); // usually done in well under a second
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}

function showLocal(stream, video) {
  $('ltile').classList.toggle('hidden', !video);
  $('callpanel').classList.toggle('hasvideo', !!video);
  $('lvid').srcObject = video ? stream : null;
}

async function startCall(video) {
  if (gcall) return toast("You're already in a call", true);
  const c = st && st.convos.find(x => x.id === openId);
  if (!c || c.type !== 'dm') return;
  if (call) return toast("You're already in a call", true);
  const peer = convoLabel(c);
  call = { role: 'caller', peer, convo: c.id, video };
  showLocal(null, false);
  callUi('connecting');
  setCallStatus('Starting\u2026');
  const stream = await getMedia(video);
  if (!stream || !call) { cleanupCall(); return; }
  call.local = stream;
  showLocal(stream, video);
  const pc = call.pc = newPeer();
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  wireChannel(pc.createDataChannel('ctl'));
  await pc.setLocalDescription(await pc.createOffer());
  await iceDone(pc);
  if (!call) return;
  const d = await api('callStart', { convo: c.id, offer: pc.localDescription.sdp, video }).catch(() => null);
  if (!d || !d.ok) { toast((d && d.error) || "Couldn't start the call", true); cleanupCall(); return; }
  if (!call) { api('callEnd', { callId: d.callId }).catch(() => {}); return; }
  call.id = d.callId;
  call.startedRinging = Date.now();
  callUi('ringing');
  ringtone('outgoing');
  watchCall();
  watchForAnswer(call);
}

async function incomingCall(p) {
  if (call || gcall) { api('callEnd', { callId: p.call }).catch(() => {}); return; } // busy: decline
  if (Date.now() - (p.time || 0) > 60000) return; // an old ring that's long over
  let info = p.offer ? { from: p.from, convo: p.convo, video: !!p.video, offer: p.offer } : null;
  if (!info) {
    // Older rings (or ones trimmed to save space) don't carry the offer: fetch it.
    const d = await api('callGet', { callId: p.call }).catch(() => null);
    if (!d || !d.ok || d.call.status !== 'ringing') return;
    info = d.call;
  }
  if (call) return;
  call = { role: 'callee', id: p.call, peer: info.from, convo: info.convo, video: info.video, offer: info.offer };
  callUi('incoming');
  ringtone('incoming');
  if (prefs.desktop && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification(`${call.peer} is calling you`, { body: call.video ? 'Video call' : 'Voice call', icon: $('favicon').href, tag: 'idiocy-call' });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) {}
  }
  watchCall();
}

async function acceptCall() {
  if (!call || call.role !== 'callee') return;
  ringtone(null);
  if (openId !== call.convo) switchTo(call.convo); // show the call panel in their DM
  callUi('connecting');
  const stream = await getMedia(call.video);
  if (!stream || !call) { endCall(true); return; }
  call.local = stream;
  showLocal(stream, call.video);
  const pc = call.pc = newPeer();
  stream.getTracks().forEach(t => pc.addTrack(t, stream));
  await pc.setRemoteDescription({ type: 'offer', sdp: call.offer });
  await pc.setLocalDescription(await pc.createAnswer());
  await iceDone(pc);
  if (!call) return;
  const d = await api('callAnswer', { callId: call.id, answer: pc.localDescription.sdp }).catch(() => null);
  if (!d || !d.ok) { toast((d && d.error) || "Couldn't answer the call", true); cleanupCall(); }
}

// While ringing, the caller keeps a few overlapping checks going (a new one
// every 0.7s), so the answer is picked up soon after it lands rather than a
// whole server round trip later.
function watchForAnswer(me) {
  let inFlight = 0;
  const tick = async () => {
    if (call !== me || me.answered) return;
    me.answerTimer = setTimeout(tick, 700);
    if (inFlight >= 3) return;
    inFlight++;
    const d = await api('callGet', { callId: me.id }).catch(() => null);
    inFlight--;
    if (call !== me || me.answered || !d || !d.ok) return;
    if (d.call.status === 'active') {
      me.answered = true;
      clearTimeout(me.answerTimer);
      ringtone(null);
      setCallStatus('Connecting\u2026');
      await me.pc.setRemoteDescription({ type: 'answer', sdp: d.call.answer }).catch(() => {});
    }
  };
  tick();
}

// Checks the call record: the caller waits for an answer, both notice hang-ups.
function watchCall() {
  clearTimeout(call && call.watch);
  if (!call) return;
  const me = call;
  call.watch = setTimeout(async () => {
    if (call !== me) return;
    const d = await api('callGet', { callId: me.id }).catch(() => null);
    if (call !== me) return;
    if (d && d.ok) {
      const c = d.call;
      if (['ended', 'declined', 'missed'].includes(c.status)) {
        endCall(false, c.status === 'declined' ? `${me.peer} declined` : c.status === 'missed' && me.role === 'callee' ? 'Missed call' : 'Call ended');
        return;
      }
      if (me.role === 'caller' && c.status === 'active' && !me.answered) {
        me.answered = true;
        ringtone(null);
        setCallStatus('Connecting\u2026');
        await me.pc.setRemoteDescription({ type: 'answer', sdp: c.answer }).catch(() => {});
      }
      if (me.role === 'caller' && c.status === 'ringing' && Date.now() - me.startedRinging > 45000) {
        endCall(true, 'No answer');
        return;
      }
    }
    watchCall();
  }, call.connected ? 4000 : 1500);
}

function onConnected() {
  if (!call || call.connected) return;
  call.connected = true;
  call.since = Date.now();
  call.state = 'connected';
  paintRemoteTile();
  const tick = () => {
    if (!call || !call.connected) return;
    const s = Math.floor((Date.now() - call.since) / 1000);
    setCallStatus(`${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`);
    call.tickTimer = setTimeout(tick, 1000);
  };
  tick();
}

// tellServer: we're the one hanging up/declining (the other side learns via the server and the side channel).
function endCall(tellServer, message) {
  if (!call) return;
  const c = call;
  if (tellServer && c.id) api('callEnd', { callId: c.id }).catch(() => {});
  try { if (c.dc && c.dc.readyState === 'open') c.dc.send('bye'); } catch (e) {}
  cleanupCall();
  if (message) toast(message);
}

function cleanupCall() {
  if (!call) return;
  ringtone(null);
  clearTimeout(call.watch);
  clearTimeout(call.tickTimer);
  clearTimeout(call.answerTimer);
  if (call.local) call.local.getTracks().forEach(t => t.stop());
  try { if (call.pc) call.pc.close(); } catch (e) {}
  try { if (call.audioSrc) call.audioSrc.disconnect(); } catch (e) {}
  call = null;
  $('rvid').srcObject = null;
  $('rvid').muted = false;
  $('lvid').srcObject = null;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  ['callring', 'callpanel', 'callmini'].forEach(id => $(id).classList.add('hidden'));
  $('callpanel').classList.remove('hasvideo');
}

const inGroupChat = () => { const c = st && st.convos.find(x => x.id === openId); return c && c.type === 'group'; };
$('callbtn').onclick = () => (inGroupChat() ? joinGroupCall(openId, false) : startCall(false));
$('vcallbtn').onclick = () => (inGroupChat() ? joinGroupCall(openId, true) : startCall(true));
$('joincall').onclick = () => joinGroupCall(openId, !!(openGcall && openGcall.video));
window.addEventListener('beforeunload', () => { if (call) endCall(true); if (gcall) leaveGroupCall(true); });

// ---------- group calls ----------
// Everyone connects directly to everyone else. Whoever joins sends an offer
// to each person already in the call; they answer. The server passes these
// along and keeps track of who's in.
let gcall = null;      // the group call you're in
let openGcall = null;  // the call happening in the group you're looking at, if any

async function joinGroupCall(convoId, video) {
  if (call || gcall) return toast("You're already in a call", true);
  const c = st && st.convos.find(x => x.id === convoId);
  if (!c) return;
  $('callring').classList.add('hidden');
  ringtone(null);
  if (openId !== convoId) switchTo(convoId);
  gcall = { convo: convoId, name: c.name, video: !!video, peers: new Map(), tiles: new Map(), people: [], after: 0 };
  syncGroupView();
  setGStatus('Joining\u2026');
  const stream = await getMedia(video);
  if (!stream || !gcall) { leaveGroupCall(false); return; }
  gcall.local = stream;
  const d = await api('gcallJoin', { convo: convoId, video: !!video }).catch(() => null);
  if (!gcall) { if (d && d.ok) api('gcallLeave', { convo: convoId }).catch(() => {}); stream.getTracks().forEach(t => t.stop()); return; }
  if (!d || !d.ok) { toast((d && d.error) || "Couldn't join the call", true); leaveGroupCall(false); return; }
  Object.assign(gcall, { id: d.callId, after: d.cursor, since: Date.now(), people: d.others.slice() });
  d.others.forEach(name => offerTo(name).catch(() => {}));
  syncGroupView();
  gcall.tick = setInterval(updateGStatus, 1000);
  gpoll();
}

function groupPeer(name) {
  let p = gcall.peers.get(key(name));
  if (p) return p;
  const pc = new RTCPeerConnection({ iceServers: CALL_ICE_SERVERS });
  gcall.local.getTracks().forEach(t => pc.addTrack(t, gcall.local));
  p = { name, pc, stream: null };
  const me = gcall;
  pc.ontrack = e => { if (gcall !== me) return; p.stream = e.streams[0]; groupAudio(p); paintGroup(); };
  pc.onconnectionstatechange = () => { if (gcall === me) paintGroup(); };
  gcall.peers.set(key(name), p);
  return p;
}

// We joined after them, so we make the offer.
async function offerTo(name) {
  const me = gcall;
  const p = groupPeer(name);
  await p.pc.setLocalDescription(await p.pc.createOffer());
  await iceDone(p.pc);
  if (gcall !== me) return;
  await api('gcallSignal', { convo: me.convo, to: name, type: 'offer', sdp: p.pc.localDescription.sdp });
}

async function onGroupSignal(sig) {
  const me = gcall;
  if (sig.type === 'offer') {
    const old = me.peers.get(key(sig.from));
    if (old) { closeGroupPeer(old); me.peers.delete(key(sig.from)); } // they rejoined
    const p = groupPeer(sig.from);
    await p.pc.setRemoteDescription({ type: 'offer', sdp: sig.sdp });
    await p.pc.setLocalDescription(await p.pc.createAnswer());
    await iceDone(p.pc);
    if (gcall !== me) return;
    await api('gcallSignal', { convo: me.convo, to: sig.from, type: 'answer', sdp: p.pc.localDescription.sdp });
  } else {
    const p = me.peers.get(key(sig.from));
    if (p && p.pc.signalingState === 'have-local-offer') await p.pc.setRemoteDescription({ type: 'answer', sdp: sig.sdp });
  }
}

async function gpoll() {
  const me = gcall;
  if (!me || !me.id) return;
  const d = await api('gcallPoll', { convo: me.convo, after: me.after }).catch(() => null);
  if (gcall !== me) return;
  if (d && d.ok) {
    if (d.ended) { leaveGroupCall(false, 'You left the call'); return; }
    for (const sig of d.signals) {
      me.after = Math.max(me.after, sig.n);
      await onGroupSignal(sig).catch(() => {});
      if (gcall !== me) return;
    }
    const here = new Set(d.people.map(key));
    for (const [k, p] of me.peers) if (!here.has(k)) { closeGroupPeer(p); me.peers.delete(k); }
    me.people = d.people;
    paintGroup();
  }
  me.pollTimer = setTimeout(gpoll, 1500);
}

function closeGroupPeer(p) {
  try { p.pc.close(); } catch (e) {}
  try { if (p.src) p.src.disconnect(); } catch (e) {}
  const t = gcall && gcall.tiles.get(key(p.name));
  if (t) { t.remove(); gcall.tiles.delete(key(p.name)); }
}

// Their audio goes through a volume control (0-200%), like 1-to-1 calls.
function groupAudio(p) {
  if (p.src || !p.stream.getAudioTracks().length) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    p.src = audio.createMediaStreamSource(p.stream);
    p.gain = audio.createGain();
    p.gain.gain.value = peerVolume(p.name) / 100;
    p.src.connect(p.gain).connect(audio.destination);
    p.muted = true;
  } catch (e) { p.muted = false; }
}

// One tile per person. Tiles are kept between updates so video doesn't restart.
function groupTile(name, isMe) {
  const k = isMe ? '(me)' : key(name);
  let t = gcall.tiles.get(k);
  if (!t) {
    const video = h('video', { autoplay: '', playsinline: '' });
    video.muted = true;
    const vol = !isMe && h('input', { class: 'tvol', type: 'range', min: 0, max: 200, step: 5, title: `${name}'s volume`, 'aria-label': `${name}'s volume` });
    if (vol) {
      vol.value = peerVolume(name);
      vol.oninput = () => {
        prefs.vol = Object.assign({}, prefs.vol, { [key(name)]: Number(vol.value) });
        savePrefs();
        const p = gcall && gcall.peers.get(key(name));
        if (p && p.gain) p.gain.gain.value = vol.value / 100;
      };
    }
    t = h('div', { class: 'tile' }, video, h('span', { class: 'tstate' }), h('span', { class: 'label' }, isMe ? 'You' : name), vol);
    t._video = video;
    gcall.tiles.set(k, t);
  }
  return t;
}

function paintGroup() {
  if (!gcall) return;
  const tiles = [];
  const anyVideo = gcall.video || [...gcall.peers.values()].some(p => p.stream && p.stream.getVideoTracks().length);
  $('gcallpanel').classList.toggle('hasvideo', !!anyVideo);
  gcall.people.forEach(name => {
    const t = groupTile(name);
    const p = gcall.peers.get(key(name));
    const hasVideo = p && p.stream && p.stream.getVideoTracks().length;
    // Always attach their stream (Chrome only plays call audio through the volume
    // control if it's also on a media element); it's muted unless that failed.
    if (p && p.stream && t._video.srcObject !== p.stream) { t._video.srcObject = p.stream; t._video.play().catch(() => {}); }
    t._video.muted = !(p && p.muted === false);
    t._video.classList.toggle('hidden', !hasVideo);
    t.querySelectorAll('.avatar').forEach(a => a.remove());
    if (!hasVideo) t.prepend(avatar(name, { click: false }));
    const state = p ? p.pc.connectionState : 'new';
    t.querySelector('.tstate').textContent = state === 'connected' ? '' : state === 'failed' ? "Couldn't connect" : 'Connecting\u2026';
    tiles.push(t);
  });
  if (gcall.video && gcall.local) {
    const mine = groupTile(me_name(), true);
    if (mine._video.srcObject !== gcall.local) { mine._video.srcObject = gcall.local; mine._video.style.transform = 'scaleX(-1)'; }
    tiles.push(mine);
  }
  $('gtiles').replaceChildren(...tiles);
  if (!gcall.people.length) $('gtiles').prepend(h('div', { style: 'color:rgba(255,255,255,.7);font-size:13px;padding:20px' }, 'Waiting for others to join\u2026'));
  updateGStatus();
}
const me_name = () => (me ? me.name : 'You');

function setGStatus(text) { $('gstatus').textContent = text; }

function updateGStatus() {
  if (!gcall) return;
  const n = gcall.people.length + 1;
  const s = gcall.since ? Math.floor((Date.now() - gcall.since) / 1000) : 0;
  const text = gcall.id ? `${n} ${n === 1 ? 'person' : 'people'} \u00b7 ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : 'Joining\u2026';
  setGStatus(text);
  const m = $('ministatus');
  if (m) m.textContent = `Group call \u00b7 ${text}`;
}

function syncGroupView() {
  const here = gcall && openId === gcall.convo;
  $('callpanel').classList.add('hidden');
  $('gcallpanel').classList.toggle('hidden', !here);
  $('callmini').classList.toggle('hidden', !gcall || here);
  if (!gcall) return;
  const muteBtn = () => { const b = cbtn('', '\u{1F399}\uFE0F', gcall.micOff ? 'Unmute' : 'Mute', e => { e.stopPropagation(); toggleMute(); }); b.classList.toggle('off', !!gcall.micOff); return b; };
  const camBtn = gcall.video && cbtn('', '\u{1F4F7}', 'Turn camera off', () => {
    const t = gcall.local && gcall.local.getVideoTracks()[0];
    if (!t) return;
    t.enabled = !t.enabled;
    camBtn.classList.toggle('off', !t.enabled);
  });
  $('gctrls').replaceChildren(...[muteBtn(), camBtn, cbtn('hang', '\u{1F4DE}', 'Leave call', () => leaveGroupCall(true))].filter(Boolean));
  if (!here) {
    $('callmini').replaceChildren(
      h('div', { class: 't' }, h('b', { id: 'ministatus' }, 'Group call'), gcall.name),
      muteBtn(), cbtn('hang', '\u{1F4DE}', 'Leave call', e => { e.stopPropagation(); leaveGroupCall(true); }));
  }
  paintGroup();
  renderHeader();
}

function leaveGroupCall(tellServer, message) {
  if (!gcall) return;
  const g = gcall;
  gcall = null;
  if (tellServer && g.id) api('gcallLeave', { convo: g.convo }).catch(() => {});
  clearTimeout(g.pollTimer);
  clearInterval(g.tick);
  for (const p of g.peers.values()) { try { p.pc.close(); } catch (e) {} try { if (p.src) p.src.disconnect(); } catch (e) {} }
  if (g.local) g.local.getTracks().forEach(t => t.stop());
  $('gtiles').replaceChildren();
  ['gcallpanel', 'callmini'].forEach(id => $(id).classList.add('hidden'));
  if (message) toast(message);
  renderHeader();
  pollNow();
}

// "alice started a call in Squad" card with Join.
function groupCallInvite(p) {
  if (call || gcall || isMuted(p.convo)) return;
  $('callring').replaceChildren(
    avatar(p.from, { click: false }),
    h('div', { class: 't' }, h('b', null, p.text || 'Group call'), h('span', null, `${p.from} started a ${p.video ? 'video ' : ''}call`)),
    cbtn('hang', '\u2715', 'Dismiss', () => { ringtone(null); $('callring').classList.add('hidden'); }),
    cbtn('accept', '\u{1F4DE}', 'Join', () => joinGroupCall(p.convo, !!p.video)));
  $('callring').classList.remove('hidden');
  ringtone('incoming');
  setTimeout(() => { if (!gcall && !call) { ringtone(null); $('callring').classList.add('hidden'); } }, 15000);
}

// ---------- notifications ----------
let settings = { slow: 0 };
let pingTop = null; // newest notification we've handled
let eMax = 0;       // newest reaction change seen in the open chat
const prefs = Object.assign({ sound: true, ring: true, desktop: false }, JSON.parse(store.get('chat_prefs') || '{}'));
const savePrefs = () => store.set('chat_prefs', JSON.stringify(prefs));

function applyTheme() {
  const t = prefs.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  const was = document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.querySelector('meta[name="theme-color"]').content = dark ? '#181b24' : '#ffffff';
  if (was !== document.documentElement.dataset.theme && me) {
    // Names were coloured for the old theme: redraw them.
    sideSig = '';
    renderSide();
    switchTo(openId);
  }
}
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

const forMe = p => !!(me && (p.men || []).includes(key(me.name)));
function handlePings(pings) {
  // Incoming calls get their own ringing screen instead of a pop-up.
  pings.filter(p => p.kind === 'call').forEach(p => incomingCall(p));
  pings.filter(p => p.kind === 'gcall').forEach(p => groupCallInvite(p));
  pings = pings.filter(p => p.kind !== 'call' && p.kind !== 'gcall');
  pings.filter(p => (p.kind === 'dm' || p.kind === 'group') && p.convo)
    .forEach(p => notePreview(p.convo, { name: p.from, text: p.text, time: Date.now() }));
  if (!pings.length) return;
  // Skip what you're already looking at (comments live inside the feed, so they always count).
  // Friend requests/accepts change the friends list: fetch it on the very next poll.
  if (pings.some(p => p.kind === 'friendreq' || p.kind === 'friendaccept')) { uv = null; pollNow(); }
  const shown = pings.filter(p => p.kind === 'comment' || p.kind === 'removed' || p.kind === 'friendreq' || p.kind === 'friendaccept' ||
      !(p.convo === openId && !document.hidden))
    .filter(p => p.kind === 'removed' || !p.convo || (!isMuted(p.convo) && !(p.kind === 'group' && notifyLevel(p.convo) === 'mentions' && !forMe(p))));
  if (!shown.length) return;
  if (prefs.sound) ding();
  // Mentions and replies to you matter most, so they win over other pings.
  const p = shown.filter(forMe).pop() || shown[shown.length - 1];
  const where = p.kind === 'group' && forMe(p) ? (mentionsMe(p.text || '') ? 'mentioned you in ' : 'replied to you in ') + (p.gname || 'a group')
    : p.kind === 'dm' ? 'sent you a message' : p.kind === 'group' ? 'posted in a group'
    : p.kind === 'comment' ? 'commented' : p.kind === 'removed' ? 'removed you from a group' : 'mentioned you';
  const text = p.kind === 'removed' ? `${p.from} removed you from "${p.text}"`
    : p.kind === 'friendreq' ? `${p.from} sent you a friend request`
    : p.kind === 'friendaccept' ? `${p.from} accepted your friend request! Click to say hi.`
    : `${p.from} ${where}: ${p.text}`;
  const go = () => (p.kind === 'removed' ? null
    : p.kind === 'friendreq' ? (isPhone() ? mtab('friends') : document.body.classList.add('side-open')) // requests live in the sidebar
    : p.kind === 'friendaccept' ? openDm(p.from)
    : p.kind === 'comment' || (p.convo === 'global' && p.id) ? openPost(p.post || p.id) : switchTo(p.convo));
  if (!document.hidden) toast(text, false, go);
  if (prefs.desktop && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification(p.kind.startsWith('friend') || p.kind === 'removed' ? text : `${p.from} ${where}`,
        { body: p.kind.startsWith('friend') || p.kind === 'removed' ? '' : p.text, icon: $('favicon').href, tag: 'idiocy-' + (p.convo || p.kind) });
      n.onclick = () => { window.focus(); go(); n.close(); };
    } catch (e) {}
  }
}

// A short two-note chime, made in code so there's no sound file to load.
let audio = null;
function ding() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    [[880, 0], [1320, 0.09]].forEach(([f, dt]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.exponentialRampToValueAtTime(0.18, t + dt + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.25);
      o.connect(g).connect(audio.destination);
      o.start(t + dt);
      o.stop(t + dt + 0.3);
    });
  } catch (e) {}
}
// Browsers only allow sound after the user has interacted with the page.
document.addEventListener('pointerdown', () => { try { if (audio && audio.state === 'suspended') audio.resume(); } catch (e) {} });

// "(2) Idiocy" plus a red dot on the tab icon when chats have unread messages.
const baseIcon = $('favicon').href;
let iconWithDot = null, lastUnread = -1;
function updateTitle() {
  const n = st ? st.convos.filter(c => isUnread(c.id)).length : 0;
  $('menu').classList.toggle('unread', n > 0); // phones: the chat list is hidden behind the menu
  if (n === lastUnread) return;
  lastUnread = n;
  document.title = n ? `(${n}) Idiocy` : 'Idiocy';
  // Added to the home screen? Put the count on the app icon too.
  try { if (navigator.setAppBadge) (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {}); } catch (e) {}
  if (!n) { $('favicon').href = baseIcon; return; }
  if (iconWithDot) { $('favicon').href = iconWithDot; return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0, 64, 64);
    g.fillStyle = '#e0344f';
    g.beginPath(); g.arc(50, 14, 13, 0, Math.PI * 2); g.fill();
    g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke();
    iconWithDot = c.toDataURL('image/png');
    if (lastUnread > 0) $('favicon').href = iconWithDot;
  };
  img.src = baseIcon;
}

// ---------- admin: set someone's email ----------
// Makes it their verified email straight away. You never see what it was before.
async function adminSetEmail(name, done) {
  const typed = prompt(`New email for ${name}.\n\nIt becomes their verified email straight away (no code needed). Their current email isn't shown, and they can change it later in Settings.`);
  if (typed == null || !typed.trim()) return;
  const d = await act('adminSetEmail', { username: name, email: typed.trim() });
  if (!d) return;
  toast(`${d.username} now has a verified email \u2713`);
  if (done) done();
}

// ---------- renaming ----------
async function renameUser(name, asAdmin, done) {
  const self = me && key(name) === key(me.name) && !asAdmin;
  const typed = prompt(self
    ? 'Your new username (3-20 letters, numbers, spaces, _ or -).\nYour messages, friends and chats all move over. You can change it once an hour.'
    : `New username for ${name}:`, self ? '' : name);
  if (typed == null || !typed.trim() || typed.trim() === name) return;
  const d = self ? await act('renameMe', { username: typed.trim() }) : await act('adminRename', { username: name, newName: typed.trim() });
  if (!d) return;
  if (self || key(name) === key(me.name)) me.name = d.username;
  profiles.delete(key(name));
  uv = null; // fetch friends/chats with the new name straight away
  toast(self ? `You're now ${d.username}` : `${name} is now ${d.username}`);
  sideSig = '';
  renderSide();
  renderHeader();
  if (done) done();
}

// ---------- deleting accounts ----------
const DELETE_WARNING = 'This removes the account and everything it made: messages, posts, comments, pictures, reactions and DMs. It can\u2019t be undone.';

async function adminDeleteAccount(name, done) {
  const typed = prompt(`Delete ${name} forever?\n\n${DELETE_WARNING}\n\nType their username to confirm:`);
  if (typed == null) return;
  if (key(typed) !== key(name)) return toast("That doesn't match, so nothing was deleted", true);
  if (await act('adminDeleteAccount', { username: name })) {
    toast(`${name} was deleted`);
    profiles.delete(key(name));
    if (done) done();
  }
}

function openDeleteMyAccount() {
  const pass = h('input', { type: 'password', placeholder: 'Your password', autocomplete: 'current-password' });
  const confirmBox = h('input', { type: 'checkbox' });
  const go = h('button', { class: 'primary', style: 'background:var(--danger)' }, 'Delete my account');
  const md = modal('',
    h('h2', null, 'Delete your account?'),
    h('div', { style: 'color:var(--muted);font-size:14px' }, DELETE_WARNING),
    pass,
    h('label', { class: 'toggle' }, h('span', null, 'I understand this is permanent'), confirmBox),
    h('div', { class: 'btns' }, h('button', { class: 'ghost', onclick: () => md.close() }, 'Cancel'), go));
  go.onclick = async () => {
    if (!confirmBox.checked) return toast('Tick the box to confirm', true);
    if (!pass.value) return toast('Enter your password', true);
    go.disabled = true;
    go.classList.add('busy');
    try {
      const d = await api('deleteMyAccount', { password: pass.value });
      if (!d.ok) { if (!d.auth) toast(d.error || 'Something went wrong', true); return; }
      md.close();
      signOut('Your account was deleted. Bye!');
    } catch (e) {
      toast('Could not reach the server', true);
    } finally {
      go.disabled = false;
      go.classList.remove('busy');
    }
  };
  pass.focus();
}

function openAdmin() {

          u.role === 'admin' && h('span', { class: 'badge' }, 'ADMIN'),

          u.muted > Date.now() && h('span', { class: 'badge', style: 'background:var(--panel-2);color:var(--muted)' }, 'TIMED OUT'),

// ---------- commands ----------
function handleCommand(input) {
  const [cmd, ...rest] = input.slice(1).split(' ');
  const arg = rest.join(' ').trim();
  const admin = me && me.role === 'admin';
  switch (cmd.toLowerCase()) {
    case 'help':
      sys(admin
        ? 'Admin commands: /clear (wipes Global), /ban <username>, /unban <username>. Hover any message to delete it.'
        : 'Hover your own messages to delete them. Add friends in the sidebar to DM them or make groups.');
      return true;
    case 'clear':
      if (!admin) return false;
      if (confirm('Delete ALL Global messages for everyone?')) act('clearGlobal');
      return true;
    case 'ban':
    case 'unban':
      if (!admin) return false;
      if (!arg) { sys(`Usage: /${cmd} <username>`); return true; }
      act(cmd.toLowerCase(), { username: arg }).then(d => { if (d) toast(`${d.username} ${cmd.toLowerCase() === 'ban' ? 'banned' : 'unbanned'}`); });
      return true;
  }
  return false;
}

// ---------- wiring ----------
$('send').addEventListener('submit', async e => {
  e.preventDefault();
  const text = textEl.value.trim();
  const att = attachment;
  if (!text && !att) return;
  if (isPendingChat(openId)) return;
  if (!att && text.startsWith('/') && handleCommand(text)) { textEl.value = ''; updateCount(); return; }
  textEl.value = '';
  setAttachment(null);
  updateCount();
  if (!(await send(text, att))) {
    // Put things back so nothing is lost, unless something new was started.
    if (!textEl.value) { textEl.value = text; updateCount(); }
    if (att && !attachment) setAttachment(att);
  }
  textEl.focus();
});

// Post box: grows as you type; Ctrl/Cmd+Enter posts, Enter makes a new line.
const TOUCH = matchMedia('(hover: none)').matches;
const POST_HINT = TOUCH ? '' : /Mac|iPhone|iPad/.test(navigator.platform) ? '\u2318+Enter to post' : 'Ctrl+Enter to post';
$('postcount').textContent = POST_HINT;
const postEl = $('posttext');
function growPost() {
  postEl.style.height = 'auto';
  postEl.style.height = Math.min(180, postEl.scrollHeight + 2) + 'px';
  const left = 1000 - postEl.value.length;
  $('postcount').textContent = left <= 100 ? `${left} left` : POST_HINT;
}
postEl.addEventListener('input', growPost);
postEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitPost(); } });
postEl.addEventListener('paste', e => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  attachFile(item.getAsFile());
});
$('postimg').onclick = () => $('attachfile').click();
$('postbtn').onclick = submitPost;

async function submitPost() {
  const text = postEl.value.trim();
  const att = attachment;
  if ((!text && !att) || $('postbtn').disabled) return;
  if (!att && text.startsWith('/') && handleCommand(text)) { postEl.value = ''; growPost(); return; }
  postEl.value = '';
  setAttachment(null);
  growPost();
  if (!(await send(text, att))) {
    if (!postEl.value) { postEl.value = text; growPost(); }
    if (att && !attachment) setAttachment(att);
  }
}

function updateCount() {
  const left = MAX_MSG - textEl.value.length;
  $('count').textContent = left <= 50 ? left : '';
}
textEl.addEventListener('input', updateCount);
let typingSent = 0;
textEl.addEventListener('input', () => {
  const c = st && st.convos.find(x => x.id === openId);
  if (!c || (c.type !== 'dm' && c.type !== 'group') || !textEl.value.trim() || serverApi < 9) return;
  if (Date.now() - typingSent < 3000) return;
  typingSent = Date.now();
  apiRaw('typing', { convo: openId }).catch(() => {});
});

$('scrim').onclick = () => document.body.classList.remove('side-open');

});

if (token) start(); else showAuth();
