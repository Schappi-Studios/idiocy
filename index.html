<style>
  :root {
    --bg: #f4f5f9;
    --panel: #ffffff;
    --panel-2: #eef0f5;
    --hover: #e8eaf1;
    --border: #dde1ea;
    --text: #1b1e27;
    --muted: #6b7285;
    --accent: #6a4cf5;
    --accent-2: #7c5cff;
    --danger: #e0344f;
    --ok: #1fae6e;
    --gold: #ffc857;
    --admin: #d11a2a;
    color-scheme: light;
  }
  /* Dark mode: chosen in Settings, or following the device when set to Auto. */
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --panel: #181b24;
    --panel-2: #222633;
    --hover: #2a2f3d;
    --border: #2e3342;
    --text: #e8eaf1;
    --muted: #9aa1b3;
    --accent: #8b73ff;
    --accent-2: #9d88ff;
    --danger: #ff5a70;
    --ok: #2ecc8a;
    --admin: #ff4d5e;
    color-scheme: dark;
  }
  :root[data-theme="dark"] .ment.you { color: #ffd98a; }
  :root[data-theme="dark"] .msg.post.mentioned { background: #2a2618; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; }
  input, textarea {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    outline: none;
    min-width: 0;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }
  .primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 18px; font-weight: 600; cursor: pointer;
  }
  .primary:hover { background: var(--accent-2); }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: var(--accent); }
  .ghost.danger:hover { color: var(--danger); border-color: var(--danger); }
  .hidden { display: none !important; }
  .admin-name { color: var(--admin) !important; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .5px;
    background: var(--gold); color: #1a1400; border-radius: 4px; padding: 1px 5px;
    vertical-align: 2px; margin-right: 6px;
  }

  /* ---------- auth ---------- */
  #auth {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  #auth .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 360px;
  }
  #auth h1 { margin: 0 0 16px; font-size: 22px; display: flex; align-items: center; gap: 12px; }
  .logo { border-radius: 50%; display: block; flex-shrink: 0; }
  #auth .logo { width: 56px; height: 56px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 0; font-weight: 800; font-size: 18px; letter-spacing: 1px;
  }
  .brand .logo { width: 32px; height: 32px; }
  #sideclose {
    display: none; margin-left: auto; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--panel-2);
    color: var(--muted); font-size: 16px; cursor: pointer; align-items: center; justify-content: center;
  }
  .tabs { display: flex; gap: 4px; background: var(--panel-2); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; background: none; border: 0; border-radius: 7px; padding: 8px; cursor: pointer; color: var(--muted);
  }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 600; }
  #authform { display: flex; flex-direction: column; gap: 10px; }
  #autherr { color: var(--danger); font-size: 13px; min-height: 18px; }

  /* ---------- app layout ---------- */
  #app { display: flex; height: 100%; height: 100dvh; } /* dvh follows phone browser bars */
  aside {
    width: 280px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }


  .me {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .me .who {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    background: none; border: 0; border-radius: 10px; padding: 4px; margin: -4px; cursor: pointer; text-align: left;
  }
  .me .who:hover { background: var(--hover); }
  .me .who .avatar { width: 36px; height: 36px; }
  .two { min-width: 0; display: flex; flex-direction: column; }
  .two b, .two .st { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .two .st { color: var(--muted); font-size: 12px; font-weight: 400; }
  .sec { padding: 12px 8px 4px; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 6px; color: var(--muted); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-radius: 8px; padding: 7px 8px;
    text-align: left; cursor: pointer; color: var(--text);
  }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--panel-2); }
  .row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.unread .label { font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #111;
  }
  .avatar.icon { background: var(--panel-2); color: var(--muted); border-radius: 8px; }
  .avatar { position: relative; background-size: cover; background-position: center; }
  .avatar[data-user] { cursor: pointer; }
  .presence {
    position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--ok); border: 2px solid var(--panel);
  }
  .row .x {
    background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px;
    border-radius: 6px; visibility: hidden;
  }
  .row:hover .x { visibility: visible; }
  .row .x:hover { color: var(--danger); }
  .req { padding: 6px 8px; font-size: 14px; }
  .req .actions { display: flex; gap: 6px; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 13px; padding: 4px 8px; }
  #addfriend { display: flex; gap: 6px; padding: 0 8px 8px; }
  #addfriend input { flex: 1; padding: 7px 10px; font-size: 14px; }
  #addfriend button { padding: 7px 12px; }

  /* ---------- chat pane ---------- */
  main header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; min-height: 56px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  #menu { display: none; background: none; border: 0; font-size: 20px; cursor: pointer; padding: 0 4px; color: var(--muted); }
  #status { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  #status.online { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #status.offline { background: var(--danger); }
  .titles { flex: 1; min-width: 0; }
  #title { font-size: 16px; font-weight: 700; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log {
    flex: 1; overflow-y: auto;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .msg {
    position: relative; padding: 6px 8px; border-radius: 6px; overflow-wrap: anywhere;
    display: grid; grid-template-columns: 36px 1fr; column-gap: 10px; margin-top: 6px;
  }
  .msg:hover { background: var(--panel); }
  .msg > .avatar { width: 36px; height: 36px; grid-row: span 2; margin-top: 2px; }
  .msg .head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .msg .body { grid-column: 2; }
  .msg .name { font-weight: 700; cursor: pointer; }
  .msg .name:hover { text-decoration: underline; }
  .msg .time { color: var(--muted); font-size: 11px; }
  .msg .badge { margin-right: 0; }
  /* Follow-up messages from the same person skip the picture and name. */
  .msg.cont { margin-top: 0; padding-top: 1px; padding-bottom: 1px; }
  .msg.cont > .avatar, .msg.cont .head { display: none; }
  /* Hover toolbar: react, report, delete */
  .msg .acts {
    display: none; position: absolute; right: 8px; top: -14px; z-index: 2; gap: 2px; padding: 2px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 2px 8px rgba(20, 24, 40, .12);
  }
  .msg:hover .acts, .msg.picking .acts { display: flex; }
  .acts button {
    background: none; border: 0; border-radius: 6px; padding: 3px 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px;
  }
  .acts button:hover { background: var(--hover); color: var(--text); }
  .acts button.danger:hover { color: var(--danger); }
  .msg.pending { opacity: .55; }
  .msg.pending .acts { display: none !important; }

  .reacts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .reacts:empty { display: none; }
  .reacts button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 1px 8px;
    font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--text);
  }
  .reacts button:hover { border-color: var(--accent); }
  .reacts button.mine { border-color: var(--accent); background: rgba(106, 76, 245, .1); color: var(--accent); font-weight: 600; }
  .reacts button.pop { animation: dotpop .3s ease-out; }
  .picker {
    position: fixed; z-index: 40; display: flex; gap: 2px; padding: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(20, 24, 40, .18); animation: popin .15s ease-out;
  }
  .picker button { font-size: 22px; background: none; border: 0; border-radius: 8px; padding: 4px 6px; cursor: pointer; transition: transform .1s; }
  .picker button:hover { background: var(--hover); transform: scale(1.2); }

  .msg.mentioned { background: rgba(255, 200, 87, .16); box-shadow: inset 3px 0 0 var(--gold); }
  .msg.mentioned:hover { background: rgba(255, 200, 87, .24); }
  .ment { color: var(--accent); font-weight: 600; background: rgba(106, 76, 245, .1); border-radius: 4px; padding: 0 2px; }
  .ment.you { color: #8a5a00; background: rgba(255, 200, 87, .45); }

  .me .iconbtn { width: 34px; height: 34px; }
  .composer-note { color: var(--muted); font-size: 12px; padding: 6px 16px 0; background: var(--panel); border-top: 1px solid var(--border); }
  .composer-note + #attachbar, .composer-note + #send { border-top: 0; }
  .composer-note.warn { color: var(--danger); }

  .tabbar { display: flex; gap: 4px; background: var(--panel-2); border-radius: 10px; padding: 4px; }
  .tabbar button { flex: 1; background: none; border: 0; border-radius: 7px; padding: 7px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tabbar button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(20, 24, 40, .1); }
  .modal.wide { max-width: 560px; }
  .alist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 55vh; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .card q { display: block; background: var(--panel-2); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; quotes: none; }
  .card .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }
  .urow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .urow .nm { flex: 1; min-width: 120px; cursor: pointer; font-weight: 600; }
  .urow .nm:hover { text-decoration: underline; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

  /* ---------- email ---------- */
  .vbadge { color: var(--accent); font-weight: 800; }
  .linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font: inherit; font-size: 13px; }
  .linkbtn:hover { text-decoration: underline; }
  .emailbox { display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--border); padding-top: 10px; }
  .emailbox .row2 { display: flex; gap: 8px; }
  .emailbox .row2 input { flex: 1; min-width: 0; }
  .emailbox .hint { color: var(--muted); font-size: 12px; }
  #acodebox { display: flex; flex-direction: column; gap: 8px; }
  #acodebox.hidden { display: none; }
  .authhint { color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 8px; }
  /* ---------- verify your email ---------- */
  .verifybar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; margin: 0;
    background: linear-gradient(135deg, var(--accent), #b04cf5); color: #fff; font-size: 15px;
  }
  .verifybar.hidden { display: none; }
  .verifybar .vbtext { flex: 1; min-width: 180px; }
  .verifybar .vbgo {
    border: 0; border-radius: 999px; padding: 10px 18px; background: #fff; color: var(--accent); font: inherit; font-weight: 800; cursor: pointer;
  }
  aside .verifybar { border-radius: 14px; margin: 4px 12px 8px; }
  @media (min-width: 721px) { aside .verifybar { display: none; } } /* computers: the one above the chat is enough */
  .composer-note.verify { cursor: pointer; font-weight: 600; }
  /* ---------- pinned message ---------- */
  #pinbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    background: var(--panel-2); border-bottom: 1px solid var(--border);
  }
  #pinbar.hidden { display: none; }
  #pinbar .pintext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pinbar button { border: 0; background: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 4px 6px; }
  #pinbar button.hidden { display: none; }
  /* ---------- @mention suggestions ---------- */
  .mentionbox {
    position: fixed; z-index: 1000; display: flex; flex-direction: column; padding: 4px; max-height: 260px; overflow-y: auto;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
  }
  .mentionbox button {
    display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--text); font: inherit; font-size: 14px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer; text-align: left;
  }
  .mentionbox button.on, .mentionbox button:hover { background: var(--hover); }
  .mentionbox .avatar { width: 24px; height: 24px; font-size: 12px; flex: none; }
  .ginfo .modbadge { font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; }
  .notifychips { display: flex; gap: 6px; flex-wrap: wrap; }
  .notifychips button { padding: 6px 12px; font-size: 13px; }
  .memmenu .btns { flex-direction: column; align-items: stretch; }
  .modal.verify .lead { color: var(--muted); font-size: 14px; }
  .spamnote {
    font-size: 13px; line-height: 1.4; padding: 10px 12px; border-radius: 10px; color: var(--text);
    background: rgba(255, 200, 87, .18); border: 1px solid rgba(255, 200, 87, .55);
  }
  #toast.click { cursor: pointer; }

  /* ---------- chat polish ---------- */
  .msg .body a, .post .body a, .cmt .bubble a { color: var(--accent); text-decoration: underline; overflow-wrap: anywhere; }
  .quote {
    display: block; border-left: 3px solid var(--accent); background: var(--panel-2); border-radius: 6px;
    padding: 3px 8px; margin: 2px 0 4px; font-size: 13px; color: var(--muted); cursor: pointer;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px;
  }
  .quote b { color: var(--text); margin-right: 4px; }
  .quote:hover { background: var(--hover); }
  .edtag { color: var(--muted); font-size: 11px; }
  .msg.flash { animation: glow 1.2s ease-out 2; }
  .editbox { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .editbox textarea { min-height: 38px; font-size: 14px; padding: 6px 10px; }
  .editbox .hint { color: var(--muted); font-size: 11px; }
  #replybar {
    display: flex; align-items: center; gap: 10px; padding: 8px 16px 0; background: var(--panel);
    border-top: 1px solid var(--border); font-size: 13px; color: var(--muted);
  }
  #replybar + #composernote, #replybar ~ #send { border-top: 0; }
  #replybar .rtext { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #replybar b { color: var(--text); }
  #replyx { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 15px; border-radius: 6px; padding: 2px 8px; }
  #replyx:hover { color: var(--danger); background: var(--hover); }
  #typing { height: 0; overflow: visible; position: relative; }
  #typing span {
    position: absolute; left: 16px; bottom: 4px; font-size: 12px; color: var(--muted); background: var(--bg);
    padding: 1px 8px; border-radius: 999px; animation: fadein .2s;
  }
  #typing i { display: inline-block; width: 4px; height: 4px; border-radius: 50%; background: var(--muted); margin-left: 2px; animation: pulse 1s infinite; }
  #typing i:nth-child(2) { animation-delay: .2s; } #typing i:nth-child(3) { animation-delay: .4s; }
  .olderload { text-align: center; color: var(--muted); font-size: 12px; padding: 8px; }

  /* ---------- calls ---------- */
  /* Call panel at the top of the DM (like Discord), so the chat stays usable. */
  .callpanel {
    background: #10131c; color: #fff; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px;
    border-bottom: 1px solid var(--border); animation: slidein .2s ease-out;
  }
  .callpanel .tiles { display: flex; gap: 10px; justify-content: center; align-items: center; }
  .callpanel .tile {
    position: relative; background: #1b1f2b; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; width: 150px; height: 104px; flex-shrink: 1;
  }
  .callpanel.hasvideo .tile { width: min(46%, 360px); height: auto; aspect-ratio: 4 / 3; }
  .callpanel .tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
  .callpanel .tile .avatar { width: 60px; height: 60px; font-size: 24px; cursor: default; }
  .callpanel .tile .label { position: absolute; left: 8px; bottom: 6px; font-size: 12px; font-weight: 700; text-shadow: 0 1px 3px #000; }
  .callpanel .tile.ringing .avatar, #callring .avatar { animation: ring 1.4s ease-out infinite; }
  @keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(124, 92, 255, .6); } 100% { box-shadow: 0 0 0 22px rgba(124, 92, 255, 0); } }
  #lvid { transform: scaleX(-1); }
  .callpanel .bar { display: flex; align-items: center; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #cstatus { color: rgba(255, 255, 255, .75); font-size: 13px; min-width: 70px; text-align: center; }
  .cbtn {
    width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; font-size: 18px; flex-shrink: 0;
    background: rgba(255, 255, 255, .14); color: #fff; display: flex; align-items: center; justify-content: center;
  }
  .cbtn:hover { background: rgba(255, 255, 255, .24); }
  .cbtn.off { background: #fff; color: #111; }
  .cbtn.hang { background: #e0344f; }
  .cbtn.hang:hover { background: #f04763; }
  .cbtn.accept { background: #1fae6e; }
  .cbtn.accept:hover { background: #26c77f; }
  .vol { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, .8); }
  .vol input { width: 110px; accent-color: #9b82ff; }
  .vol .pct { width: 38px; text-align: right; }

  .callpanel .tiles { flex-wrap: wrap; }
  .callpanel.group .tile { width: 150px; height: 112px; }
  .callpanel.group.hasvideo .tile { width: min(31%, 260px); height: auto; aspect-ratio: 4 / 3; }
  .tile .tvol {
    position: absolute; right: 6px; bottom: 4px; width: 70px; accent-color: #9b82ff; opacity: 0; transition: opacity .15s;
  }
  .tile:hover .tvol, .tile .tvol:focus { opacity: 1; }
  .tile .tstate { position: absolute; top: 6px; left: 8px; font-size: 11px; color: rgba(255, 255, 255, .75); }
  #joincall { background: #1fae6e; color: #fff; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; font-size: 13px; }
  #joincall:hover { background: #26c77f; }
  /* Small bar at the bottom of the sidebar while you're in another chat. */
  #callmini {
    position: sticky; bottom: 0; margin-top: auto; background: #10131c; color: #fff;
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer;
  }
  #callmini .t { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #callmini .t b { display: block; color: #3ddc97; font-size: 12px; }
  #callmini .cbtn { width: 34px; height: 34px; font-size: 15px; }

  /* Incoming call: a card in the corner instead of covering the screen. */
  #callring {
    position: fixed; right: 16px; bottom: 16px; z-index: 45; background: #10131c; color: #fff; border-radius: 16px;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    animation: popin .25s ease-out; max-width: calc(100% - 32px);
  }
  #callring .avatar { width: 48px; height: 48px; font-size: 20px; cursor: default; }
  #callring .t { min-width: 0; }
  #callring .t b { display: block; font-size: 15px; }
  #callring .t span { font-size: 12px; color: rgba(255, 255, 255, .7); }
  #callbtn, #vcallbtn { width: 38px; height: 34px; font-size: 16px; }

  /* ---------- groups ---------- */
  #hicon:empty { display: none; }
  #hicon .avatar { width: 34px; height: 34px; }
  #title.link { cursor: pointer; }
  #title.link:hover { text-decoration: underline; }
  .msg.sysline {
    display: block; text-align: center; color: var(--muted); font-size: 12.5px;
    padding: 6px 8px; margin: 4px 0; background: none !important;
  }
  .msg.sysline span { background: var(--panel-2); border-radius: 999px; padding: 3px 12px; display: inline-block; }
  .muteicon { font-size: 12px; opacity: .6; }
  .ginfo .gtop { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .ginfo .gpic { width: 84px; height: 84px; font-size: 32px; cursor: default; }
  .ginfo .gname { font-size: 20px; font-weight: 800; overflow-wrap: anywhere; }
  .ginfo .gsub { color: var(--muted); font-size: 13px; }
  .ginfo .mrow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 8px; }
  .ginfo .mrow:hover { background: var(--hover); }
  .ginfo .mrow .nm { flex: 1; min-width: 0; cursor: pointer; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ginfo .members { display: flex; flex-direction: column; max-height: 260px; overflow-y: auto; }
  .ginfo .ownerbadge { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; }

  /* ---------- Global feed ---------- */
  #feedbox { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  #feedbox > * { width: 100%; max-width: 640px; margin: 0 auto; }
  #feedbox .fbrow { display: flex; gap: 10px; align-items: flex-start; }
  #feedbox .fbrow .avatar { width: 36px; height: 36px; margin-top: 3px; }
  #posttext { flex: 1; resize: none; min-height: 42px; max-height: 180px; overflow-y: auto; font: inherit; }
  #feedbox .fbact { display: flex; align-items: center; gap: 8px; padding-left: 46px; }
  /* Post sits on the same line as the typing box, a bit smaller than other buttons. */
  #feedbox .fbrow #postbtn { flex-shrink: 0; height: 36px; margin-top: 3px; padding: 0 14px; font-size: 14px; border-radius: 10px; }
  #feedbox .fbact .hint { color: var(--muted); font-size: 12px; }
  .camerabtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 18px;
    border: 0; border-radius: 999px; background: rgba(106, 76, 245, .12); color: var(--accent);
    font-size: 15px; font-weight: 600; cursor: pointer; flex-shrink: 0;
  }
  .camerabtn:hover { background: rgba(106, 76, 245, .2); }
  .camerabtn:disabled { opacity: .5; cursor: default; }
  .camerabtn, .pollbtn { white-space: nowrap; }
  @media (max-width: 720px) {
    #feedbox .camerabtn { flex: 1; max-width: 280px; height: 44px; padding: 0 12px; }
    #feedbox .pollbtn { height: 44px; padding: 0 12px; }
    #feedbox .fbact { gap: 6px; }
  }
  /* ---------- polls ---------- */
  .pollbtn { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-weight: 600; cursor: pointer; flex-shrink: 0; }
  .pollbtn:hover { background: var(--hover); }
  .poll { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-width: 420px; }
  .popt {
    position: relative; overflow: hidden; display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 9px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text);
    font: inherit; text-align: left; cursor: pointer;
  }
  .popt:hover { border-color: var(--accent); }
  .popt .bar { position: absolute; inset: 0 auto 0 0; background: rgba(106, 76, 245, .14); transition: width .3s; }
  .popt.mine { border-color: var(--accent); font-weight: 600; }
  .popt.mine .bar { background: rgba(106, 76, 245, .26); }
  .popt .ol, .popt .pc { position: relative; }
  .popt .ol { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .popt .pc { color: var(--muted); font-size: 13px; font-weight: 600; }
  .ptotal { color: var(--muted); font-size: 12px; }
  .modal.pollmaker .popts { display: flex; flex-direction: column; gap: 8px; }
  .modal.pollmaker .ghost { align-self: flex-start; }

  /* ---------- voice messages ---------- */
  .voice {
    display: flex; align-items: center; gap: 10px; margin-top: 4px; padding: 8px 12px 8px 8px; width: 240px; max-width: 100%;
    background: var(--panel-2); border-radius: 999px;
  }
  .voice .vplay {
    width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; flex-shrink: 0;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .voice .vbar { flex: 1; height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
  .voice .vfill { display: block; height: 100%; width: 0; background: var(--accent); }
  .voice .vtime { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #mic .i-send { display: none; }
  #send.recording #mic { background: var(--accent); border-color: var(--accent); color: #fff; }
  #send.recording #mic .i-mic { display: none; }
  #send.recording #mic .i-send { display: block; }
  #recbar { display: none; }
  #send.recording #recbar { display: flex; flex: 1; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; min-width: 0; }
  #send.recording #text, #send.recording #attach, #send.recording #count, #send.recording button[type=submit] { display: none; }
  #rectime { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .recdot { width: 10px; height: 10px; border-radius: 50%; background: var(--danger); animation: blink 1s infinite; }

<script>
// ===== CONFIG =====
// Your Apps Script web app URL (ends in /exec).
const SCRIPT_URL = 'https://api.schappistudios.com';
// If Idiocy moves to a new server, the old one says where; remember it (see apiRaw).
const API_URL = (() => {
  try { const u = localStorage.getItem('chat_api'); if (u && /^https:\/\/[^\s/]+/.test(u)) return u; } catch (e) {}
  return SCRIPT_URL;
})();
const MAX_MSG = 300;
// ==================

const POLL_ACTIVE = 2500;
const POLL_BUSY = 1500; // while the open chat had a message in the last 30s
const POLL_HIDDEN = 10000;

const $ = id => document.getElementById(id);
const log = $('log'), textEl = $('text');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

let token = store.get('chat_token');
let me = null;          // { name, role }
let st = null;          // friends, requests, convos
let uv = null;          // version of st the server last sent
let latest = {};        // newest message id per chat
let read = null;        // last read message id per chat
let openId = store.get('chat_open') || 'global';
let openRev = null;     // changes when messages in the open chat are deleted
let lastId = 0;         // newest message id shown in the open chat
let epoch = 0;          // bumps on chat switch so stale responses are ignored
let polling = false, pollAgain = false, pollTimer = null;
let lastError = '';
let sideSig = '';
const shown = new Set();

// ---------- helpers ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c); // strings become text, never HTML
  return el;
}

const key = n => String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function colorFor(n, lightness = 38) {
  // Name colours are dark for a light page; flip them lighter on a dark one.
  if (lightness < 50 && document.documentElement.dataset.theme === 'dark') lightness = 72;
  let hsh = 0;
  for (const c of key(n)) hsh = (hsh * 31 + c.charCodeAt(0)) >>> 0;
  // Hues 30-310 skip red and pink, which are kept for admins.
  return `hsl(${30 + hsh % 280} 70% ${lightness}%)`;
}

// Profiles are fetched in batches as names appear on screen, and refreshed
// once they're more than a minute old.
const profiles = new Map(); // key -> { data, at }
const profileWanted = new Set();
let profileTimer = null;
let profileVer = 0;

function profileOf(n) {
  const p = profiles.get(key(n));
  return p && p.data;
}

function wantProfiles(names) {
  names.forEach(n => {
    const p = profiles.get(key(n));
    if (!p || Date.now() - p.at > 60000) profileWanted.add(n);
  });
  if (profileWanted.size && !profileTimer && token) profileTimer = setTimeout(fetchProfiles, 50);
}

async function fetchProfiles() {
  profileTimer = null;
  const names = [...profileWanted].slice(0, 50);
  names.forEach(n => {
    profileWanted.delete(n);
    // Mark as fetched now so a slow response doesn't cause repeat requests.
    profiles.set(key(n), { data: profileOf(n) || null, at: Date.now() });
  });
  try {
    const d = await api('profiles', { names });
    if (d.ok) storeProfiles(d.profiles);
  } catch (e) {}
  if (profileWanted.size) profileTimer = setTimeout(fetchProfiles, 50);
}

function storeProfiles(map) {
  for (const [k, p] of Object.entries(map)) profiles.set(k, { data: p, at: Date.now() });
  profileVer++;
  document.querySelectorAll('.avatar[data-user]').forEach(paintAvatar);
  renderSide();
}

// opts.dot shows an online dot; opts.click = false disables opening the profile.
function avatar(n, opts = {}) {
  const el = h('div', {
    class: 'avatar',
    'data-user': key(n),
    'data-name': n,
    'data-dot': opts.dot ? '1' : null,
    title: opts.click === false ? null : n,
    onclick: opts.click === false ? null : e => { e.stopPropagation(); openProfile(n); },
  });
  if (opts.click === false) el.style.cursor = 'default';
  paintAvatar(el);
  wantProfiles([n]);
  return el;
}

function paintAvatar(el) {
  const n = el.dataset.name;
  const p = profileOf(n);
  if (p && p.avatar) {
    el.textContent = '';
    el.style.background = '';
    el.style.backgroundImage = `url("${p.avatar}")`; // server only accepts base64 image data URLs
  } else {
    el.style.backgroundImage = '';
    el.style.background = colorFor(n, 80);
    el.textContent = (n || '?')[0].toUpperCase();
  }
  if (el.dataset.dot && p && p.online) el.append(h('span', { class: 'presence', title: 'Online' }));
}

function modal(cls, ...kids) {
  const box = h('div', { class: 'modal ' + (cls || '') }, ...kids);
  const overlay = h('div', { class: 'overlay', onclick: e => { if (e.target === overlay) overlay.remove(); } }, box);
  document.body.append(overlay);
  return { overlay, box, close: () => overlay.remove() };
}

async function openProfile(name) {
  const m = modal('profile');
  const render = () => {
    const p = profileOf(name) || { username: name };
    const isMe = me && key(name) === key(me.name);

      else btns.push(...TIMEOUTS.map(([label, mins]) => h('button', { class: 'ghost', onclick: run('timeout', { username: name, minutes: mins }, () => toast(`${name} timed out for ${label}`)) }, 'Timeout ' + label)));
      btns.push(p.banned

        : h('button', { class: 'ghost danger', onclick: () => { if (confirm(`Ban ${name}?`)) run('ban', { username: name }, () => toast(`${name} banned`))(); } }, 'Ban'));
      if (serverApi >= 7) btns.push(h('button', { class: 'ghost', onclick: () => renameUser(p.username || name, true, () => m.close()) }, 'Rename'));
      if (serverApi >= 15) btns.push(h('button', { class: 'ghost', onclick: () => adminSetEmail(p.username || name, () => { profiles.delete(key(name)); openProfile(name); m.close(); }) }, '\u2709\uFE0F Set email'));

    }

      h('div', { class: 'inner' },
        big,

          p.banned && h('span', { class: 'badge', style: 'background:var(--danger);color:#fff' }, 'BANNED'),
          p.muted && h('span', { class: 'badge', style: 'background:var(--panel-2);color:var(--muted)' }, 'TIMED OUT'),
          p.verified && h('span', { class: 'vbadge', title: 'Verified email' }, '\u2713 Verified'),
          !p.verified && p.username && me && me.role === 'admin' && serverApi >= 15 && h('span', { class: 'badge', style: 'background:var(--panel-2);color:var(--muted)', title: 'No verified email' }, 'NO EMAIL')),
        h('div', { class: 'pstatus' },
          h('span', { class: 'dotsm' + (p.online ? ' on' : '') }),
          p.status || (p.online ? 'Online' : 'Offline')),
        p.game && h('div', { class: 'pgame' }, '\u{1F3AE} Playing ', h('b', null, p.game)),
        isBlocked(name) && h('div', { class: 'pmeta' }, '\u{1F6AB} You\u2019ve blocked them. They can\u2019t add or message you.'),

  render();

  const stWatch = setInterval(() => { if (!m.overlay.isConnected) clearInterval(stWatch); else if (m._st !== st) { m._st = st; render(); } }, 700);
  m._st = st;
  // Always get a fresh copy when opening someone's profile, plus their badges.
  try {

      serverApi >= 12 ? api('badges', { username: name }) : Promise.resolve(null)]);
    if (b && b.ok) m._badges = b;

async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = url;
    });
    // Center-crop to a 128px square JPEG so it fits in a Sheet cell.
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, size, size);
    g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', 0.85);
  } finally {
    URL.revokeObjectURL(url);
  }
}

let toastTimer;
function toast(msg, isErr, onClick) {
  let el = $('toast');
  if (!el) { el = h('div', { id: 'toast' }); document.body.append(el); }
  el.textContent = msg;
  el.className = (isErr ? 'err' : '') + (onClick ? ' click' : '');
  el.onclick = onClick ? () => { el.style.display = 'none'; onClick(); } : null;
  void el.offsetWidth; // restart the pop-in animation
  el.classList.add('show');
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

// ---------- network ----------
async function api(action, data) {
  const shows = action === 'send' || action === 'image';
  if (shows) progress(1);
  try {
    return await apiRaw(action, data);
  } finally {
    if (shows) progress(-1);
  }
}

async function apiRaw(action, data) {
  // A plain string body is sent as text/plain, which avoids a CORS preflight
  // (Apps Script can't answer those).
  const res = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify({ action, token, ...data }),
  });
  const d = await res.json();
  if (d.moved && d.moved !== API_URL && /^https:\/\/[^\s/]+/.test(d.moved)) {
    try { localStorage.setItem('chat_api', d.moved); } catch (e) {}
    location.reload();
    return new Promise(() => {}); // the page is reloading
  }
  if (!d.ok && d.auth) signOut(d.error);
  return d;
}

// For button actions: shows errors as a toast, returns the response or null.
// Top progress bar, on while any save/load the user started is running.
let working = 0;
function progress(n) {
  working = Math.max(0, working + n);
  $('progress').classList.toggle('on', working > 0);
}

// The button the user just pressed, so act() can show a spinner on it.
let pressed = null, pressedAt = 0;
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if (b) { pressed = b; pressedAt = Date.now(); }
}, true);
document.addEventListener('submit', e => {
  if (e.submitter) { pressed = e.submitter; pressedAt = Date.now(); }
}, true);

function takePressed() {
  // Generous window because confirm() dialogs pause between click and act().
  const b = pressed && Date.now() - pressedAt < 15000 && pressed.isConnected ? pressed : null;
  pressed = null;
  if (b) { b.classList.add('busy'); b.disabled = true; }
  return b;
}

let opsInFlight = 0; // polls that overlap an action may carry stale friends/chats
let stateGen = 0;

// For button actions: shows errors as a toast, returns the response or null.
// `optimistic(st)` updates the sidebar straight away; it's undone on failure.
async function act(action, data, onOk, optimistic) {
  const btn = takePressed();
  const before = optimistic && st ? JSON.stringify(st) : null;
  if (before) { optimistic(st); renderSide(); renderHeader(); }
  opsInFlight++;
  progress(1);
  try {
    const d = await api(action, data);
    if (!d.ok) {
      if (verifyError(d.error)) openVerify();
      else if (!d.auth) toast(d.error || 'Something went wrong', true);
      if (before) { st = JSON.parse(before); renderSide(); renderHeader(); }
      return null;
    }
    if (onOk) onOk(d);
    return d;
  } catch (e) {
    toast('Could not reach the server', true);
    if (before) { st = JSON.parse(before); renderSide(); renderHeader(); }
    return null;
  } finally {
    opsInFlight--;
    stateGen++;
    uv = null; // ask for a fresh friends/chats list on the next poll
    progress(-1);
    if (btn) { btn.classList.remove('busy'); btn.disabled = false; }
    pollNow();
  }
}

const drop = (list, n) => { const i = list.findIndex(x => key(x) === key(n)); if (i >= 0) list.splice(i, 1); };
const has = (list, n) => list.some(x => key(x) === key(n));

// ---------- auth ----------
let authMode = 'login';
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    authMode = b.dataset.mode;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $('apass').autocomplete = authMode === 'login' ? 'current-password' : 'new-password';
    $('aemail').classList.toggle('hidden', authMode !== 'register');
    $('forgotbtn').classList.toggle('hidden', authMode === 'register');
    $('autherr').textContent = '';
    resetSignupCode();
  };
});

// Signing up is two steps: send a code to your email, then type it in to make the account.
let signupSentTo = null; // the email/username the code went to
function resetSignupCode() {
  signupSentTo = null;
  $('acodebox').classList.add('hidden');
  $('acode').value = '';
  document.querySelector('#authform .primary').textContent = authMode === 'login' ? 'Log in' : 'Send code';
}
// Changing the email or username after the code went out means a new code.
['aemail', 'auser'].forEach(id => $(id).addEventListener('input', () => { if (signupSentTo) resetSignupCode(); }));
async function sendSignupCode() {
  const d = await api('signupStart', { username: $('auser').value, password: $('apass').value, email: $('aemail').value });
  if (!d.ok && d.error === 'Unknown action') return 'old'; // backend not updated yet: sign up the old way
  if (!d.ok) { $('autherr').textContent = d.error; return false; }
  signupSentTo = { email: $('aemail').value.trim(), user: $('auser').value };
  $('acodehint').replaceChildren(`We sent a 6-digit code to ${signupSentTo.email}. It expires in 10 minutes.`, spamNote());
  $('acodebox').classList.remove('hidden');
  document.querySelector('#authform .primary').textContent = 'Create account';
  $('acode').focus();
  return true;
}
$('aresend').onclick = async () => {
  $('autherr').textContent = '';
  if (await sendSignupCode() === true) toast('New code sent');
};

$('authform').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.querySelector('#authform .primary');
  btn.disabled = true;
  btn.classList.add('busy');
  $('autherr').textContent = '';
  try {
    let data = { username: $('auser').value, password: $('apass').value };
    if (authMode === 'register') {
      if (!signupSentTo) {
        if (!$('aemail').value.trim()) { $('autherr').textContent = 'Enter your email. You\u2019ll need it if you forget your password.'; return; }
        const sent = await sendSignupCode();
        if (sent !== 'old') return; // now waiting for the code (or showing an error)
      } else {
        if (!$('acode').value.trim()) { $('autherr').textContent = 'Enter the code from your email'; return; }
        data = Object.assign(data, { email: signupSentTo.email, code: $('acode').value });
      }
    }
    const d = await api(authMode, data);
    if (!d.ok) { $('autherr').textContent = d.error; return; }
    resetSignupCode();
    token = d.token;
    store.set('chat_token', token);
    $('apass').value = '';
    if (authMode === 'register') { prefs.news = NEWS.v; savePrefs(); } // new accounts: it's all new anyway
    start();
  } catch (err) {
    $('autherr').textContent = 'Could not reach the server';
  } finally {
    btn.disabled = false;
    btn.classList.remove('busy');
  }
});

function showAuth(msg) {
  $('app').classList.add('hidden');
  $('auth').classList.remove('hidden');
  $('autherr').textContent = msg || '';
  if (!SCRIPT_URL) $('autherr').textContent = 'Set SCRIPT_URL in chat.html first.';
}

function signOut(msg) {
  if (call) endCall(true);
  if (gcall) leaveGroupCall(true);
  token = null;
  store.del('chat_token');
  store.del(SNAP_KEY);        // the saved chat list and feed
  store.del('chat_prev');     // last-message previews in the chat list
  Object.keys(previews).forEach(k => delete previews[k]);
  clearTimeout(pollTimer);
  me = st = uv = read = null;
  pingTop = null;
  groupPicCache.clear();
  chatCache.clear();
  openRev = null; // so nothing from this account can be remembered for the next one
  clearLog();
  profiles.clear();
  updateTitle();
  latest = {};
  sideSig = '';
  hideLoading(true);
  showAuth(msg);
}

$('mename').onclick = () => { if (me) openProfile(me.name); };

async function logOut() {
  const t = token;
  signOut();
  try { await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'logout', token: t }) }); } catch (e) {}
}

function start() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  if (isPhone()) { openId = 'global'; setView('chats'); } // phones open on the chat list
  // Show what we knew last time straight away; the first poll then brings it up to date.
  const instant = restoreSnapshot();
  if (!instant) showLoading();
  switchTo(openId);
  if (instant) { renderSide(); renderHeader(); updateComposer(); updateTitle(); }
}

// ---------- instant startup ----------
// A copy of the chat list and the (public) Global feed, saved on this device so the app
// can open instantly instead of waiting for the server. DM and group messages are never
// saved here: they stay private and load fresh.
const SNAP_KEY = 'chat_snap';
let snapSaved = 0;
function saveSnapshot(force) {
  if (!token || !me || !st || (!force && Date.now() - snapSaved < 15000)) return;
  snapSaved = Date.now();
  const feed = openId === 'global' && openRev

// ---------- polling ----------
async function poll() {
  if (!token) return;
  if (polling) { pollAgain = true; return; }
  polling = true;
  const myEpoch = epoch;
  const myGen = stateGen;
  try {
    const d = await api('poll', {
      open: openId, after: lastId, eafter: eMax, uv, rev: openRev, pingAfter: pingTop,
      k: me ? key(me.name) : undefined, known: st ? st.convos.map(c => c.id) : undefined, // lets the server batch its reads
    });
    if (!d.ok) {
      if (!d.auth && d.error !== lastError) { lastError = d.error; sys('Server error: ' + d.error, true); }
      hideLoading(); // so the error is visible
      return;
    }
    lastError = '';
    setStatus(true);
    me = d.me;
    latest = d.latest;
    streaks = d.streaks || {};
    stories = d.stories || [];
    settings = d.settings || settings;
    if ((d.api || 0) !== serverApi) { serverApi = d.api || 0; log.querySelectorAll('.post').forEach(paintCommentCount); }
    if (pingTop === null) pingTop = d.pingTop; // first poll: don't replay old notifications
    else if (d.pings && d.pings.length) {
      pingTop = Math.max(pingTop, ...d.pings.map(p => p.n));
      handlePings(d.pings);
    }
    // A poll that overlapped an action may describe the world before it.
    if (d.state && myGen === stateGen && !opsInFlight) { st = d.state; uv = d.uv; }
    loadRead();

    if (myEpoch === epoch) {
      if (d.open !== openId && !isPendingChat(openId)) {
        // Chat is gone (left the group, unfriended, etc.)
        switchTo('global');
        return;
      }
      if (d.reset) {
        const sending = [...log.querySelectorAll('.pending')];
        clearLog();
        openRev = d.rev;
        olderMore = d.messages.length >= 100; // the server keeps the latest 100; there may be more
        if (!d.messages.length && !sending.length) sys(emptyText()).classList.add('empty');
        log.append(...sending);
      }
      if (d.messages) renderBatch(d.messages, !d.reset);
      if (d.messages && d.messages.length && !d.reset) lastActivity = Date.now();
      if (d.edited) d.edited.forEach(updateMessage);
      showTyping(d.typing || []);
      openGcall = d.gcall || null;
      if (d.reset) { hideLoading(); scrollDown(); }
      markRead();
    }
    renderSide();
    renderHeader();
    updateComposer();
    updateTitle();
    loadGroupPics();
    saveSnapshot();
    maybeShowNews();
  } catch (e) {
    setStatus(false);
  } finally {
    polling = false;
    if (pollAgain) { pollAgain = false; poll(); } else schedule();
  }
}

let lastActivity = 0; // when the open chat last had a new message

function schedule() {
  clearTimeout(pollTimer);
  // Check a bit more often while messages are flowing, back off when quiet.
  const busy = Date.now() - lastActivity < 30000 || (st && (st.outgoing.length || st.incoming.length) > 0);
  if (token) pollTimer = setTimeout(poll, document.hidden ? POLL_HIDDEN : busy ? POLL_BUSY : POLL_ACTIVE);
}

// Friend actions update the sidebar immediately; the server catches up after.
function respond(n, accept) {
  return act('friendRespond', { username: n, accept }, null, s => {
    drop(s.incoming, n);

  });
}

function unfriend(n) {
  return act('unfriend', { username: n }, null, s => { drop(s.friends, n); drop(s.outgoing, n); });
}

function requestFriend(n) {
  return act('friendRequest', { username: n }, null, s => {
    if (has(s.friends, n)) return;
    if (has(s.incoming, n)) { drop(s.incoming, n); s.friends.push(n); } // they'd already asked us
    else if (!has(s.outgoing, n)) s.outgoing.push(n);
  });

// Messages of recently opened chats, kept in memory only (never saved to the
// device, since DMs are private), so switching back is instant.
const chatCache = new Map();

function rememberChat() {
  if (!openRev || isPendingChat(openId)) return;
  const msgs = [...log.querySelectorAll('.msg:not(.pending)')].map(el => el._m).filter(m => m && m.id);
  chatCache.delete(openId);
  chatCache.set(openId, { msgs, rev: openRev, eMax });
  while (chatCache.size > 12) chatCache.delete(chatCache.keys().next().value);
}

function switchTo(id) {
  if (id !== 'global') setView('chat');
  else if (mview === 'chat') setView('feed');

  closePlus();

  showTyping([]);
  if (call || gcall) syncCallView();
  olderMore = false;
  olderLoading = false;
  clearLog();
  setFeedMode(isFeed());
  const cached = chatCache.get(id);
  if (cached) {
    // Show what we had straight away; the next poll adds anything new, and
    // reloads fully if something was deleted meanwhile.
    openRev = cached.rev;
    eMax = cached.eMax;
    olderMore = cached.msgs.length >= 100;
    if (cached.msgs.length) renderBatch(cached.msgs, false);

const groupPicCache = new Map(); // id -> { pv, data }
let picVer = 0;

// Fetches pictures for groups whose picture changed since we last looked.
async function loadGroupPics() {
  if (!st) return;
  const stale = st.convos.filter(c => c.type === 'group' && c.pv && (groupPicCache.get(c.id) || {}).pv !== c.pv);
  st.convos.filter(c => c.type === 'group' && !c.pv && groupPicCache.has(c.id)).forEach(c => { groupPicCache.delete(c.id); picVer++; });
  if (!stale.length) return;
  stale.forEach(c => groupPicCache.set(c.id, { pv: c.pv, data: (groupPicCache.get(c.id) || {}).data || '' })); // don't ask twice
  try {
    const d = await api('groupPics', { ids: stale.map(c => c.id) });
    if (!d.ok) return;
    stale.forEach(c => groupPicCache.set(c.id, { pv: c.pv, data: d.pics[c.id] || '' }));
    picVer++;
    renderSide();
    renderHeader();
  } catch (e) {}
}

function groupIcon(c, cls) {
  const pic = (groupPicCache.get(c.id) || {}).data;
  const el = h('div', { class: 'avatar' + (cls ? ' ' + cls : '') });
  if (pic) el.style.backgroundImage = `url("${pic}")`; // server only accepts base64 image data URLs
  else { el.style.background = colorFor(c.name, 80); el.textContent = (c.name || '?')[0].toUpperCase(); }
  return el;
}

// "Bottom" means where new things appear: the bottom of a chat, the top of the feed.
function nearBottom() {
  if (isFeed()) return log.scrollTop < 80;
  return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
}

function scrollDown() {
  log.scrollTop = isFeed() ? 0 : log.scrollHeight;
  $('newmsgs').style.display = 'none';
}

// Feed posts are kept newest-first; pending posts sit above everything.
function placeInFeed(el) {
  const id = Number(el.dataset.id) || Infinity;
  const after = [...log.children].find(c => c.classList.contains('msg') && !c.classList.contains('pending') && Number(c.dataset.id) < id);
  if (el.classList.contains('pending')) log.insertBefore(el, log.querySelector('.msg, .sys:not(.err)'));
  else log.insertBefore(el, after || null);
}

function clearLog() {
  clearInterval(chatLoadTimer);

}

let serverApi = 0; // features the backend supports; comments need 3

function paintCommentCount(el) {
  if (!el._cbtn) return;
  el._cbtn.classList.toggle('hidden', serverApi < 3); // backend not updated yet
  const n = el._m.cc || 0;
  el._cbtn.textContent = '\u{1F4AC} ' + (n ? `${n} comment${n === 1 ? '' : 's'}` : 'Comment');
  el._cbtn.classList.toggle('on', !!el._cmts);

// ---------- comments ----------
async function toggleComments(el, focus = true) {
  if (el._cmts) { el._cmts.remove(); el._cmts = null; paintCommentCount(el); return; }
  const post = el._m;
  const list = h('div', { class: 'comments' }, h('div', { class: 'shimmer', style: 'height:34px;border-radius:12px' }));
  const input = h('input', { placeholder: 'Write a comment\u2026', maxlength: 300 });
  attachMentions(input);
  const form = h('form', { class: 'cform', onsubmit: e => { e.preventDefault(); sendComment(el, input); } },
    input, h('button', { class: 'primary', type: 'submit' }, 'Reply'));
  el._cmts = h('div', { class: 'comments enter' }, list, form);
  el.append(el._cmts);
  paintCommentCount(el);
  if (focus) input.focus();
  await loadComments(el);
}

async function loadComments(el) {
  const box = el._cmts;
  if (!box) return;
  try {
    const d = await api('comments', { post: el._m.id });
    if (!box.isConnected) return;
    const list = box.firstElementChild;
    if (!d.ok) { list.replaceChildren(h('div', { class: 'muted' }, d.error || "Couldn't load comments")); return; }
    const pending = [...list.querySelectorAll('.cmt.pending')];
    list.replaceChildren(...d.comments.map(c => buildComment(el, c)), ...pending);
  } catch (e) {
    if (box.isConnected) box.firstElementChild.replaceChildren(h('div', { class: 'muted' }, "Couldn't load comments"));
  }
}

function buildComment(postEl, c, pending) {
  const convo = 'p:' + postEl._m.id;
  const row = h('div', { class: 'cmt' + (pending ? ' pending' : '') + (c.text && mentionsMe(c.text) && !isMine(c) ? ' mentioned' : '') },
    avatar(c.name),
    h('div', { class: 'col' },
      h('div', { class: 'bubble' },
        h('b', { class: c.admin ? 'admin-name' : '', style: `color:${colorFor(c.name)}`, onclick: () => openProfile(c.name) }, c.name),
        c.admin && h('span', { class: 'badge' }, 'ADMIN'),
        richText(c.text || '')),
      h('div', { class: 'meta' },
        pending ? 'sending\u2026' : fmtTime(c.time),
        !pending && !isMine(c) && h('button', { onclick: () => openReport(c, convo) }, 'Report'),
        !pending && canDelete(c) && h('button', {
          onclick: async () => {
            row.classList.add('removing');
            const d = await act('deleteMessage', { convo, id: c.id });
            if (!d) { row.classList.remove('removing'); return; }
            row.remove();
            postEl._m = Object.assign({}, postEl._m, { cc: Math.max(0, (postEl._m.cc || 1) - 1) });
            paintCommentCount(postEl);
          },
        }, 'Delete'))));
  return row;
}

async function sendComment(postEl, input) {
  const text = input.value.trim();
  if (!text || !me) return;
  input.value = '';
  const list = postEl._cmts && postEl._cmts.firstElementChild;
  const pending = buildComment(postEl, { name: me.name, admin: me.role === 'admin', text }, true);
  if (list) { list.querySelectorAll('.shimmer, .muted').forEach(x => x.remove()); list.append(pending); }
  try {
    const d = await api('send', { convo: 'p:' + postEl._m.id, text });
    if (!d.ok) {
      pending.remove();
      if (!input.value) input.value = text;
      if (verifyError(d.error)) openVerify();
      else if (!d.auth) toast(d.error || 'Could not comment', true);
      return;
    }
    pending.replaceWith(buildComment(postEl, d.message));
    postEl._m = Object.assign({}, postEl._m, { cc: (postEl._m.cc || 0) + 1 });
    paintCommentCount(postEl);
    if (settings.slow && me.role !== 'admin') { slowUntil = Date.now() + settings.slow * 1000; updateComposer(); }
  } catch (e) {
    pending.remove();
    if (!input.value) input.value = text;
    toast('Could not reach the server', true);
  }
}

// Jump to a post in the feed (e.g. from a "commented on your post" notification).
function openPost(id) {
  if (openId !== 'global') switchTo('global');
  const started = Date.now();
  const look = () => {
    const el = log.querySelector(`.msg.post[data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      if (!el._cmts) toggleComments(el, false);
      else loadComments(el);
    } else if (Date.now() - started < 15000 && openId === 'global') setTimeout(look, 300);
  };
  look();
}

// ---------- mentions ----------
function myMentionRe() {
  if (!me) return null;
  const parts = me.name.split(/[\s_-]+/).map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp('@' + parts.join('[\\s_-]*') + '(?![A-Za-z0-9])', 'i');
}

function mentionsMe(text) {
  const re = myMentionRe();
  return !!re && re.test(text);
}

// Message text with @mentions highlighted (built from text nodes, never HTML).
function richText(text) {
  const mine = myMentionRe();
  // (?!) never matches, for when we don't know our own name yet.
  const re = new RegExp('(' + (mine ? mine.source : '(?!)') + ')|(@[A-Za-z0-9_-]+)|(https?:\\/\\/[^\\s<>"]+)', 'gi');
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text))) {
    out.push(text.slice(last, m.index));
    if (m[3]) {
      // Links: only http(s), opened in a new tab. Trailing punctuation stays as text.
      const url = m[3].replace(/[.,!?;:)\]'"]+$/, '');
      out.push(h('a', { href: url, target: '_blank', rel: 'noopener noreferrer nofollow' }, url));
      last = m.index + url.length;
      re.lastIndex = last;
      continue;
    }
    out.push(h('span', { class: 'ment' + (m[1] ? ' you' : '') }, m[0]));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return h('span', null, out.filter(x => x !== ''));
}

// ---------- touch screens ----------
// Tap a message to show its menu (react, reply, edit, report, delete), since

const previews = (() => { try { return JSON.parse(store.get('chat_prev') || '{}'); } catch (e) { return {}; } })();
// Previews saved while the new server was briefly missing its key; the real text loads fresh.
{

let prevVer = 0;

function ago(t) {
  if (!t) return '';
  const s = (Date.now() - t) / 1000;
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  if (s < 86400) return Math.floor(s / 3600) + 'h';
  if (s < 7 * 86400) return Math.floor(s / 86400) + 'd';
  return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}

// ---------- @mention suggestions ----------
// Type "@" and pick a name. Groups suggest their members; elsewhere friends and people in view.
function mentionCandidates() {
  const c = curConvo();
  let names = c && (c.type === 'group' || c.type === 'dm') ? c.members.slice() : (st ? st.friends.slice() : []);
  if (!c || c.type === 'global') log.querySelectorAll('.msg, .cmt').forEach(el => { if (el._m && el._m.name) names.push(el._m.name); });
  const seen = new Set([me ? key(me.name) : '']);
  return names.filter(n => n && !seen.has(key(n)) && seen.add(key(n)));
}
function attachMentions(input) {
  let box = null, items = [], sel = 0, start = -1;
  const close = () => { if (box) box.remove(); box = null; };
  const pick = n => {
    const pos = input.selectionStart;
    input.value = input.value.slice(0, start) + '@' + n + ' ' + input.value.slice(pos);
    const at = start + n.length + 2;
    close();
    input.focus();
    input.setSelectionRange(at, at);
    input.dispatchEvent(new Event('input', { bubbles: true }));
  };
  const update = () => {
    const pos = input.selectionStart, m = /(^|\s)@([A-Za-z0-9_-]{0,20})$/.exec(input.value.slice(0, pos));
    if (!m) return close();
    start = pos - m[2].length - 1;
    const q = key(m[2]);
    items = mentionCandidates().filter(n => key(n).includes(q))
      .sort((a, b) => key(b).startsWith(q) - key(a).startsWith(q) || a.localeCompare(b)).slice(0, 6);
    if (!items.length) return close();
    sel = Math.min(sel, items.length - 1);
    if (!box) { box = h('div', { class: 'mentionbox', role: 'listbox' }); document.body.append(box); }
    box.replaceChildren(...items.map((n, i) => h('button', {
      type: 'button', class: i === sel ? 'on' : '',
      onpointerdown: e => { e.preventDefault(); pick(n); }, // before the input loses focus
    }, avatar(n, { click: false }), h('span', null, n))));
    const r = input.getBoundingClientRect();
    box.style.left = Math.max(8, r.left) + 'px';
    box.style.bottom = (innerHeight - r.top + 6) + 'px';
    box.style.width = Math.min(Math.max(r.width, 200), 280) + 'px';
  };
  input.addEventListener('input', () => { sel = 0; update(); });
  input.addEventListener('keydown', e => {
    if (!box) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      update();
    } else if (e.key === 'Enter' || e.key === 'Tab') {
      // Already typed the whole name? Enter just sends.
      const m = /@([A-Za-z0-9_-]*)$/.exec(input.value.slice(0, input.selectionStart));
      if (e.key === 'Enter' && m && key(m[1]) === key(items[sel])) { close(); return; }
      e.preventDefault(); e.stopImmediatePropagation();
      pick(items[sel]);
    } else if (e.key === 'Escape') { e.stopPropagation(); close(); }
  }, true);
  input.addEventListener('blur', () => setTimeout(close, 150));
}
attachMentions(textEl);
attachMentions($('posttext'));

function startEdit(el) {
  if (el._editing) return;
  const m = el._m, t = el.querySelector('.txt');
  el._editing = true;
  const box = h('textarea', { maxlength: isFeed() ? 1000 : 300 });
  box.value = m.text || '';
  const done = () => { el._editing = false; editor.remove(); t.classList.remove('hidden'); paintText(el); };
  const save = async () => {
    const text = box.value.trim();
    if (text === (m.text || '')) return done();
    box.disabled = true;
    const d = await act('editMessage', { convo: openId, id: m.id, text });
    box.disabled = false;
    if (!d) return;
    el._m = d.message;
    if (d.message.e) eMax = Math.max(eMax, d.message.e);
    done();
  };
  box.onkeydown = e => {
    if (e.key === 'Escape') { e.preventDefault(); done(); }
    if (e.key === 'Enter' && (!isFeed() || e.ctrlKey || e.metaKey) && !e.shiftKey) { e.preventDefault(); save(); }
  };
  const editor = h('div', { class: 'editbox' }, box,
    h('span', { class: 'hint' }, (isFeed() ? 'Ctrl+Enter' : 'Enter') + ' to save \u00b7 Esc to cancel'));
  t.classList.add('hidden');
  t.after(editor);
  box.focus();
  box.setSelectionRange(box.value.length, box.value.length);
}

// Older messages load when you scroll to the top of a chat (or the bottom of the feed).
let olderMore = false, olderLoading = false;
async function loadOlder() {
  if (!olderMore || olderLoading || serverApi < 9 || isPendingChat(openId)) return;
  const ids = [...log.querySelectorAll('.msg:not(.pending)')].map(el => Number(el.dataset.id)).filter(Boolean);
  if (!ids.length) return;
  olderLoading = true;
  const myEpoch = epoch;
  const note = h('div', { class: 'olderload' }, h('span', { class: 'spinner', style: 'display:inline-block;vertical-align:middle;margin-right:6px' }), 'Loading older messages\u2026');
  if (isFeed()) log.append(note); else log.prepend(note);
  try {
    const d = await api('older', { convo: openId, before: Math.min(...ids) });
    if (myEpoch !== epoch || !d.ok) return;
    olderMore = d.more;
    const fresh = d.messages.filter(m => !shown.has(m.id));
    fresh.forEach(m => shown.add(m.id));
    if (isFeed()) {
      fresh.forEach(m => placeInFeed(buildMessage(m)));
    } else {
      // Add above, keeping what you're looking at in the same place.
      const before = log.scrollHeight;
      const first = log.querySelector('.msg');
      fresh.forEach(m => log.insertBefore(buildMessage(m), first));
      groupMessages();
      log.scrollTop += log.scrollHeight - before;
    }
    if (!olderMore && !isFeed()) log.prepend(h('div', { class: 'sys' }, 'This is the start of the chat.'));
  } catch (e) {
  } finally {
    note.remove();
    olderLoading = false;
  }
}
log.addEventListener('scroll', () => {
  if (isFeed() ? log.scrollHeight - log.scrollTop - log.clientHeight < 200 : log.scrollTop < 60) loadOlder();
});

function updateMessage(m) {

async function toggleReaction(el, emoji) {
  closePicker();
  const m = el._m;
  if (!m.id || !me) return;
  // Show it straight away, then settle on whatever the server says.
  const before = JSON.stringify(m.r || {});
  const r = JSON.parse(before);
  const names = r[emoji] || [];
  const i = names.findIndex(n => key(n) === key(me.name));
  if (i >= 0) names.splice(i, 1); else names.push(me.name);
  if (names.length) r[emoji] = names; else delete r[emoji];
  el._m = Object.assign({}, m, { r });
  el._busy = true;
  paintReactions(el, i < 0 ? emoji : null);
  const d = await act('react', { convo: openId, id: m.id, emoji });
  el._busy = false;
  el._m = d ? d.message : Object.assign({}, m, { r: JSON.parse(before) });
  if (d && d.message.e) eMax = Math.max(eMax, d.message.e);
  paintReactions(el);
}

// ---------- media (pictures, voice) by id, cached ----------
const mediaLoading = new Map(); // id -> the download already on its way, so it's never fetched twice
function loadMedia(convo, id) {
  if (imageCache.has(id)) return Promise.resolve(imageCache.get(id));
  if (mediaLoading.has(id)) return mediaLoading.get(id);
  const job = api('image', { convo, id }).then(d => {
    if (!d.ok) throw new Error(d.error || "Couldn't load that");
    rememberImage(id, d.image);
    return d.image;
  }).finally(() => mediaLoading.delete(id));
  mediaLoading.set(id, job);
  return job;
}

const fmtDur = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

// ---------- polls ----------
function paintPoll(el) {
  const box = el.querySelector('.pollbox'), m = el._m;
  if (!box) return;
  if (!m.pl) { box.replaceChildren(); return; }
  const v = m.pl.v || {};
  const total = Object.values(v).reduce((a, l) => a + l.length, 0);
  const mine = me ? Object.keys(v).find(k => v[k].some(n => key(n) === key(me.name))) : undefined;
  const live = !!m.id && !el.classList.contains('pending');
  box.replaceChildren(h('div', { class: 'poll' },
    ...m.pl.o.map((o, i) => {
      const who = v[i] || [], pct = total ? Math.round(who.length * 100 / total) : 0;
      return h('button', {
        type: 'button', class: 'popt' + (String(i) === mine ? ' mine' : ''), disabled: live ? null : '',
        title: who.length ? who.join(', ') : 'No votes yet', onclick: () => castVote(el, i),
      }, h('span', { class: 'bar', style: `width:${pct}%` }), h('span', { class: 'ol' }, String(i) === mine ? '\u2713 ' : '', o),
        h('span', { class: 'pc' }, total ? pct + '%' : ''));
    }),
    h('div', { class: 'ptotal' }, `${total} vote${total === 1 ? '' : 's'}${mine !== undefined ? ' \u00b7 tap your choice again to take it back' : ''}`)));
}

async function castVote(el, i) {
  const m = el._m;
  if (!m.id || !me || el._busy) return;
  // Show it straight away, then settle on whatever the server says.
  const before = JSON.stringify(m.pl.v || {});
  const v = JSON.parse(before);
  let had = -1;
  for (const k of Object.keys(v)) {
    const j = v[k].findIndex(n => key(n) === key(me.name));
    if (j >= 0) { had = Number(k); v[k].splice(j, 1); if (!v[k].length) delete v[k]; }
  }
  if (had !== i) (v[i] = v[i] || []).push(me.name);
  el._m = Object.assign({}, m, { pl: Object.assign({}, m.pl, { v }) });
  el._busy = true;
  paintPoll(el);
  const d = await act('vote', { convo: openId, id: m.id, choice: i });
  el._busy = false;
  el._m = d ? d.message : Object.assign({}, m, { pl: Object.assign({}, m.pl, { v: JSON.parse(before) }) });
  if (d && d.message.e) eMax = Math.max(eMax, d.message.e);
  paintPoll(el);
}

// ---------- voice messages ----------
let playingVoice = null;
function voiceBlock(m) {
  const convo = openId;
  const btn = h('button', { class: 'vplay', type: 'button', 'aria-label': 'Play voice message' }, '\u25B6');
  const fill = h('span', { class: 'vfill' });
  const time = h('span', { class: 'vtime' }, fmtDur(m.vo || 0));
  let audio = null;
  btn.onclick = async e => {
    e.stopPropagation();
    if (audio && !audio.paused) return audio.pause();
    if (!audio) {
      btn.textContent = '\u2026';
      try {
        audio = new Audio(m.local || await loadMedia(convo, m.img));
      } catch (err) {
        btn.textContent = '\u25B6';
        return toast(err.message || "Couldn't load that voice message", true);
      }
      // Recordings often don't know their own length, so fall back to what the sender's timer said.
      const len = () => (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : m.vo || 1);
      audio.ontimeupdate = () => {
        fill.style.width = Math.min(100, audio.currentTime / len() * 100) + '%';
        time.textContent = fmtDur(Math.max(0, Math.ceil(len() - audio.currentTime)));
      };
      audio.onplay = () => { btn.textContent = '\u23F8'; if (playingVoice && playingVoice !== audio) playingVoice.pause(); playingVoice = audio; };
      audio.onpause = () => { btn.textContent = '\u25B6'; };
      audio.onended = () => { btn.textContent = '\u25B6'; fill.style.width = '0'; time.textContent = fmtDur(m.vo || 0); };
    }
    audio.play().catch(() => toast("Couldn't play that voice message", true));
  };
  return h('div', { class: 'voice' }, btn, h('span', { class: 'vbar' }, fill), time);
}

const MAX_VOICE = 60; // seconds; the server allows the same
let rec = null;
async function startVoice() {
  if (!window.MediaRecorder || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) return toast("This browser can't record voice messages", true);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) {
    return toast('Idiocy isn\u2019t allowed to use your microphone.', true);
  }
  if (rec) { stream.getTracks().forEach(t => t.stop()); return; } // double tap
  const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
  const mr = new MediaRecorder(stream, Object.assign({ audioBitsPerSecond: 24000 }, type && { mimeType: type }));
  const r = rec = { mr, stream, chunks: [], start: Date.now(), convo: openId, keep: false };
  mr.ondataavailable = e => { if (e.data && e.data.size) r.chunks.push(e.data); };
  mr.onstop = async () => {
    clearInterval(r.timer);
    r.stream.getTracks().forEach(t => t.stop());
    if (rec === r) rec = null;
    $('send').classList.remove('recording');
    if (!r.keep) return;
    const dur = Math.min(MAX_VOICE, Math.max(1, Math.round((Date.now() - r.start) / 1000)));
    const blob = new Blob(r.chunks, { type: mr.mimeType || type || 'audio/webm' });
    if (!blob.size) return toast("Couldn't hear anything. Try again.", true);
    const data = await new Promise((ok, bad) => { const f = new FileReader(); f.onload = () => ok(f.result); f.onerror = bad; f.readAsDataURL(blob); });
    if (data.length > MAX_IMAGE_CHARS) return toast('That voice message is too long', true);
    if (openId !== r.convo) return; // switched chats meanwhile
    send('', null, { voice: data, dur });
  };
  mr.start(250);
  $('send').classList.add('recording');
  $('rectime').textContent = '0:00';
  r.timer = setInterval(() => {
    const s = Math.floor((Date.now() - r.start) / 1000);
    $('rectime').textContent = fmtDur(s);
    if (s >= MAX_VOICE) stopVoice(true);
  }, 250);
}
function stopVoice(keep) {
  if (!rec) return;
  rec.keep = keep;
  if (rec.mr.state !== 'inactive') rec.mr.stop();
}
function cancelVoice() { stopVoice(false); }
$('mic').onclick = () => (rec ? stopVoice(true) : startVoice());
$('reccancel').onclick = cancelVoice;

// ---------- stories ----------
// Photos that last 24 hours. Friends see a ring round your picture at the top of the chat list.
let stories = [];
const storySeen = (() => { try { return JSON.parse(store.get('chat_storyseen') || '{}'); } catch (e) { return {}; } })();
let storySeenVer = 0;
function markStorySeen(name, id) {
  const k = key(name);
  if ((storySeen[k] || 0) >= id) return;
  storySeen[k] = id;
  storySeenVer++;
  store.set('chat_storyseen', JSON.stringify(storySeen));
}

async function openStoryViewer(names, start) {
  let who = start, idx = 0, list = [], timer = null, t0 = 0, left = 0, paused = false;
  const DUR = 5000;
  const bars = h('div', { class: 'sbars' });
  const av = h('span');
  const nameEl = h('b'), ago = h('span', { class: 'ago' });
  const img = h('img', { alt: 'Story' });
  const cap = h('div', { class: 'scap' });
  // Shown while a story (or its photo) is on its way, which can take a few seconds.
  const LOAD_LINES = ['Loading story\u2026', 'Contacting the spreadsheet\u2026', 'Fetching the good stuff\u2026', 'Almost there\u2026'];
  const loadText = h('div', { class: 'sltext' });
  const loader = h('div', { class: 'sload' }, h('div', { class: 'sspin' }), loadText);
  let loadTimer = null;
  const setLoading = on => {
    loader.classList.toggle('hidden', !on);
    img.classList.toggle('hidden', on);
    clearInterval(loadTimer);
    if (!on) return;
    let i = 0;
    loadText.textContent = LOAD_LINES[0];
    loadTimer = setInterval(() => { loadText.textContent = LOAD_LINES[++i % LOAD_LINES.length]; }, 1800);
  };
  const foot = h('div', { class: 'sfoot' });
  const view = h('div', { class: 'storyview', role: 'dialog', 'aria-label': 'Story' },
    bars,
    h('div', { class: 'stop' }, av, nameEl, ago, h('button', { class: 'sx', 'aria-label': 'Close', onclick: () => close() }, '\u2715')),
    h('div', { class: 'sstage' }, img, loader, cap,
      h('button', { class: 'sprev', 'aria-label': 'Previous', onclick: () => step(-1) }),
      h('button', { class: 'snext', 'aria-label': 'Next', onclick: () => step(1) })),
    foot);
  document.body.append(view);
  const onKey = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); };
  document.addEventListener('keydown', onKey);
  function close() { clearTimeout(timer); clearInterval(loadTimer); document.removeEventListener('keydown', onKey); view.remove(); renderSide(); }
  const bar = i => bars.children[i] && bars.children[i].firstChild;
  function run(ms) {
    clearTimeout(timer);
    t0 = Date.now(); left = ms;
    const b = bar(idx);
    if (b) { b.style.transition = 'none'; b.style.width = (100 - ms / DUR * 100) + '%'; b.offsetWidth; b.style.transition = `width ${ms}ms linear`; b.style.width = '100%'; }
    timer = setTimeout(() => step(1), ms);
  }
  function pause() {
    if (paused) return;
    paused = true; clearTimeout(timer);
    left = Math.max(0, left - (Date.now() - t0));
    const b = bar(idx);
    if (b) { b.style.transition = 'none'; b.style.width = (100 - left / DUR * 100) + '%'; }
  }
  function resume() { if (!paused) return; paused = false; run(left || DUR); }
  async function loadPerson() {
    const name = names[who];
    nameEl.textContent = name;
    av.replaceChildren(avatar(name, { click: false }));
    ago.textContent = '';
    cap.textContent = '';
    foot.replaceChildren();
    bars.replaceChildren(h('span', null, h('i')));
    setLoading(true);
    const d = await api('stories', { name });
    if (!view.isConnected) return;
    list = d.ok ? d.stories : [];
    if (!list.length) return step(1, true);
    const firstNew = list.findIndex(s => s.id > (storySeen[key(name)] || 0));
    idx = firstNew >= 0 ? firstNew : 0;
    bars.replaceChildren(...list.map((s, i) => h('span', null, h('i', { style: i < idx ? 'width:100%' : '' }))));
    const mine = key(name) === key(me.name);
    if (mine) {
      foot.replaceChildren(
        h('button', { class: 'sdel', onclick: async () => {
          pause();
          if (!confirm('Delete this from your story?')) return resume();
          const s = list[idx];
          if (await act('deleteMessage', { convo: 's:' + key(me.name), id: s.id })) { pollNow(); close(); } else resume();
        } }, '\u{1F5D1} Delete'),
        h('span', { style: 'flex:1' }),
        h('button', { class: 'sadd', onclick: () => { close(); addToStory(); } }, '+ Add to story'));
    } else {
      const input = h('input', { placeholder: `Reply to ${name}\u2026`, maxlength: 250 });
      input.onfocus = pause;
      input.onblur = () => { if (!input.value) resume(); };
      const go = async () => {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        input.blur();
        if (await replyToStory(name, list[idx], text)) toast('Reply sent \u2709\uFE0F');
        resume();
      };
      input.onkeydown = e => { if (e.key === 'Enter') go(); };
      foot.replaceChildren(input, h('button', { class: 'ssend', onclick: go }, 'Send'));
    }
    show();
  }
  async function show() {
    const s = list[idx];
    ago.textContent = ago_(s.time);
    cap.textContent = s.text || '';
    img.removeAttribute('src');
    for (let i = 0; i < list.length; i++) { const b = bar(i); if (b && i !== idx) { b.style.transition = 'none'; b.style.width = i < idx ? '100%' : '0'; } }
    markStorySeen(names[who], s.id);
    clearTimeout(timer);
    setLoading(true);
    try {
      const src = await loadMedia('s:' + key(names[who]), s.img);
      if (!view.isConnected || list[idx] !== s) return;
      img.src = src;
      await img.decode().catch(() => {});
    } catch (e) { cap.textContent = e.message || "Couldn't load this"; }
    if (!view.isConnected || list[idx] !== s) return;
    setLoading(false);
    // Get the next photo ready while this one's showing.
    const nxt = list[idx + 1];
    if (nxt) loadMedia('s:' + key(names[who]), nxt.img).catch(() => {});
    paused = false;
    run(DUR);
  }
  function step(dir, skipPerson) {
    if (!skipPerson && idx + dir >= 0 && idx + dir < list.length) { idx += dir; return show(); }
    if (!skipPerson && dir < 0) return show(); // already at the first one: replay it
    who += dir < 0 ? -1 : 1;
    if (who < 0 || who >= names.length) return close();
    loadPerson();
  }
  const ago_ = t => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? m + 'm' : Math.floor(m / 60) + 'h'; };
  loadPerson();
}

// A story reply goes to your DM with them.
async function replyToStory(name, s, text) {
  let c = st && st.convos.find(c => c.type === 'dm' && c.members.some(n => key(n) === key(name)));
  if (!c) {
    const d = await api('openDm', { username: name });
    if (!d.ok) { toast(d.error || "Couldn't send that", true); return false; }
    c = { id: (d.convo && d.convo.id) || d.convo || d.id };
  }
  const quote = s && s.text ? ` ("${s.text.slice(0, 40)}")` : '';
  const d = await api('send', { convo: c.id, text: `\u21A9\uFE0F Replied to your story${quote}: ${text}`.slice(0, 300) });
  if (!d.ok) { toast(d.error || "Couldn't send that", true); return false; }
  notePreview(c.id, d.message);
  pollNow();
  return true;
}
