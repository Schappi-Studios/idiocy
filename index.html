<style>
  :root {
    --bg: #f4f5f9;
    --panel: #ffffff;
    --panel-2: #eef0f5;
    --hover: #e8eaf1;
    --border: #dde1ea;
    --text: #1b1e27;
    --muted: #6b7285;
    --accent: #6a4cf5;
    --accent-2: #7c5cff;
    --danger: #e0344f;
    --ok: #1fae6e;
    --gold: #ffc857;
    --admin: #d11a2a;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; }
  input, textarea {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font: inherit;
    outline: none;
    min-width: 0;
  }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; min-height: 70px; line-height: 1.4; }
  .primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 18px; font-weight: 600; cursor: pointer;
  }
  .primary:hover { background: var(--accent-2); }
  .primary:disabled { opacity: .5; cursor: default; }
  .ghost {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer;
  }
  .ghost:hover { color: var(--text); border-color: var(--accent); }
  .ghost.danger:hover { color: var(--danger); border-color: var(--danger); }
  .hidden { display: none !important; }
  .admin-name { color: var(--admin) !important; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .5px;
    background: var(--gold); color: #1a1400; border-radius: 4px; padding: 1px 5px;
    vertical-align: 2px; margin-right: 6px;
  }

  /* ---------- auth ---------- */
  #auth {
    min-height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  #auth .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; width: 100%; max-width: 360px;
  }
  #auth h1 { margin: 0 0 16px; font-size: 22px; display: flex; align-items: center; gap: 12px; }
  .logo { border-radius: 50%; display: block; flex-shrink: 0; }
  #auth .logo { width: 56px; height: 56px; }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 0; font-weight: 800; font-size: 18px; letter-spacing: 1px;
  }
  .brand .logo { width: 32px; height: 32px; }
  .tabs { display: flex; gap: 4px; background: var(--panel-2); border-radius: 10px; padding: 4px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; background: none; border: 0; border-radius: 7px; padding: 8px; cursor: pointer; color: var(--muted);
  }
  .tabs button.on { background: var(--accent); color: #fff; font-weight: 600; }
  #authform { display: flex; flex-direction: column; gap: 10px; }
  #autherr { color: var(--danger); font-size: 13px; min-height: 18px; }

  /* ---------- app layout ---------- */
  #app { display: flex; height: 100%; }
  aside {
    width: 280px; flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
  }
  main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  .me {
    display: flex; align-items: center; gap: 8px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .me .who {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    background: none; border: 0; border-radius: 10px; padding: 4px; margin: -4px; cursor: pointer; text-align: left;
  }
  .me .who:hover { background: var(--hover); }
  .me .who .avatar { width: 36px; height: 36px; }
  .two { min-width: 0; display: flex; flex-direction: column; }
  .two b, .two .st { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .two .st { color: var(--muted); font-size: 12px; font-weight: 400; }
  .sec { padding: 12px 8px 4px; }
  .sec-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 8px 6px; color: var(--muted); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .6px;
  }
  .row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: 0; border-radius: 8px; padding: 7px 8px;
    text-align: left; cursor: pointer; color: var(--text);
  }
  .row:hover { background: var(--hover); }
  .row.on { background: var(--panel-2); }
  .row .label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.unread .label { font-weight: 700; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #111;
  }
  .avatar.icon { background: var(--panel-2); color: var(--muted); border-radius: 8px; }
  .avatar { position: relative; background-size: cover; background-position: center; }
  .avatar[data-user] { cursor: pointer; }
  .presence {
    position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%;
    background: var(--ok); border: 2px solid var(--panel);
  }
  .row .x {
    background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px 6px;
    border-radius: 6px; visibility: hidden;
  }
  .row:hover .x { visibility: visible; }
  .row .x:hover { color: var(--danger); }
  .req { padding: 6px 8px; font-size: 14px; }
  .req .actions { display: flex; gap: 6px; margin-top: 6px; }
  .muted { color: var(--muted); font-size: 13px; padding: 4px 8px; }
  #addfriend { display: flex; gap: 6px; padding: 0 8px 8px; }
  #addfriend input { flex: 1; padding: 7px 10px; font-size: 14px; }
  #addfriend button { padding: 7px 12px; }

  /* ---------- chat pane ---------- */
  main header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; min-height: 56px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  #menu { display: none; background: none; border: 0; font-size: 20px; cursor: pointer; padding: 0 4px; color: var(--muted); }
  #status { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  #status.online { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  #status.offline { background: var(--danger); }
  .titles { flex: 1; min-width: 0; }
  #title { font-size: 16px; font-weight: 700; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #log {
    flex: 1; overflow-y: auto;
    padding: 12px 16px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .msg {
    position: relative; padding: 6px 8px; border-radius: 6px; overflow-wrap: anywhere;
    display: grid; grid-template-columns: 36px 1fr; column-gap: 10px; margin-top: 6px;
  }
  .msg:hover { background: var(--panel); }
  .msg > .avatar { width: 36px; height: 36px; grid-row: span 2; margin-top: 2px; }
  .msg .head { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .msg .body { grid-column: 2; }
  .msg .name { font-weight: 700; cursor: pointer; }
  .msg .name:hover { text-decoration: underline; }
  .msg .time { color: var(--muted); font-size: 11px; }
  .msg .badge { margin-right: 0; }
  /* Follow-up messages from the same person skip the picture and name. */
  .msg.cont { margin-top: 0; padding-top: 1px; padding-bottom: 1px; }
  .msg.cont > .avatar, .msg.cont .head { display: none; }
  /* Hover toolbar: react, report, delete */
  .msg .acts {
    display: none; position: absolute; right: 8px; top: -14px; z-index: 2; gap: 2px; padding: 2px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 2px 8px rgba(20, 24, 40, .12);
  }
  .msg:hover .acts, .msg.picking .acts { display: flex; }
  .acts button {
    background: none; border: 0; border-radius: 6px; padding: 3px 7px; cursor: pointer;
    color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 4px;
  }
  .acts button:hover { background: var(--hover); color: var(--text); }
  .acts button.danger:hover { color: var(--danger); }
  .msg.pending { opacity: .55; }
  .msg.pending .acts { display: none !important; }

  .reacts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .reacts:empty { display: none; }
  .reacts button {
    border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 1px 8px;
    font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; color: var(--text);
  }
  .reacts button:hover { border-color: var(--accent); }
  .reacts button.mine { border-color: var(--accent); background: rgba(106, 76, 245, .1); color: var(--accent); font-weight: 600; }
  .reacts button.pop { animation: dotpop .3s ease-out; }
  .picker {
    position: fixed; z-index: 40; display: flex; gap: 2px; padding: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 6px 20px rgba(20, 24, 40, .18); animation: popin .15s ease-out;
  }
  .picker button { font-size: 22px; background: none; border: 0; border-radius: 8px; padding: 4px 6px; cursor: pointer; transition: transform .1s; }
  .picker button:hover { background: var(--hover); transform: scale(1.2); }

  .msg.mentioned { background: rgba(255, 200, 87, .16); box-shadow: inset 3px 0 0 var(--gold); }
  .msg.mentioned:hover { background: rgba(255, 200, 87, .24); }
  .ment { color: var(--accent); font-weight: 600; background: rgba(106, 76, 245, .1); border-radius: 4px; padding: 0 2px; }
  .ment.you { color: #8a5a00; background: rgba(255, 200, 87, .45); }

  .me .iconbtn { width: 34px; height: 34px; }
  .composer-note { color: var(--muted); font-size: 12px; padding: 6px 16px 0; background: var(--panel); border-top: 1px solid var(--border); }
  .composer-note + #attachbar, .composer-note + #send { border-top: 0; }
  .composer-note.warn { color: var(--danger); }

  .tabbar { display: flex; gap: 4px; background: var(--panel-2); border-radius: 10px; padding: 4px; }
  .tabbar button { flex: 1; background: none; border: 0; border-radius: 7px; padding: 7px; cursor: pointer; color: var(--muted); font-weight: 600; }
  .tabbar button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(20, 24, 40, .1); }
  .modal.wide { max-width: 560px; }
  .alist { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 55vh; }
  .card { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .card q { display: block; background: var(--panel-2); border-radius: 8px; padding: 6px 10px; overflow-wrap: anywhere; quotes: none; }
  .card .btns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-start; }
  .urow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .urow .nm { flex: 1; min-width: 120px; cursor: pointer; font-weight: 600; }
  .urow .nm:hover { text-decoration: underline; }
  .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  #toast.click { cursor: pointer; }

  /* ---------- Global feed ---------- */
  #feedbox { background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  #feedbox > * { width: 100%; max-width: 640px; margin: 0 auto; }
  #feedbox .fbrow { display: flex; gap: 10px; align-items: flex-start; }
  #feedbox .fbrow .avatar { width: 36px; height: 36px; margin-top: 3px; }
  #posttext { flex: 1; resize: none; min-height: 42px; max-height: 180px; overflow-y: auto; font: inherit; }
  #feedbox .fbact { display: flex; align-items: center; gap: 8px; padding-left: 46px; }
  #feedbox .fbact .spacer { flex: 1; }
  #feedbox .fbact .hint { color: var(--muted); font-size: 12px; }
  #feedbox #attachbar, #feedbox #composernote { background: none; border: 0; padding: 0 0 0 46px; }
  body.feedmode #send { display: none; }
  body:not(.feedmode) #feedbox { display: none; }
  body.feedmode #newmsgs { bottom: auto; top: 70px; }

  #log.feed { gap: 12px; padding: 16px; }
  #log.feed > * { width: 100%; max-width: 640px; margin-left: auto; margin-right: auto; }
  .msg.post {
    display: block; background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; margin-top: 0; box-shadow: 0 1px 3px rgba(20, 24, 40, .05);
  }
  .msg.post:hover { background: var(--panel); }
  .msg.post.mentioned { background: #fffaf0; box-shadow: inset 3px 0 0 var(--gold), 0 1px 3px rgba(20, 24, 40, .05); }
  .post .phead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-right: 70px; }
  .post .phead > .avatar { width: 40px; height: 40px; }
  .post .who2 { display: flex; flex-direction: column; min-width: 0; }
  .post .who2 .line { display: flex; align-items: center; gap: 6px; }
  .post .body { font-size: 15.5px; white-space: pre-wrap; line-height: 1.5; }
  .post .shot { margin-top: 10px; }
  .post .reacts { margin-top: 10px; }
  .post .acts { top: 10px; right: 10px; }
  .post .pfoot { display: flex; gap: 4px; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 6px; }
  .post .pfoot button {
    background: none; border: 0; border-radius: 8px; padding: 6px 10px; color: var(--muted);
    cursor: pointer; font-weight: 600; font-size: 13px;
  }
  .post .pfoot button:hover { background: var(--hover); color: var(--text); }
  .post .pfoot button.on { color: var(--accent); }
  .comments { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .cmt { display: flex; gap: 8px; align-items: flex-start; }
  .cmt .avatar { width: 28px; height: 28px; font-size: 12px; flex-shrink: 0; }
  .cmt .col { min-width: 0; }
  .cmt .bubble { background: var(--panel-2); border-radius: 12px; padding: 6px 10px; overflow-wrap: anywhere; font-size: 14px; }
  .cmt .bubble b { font-size: 13px; cursor: pointer; margin-right: 6px; }
  .cmt .bubble b:hover { text-decoration: underline; }
  .cmt .meta { font-size: 11px; color: var(--muted); margin: 2px 0 0 10px; display: flex; gap: 10px; }
  .cmt .meta button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 11px; padding: 0; }
  .cmt .meta button:hover { text-decoration: underline; color: var(--text); }
  .cmt.pending { opacity: .55; }
  .cmt.mentioned .bubble { background: rgba(255, 200, 87, .25); }
  .cform { display: flex; gap: 6px; }
  .cform input { flex: 1; padding: 7px 12px; font-size: 14px; border-radius: 999px; }
  .cform button { padding: 6px 14px; border-radius: 999px; }
  .post.flash { animation: glow 1.2s ease-out 2; }

  /* Friend codes */
  .codecard {
    display: block; width: calc(100% - 16px); margin: 0 8px 8px; text-align: left; cursor: pointer;
    background: var(--panel-2); border: 1px dashed var(--border); border-radius: 10px; padding: 8px 10px;
  }
  .codecard:hover { border-color: var(--accent); }
  .codecard .lbl { color: var(--muted); font-size: 12px; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .codewords { display: flex; flex-wrap: wrap; gap: 4px; }
  .cw {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1px 7px;
    font-weight: 700; font-size: 13px; color: var(--accent);
  }
  .codebig { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 6px 0; }
  .codebig .cw { font-size: 18px; padding: 4px 12px; border-radius: 10px; }
  .slots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .slots button {
    border: 2px solid var(--border); background: var(--panel-2); border-radius: 10px; padding: 8px 4px;
    font-weight: 700; cursor: pointer; color: var(--text); min-height: 40px; overflow: hidden; text-overflow: ellipsis;
  }
  .slots button.on { border-color: var(--accent); background: rgba(106, 76, 245, .08); }
  .slots button.empty { color: var(--muted); font-weight: 400; }
  .wordgrid { display: flex; flex-wrap: wrap; gap: 4px; max-height: 200px; overflow-y: auto; padding: 2px; }
  .wordgrid button { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
  .wordgrid button:hover { border-color: var(--accent); color: var(--accent); }
  .wordgrid button.used { opacity: .35; pointer-events: none; }
  .msg.pending .time { display: inline-flex; align-items: center; gap: 5px; }
  .spinner {
    width: 10px; height: 10px; border-radius: 50%;
    border: 2px solid var(--muted); border-top-color: transparent;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg.arrived { animation: pop .25s ease-out; }
  @keyframes pop { from { opacity: .55; } to { opacity: 1; } }
  #loading {
    position: fixed; inset: 0; z-index: 50;
    background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 16px; text-align: center;
  }
  #loading .wordmark { font-size: 32px; font-weight: 800; letter-spacing: 1px; margin-bottom: -4px; }
  #loading .logo { width: 112px; height: 112px; animation: spinsometimes 2.4s infinite; }
  /* Sits still most of the time, then does one quick spin. */
  @keyframes spinsometimes {
    0%, 72% { transform: rotate(0); }
    100% { transform: rotate(360deg); animation-timing-function: cubic-bezier(.6, 0, .3, 1); }
  }
  #loadmsg { color: var(--muted); font-size: 15px; min-height: 1.5em; }
  #loadmsg.in { animation: fadeup .35s ease-out; }
  @keyframes fadeup { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  /* ---------- motion: the backend is slow, so show that things are happening ---------- */
  @keyframes slidein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes popin { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @keyframes dotpop { 0% { transform: scale(0); } 70% { transform: scale(1.4); } 100% { transform: scale(1); } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(106, 76, 245, .45); } 100% { box-shadow: 0 0 0 10px rgba(106, 76, 245, 0); } }
  @keyframes fadeaway { to { opacity: 0; transform: translateX(-8px); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes progress { from { left: -35%; } to { left: 100%; } }

  .enter { animation: slidein .3s ease-out; }
  .req.enter { animation: slidein .3s ease-out, glow 1.2s ease-out 2; border-radius: 10px; }
  .msg.new { animation: slidein .3s ease-out; }
  .msg.removing { animation: fadeaway .25s ease-in forwards; pointer-events: none; }
  .overlay { animation: fadein .15s ease-out; }
  .overlay > .modal { animation: popin .22s cubic-bezier(.2, .9, .3, 1.2); }
  .dot { animation: dotpop .3s ease-out; }
  #status:not(.online) { animation: pulse 1.2s ease-in-out infinite; }
  #toast.show { animation: popin .25s ease-out; }
  .primary, .ghost, .row, .iconbtn { transition: background .15s, border-color .15s, color .15s, transform .1s; }
  .primary:active, .ghost:active, .iconbtn:active { transform: scale(.96); }

  /* Buttons waiting on the server show a spinner instead of their label. */
  button.busy { position: relative; color: transparent !important; pointer-events: none; }
  button.busy > * { visibility: hidden; }
  button.busy::after {
    content: ''; position: absolute; inset: 0; margin: auto; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255, 255, 255, .95); border-top-color: transparent; animation: spin .7s linear infinite;
  }
  .ghost.busy::after, .x.busy::after, .iconbtn.busy::after { border-color: var(--muted); border-top-color: transparent; }

  /* Thin bar at the top while anything is being saved. */
  #progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; overflow: hidden;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #progress.on { opacity: 1; }
  #progress::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    animation: progress 1.1s ease-in-out infinite;
  }

  .shimmer, .msg .shot:not(.loaded):not(.failed) {
    background: linear-gradient(90deg, var(--panel-2) 30%, var(--hover) 50%, var(--panel-2) 70%);
    background-size: 200% 100%; animation: shimmer 1.3s linear infinite;
  }
  .msg .shot img { opacity: 0; transition: opacity .3s; }
  .msg .shot.loaded img { opacity: 1; }

  /* In-chat loading screen, shown while a chat's messages load. */
  .chatload { display: flex; flex-direction: column; gap: 14px; padding-top: 8px; animation: fadein .2s; }
  .chatload .top { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 0 8px; }
  .chatload .logo { width: 56px; height: 56px; animation: spinsometimes 2.4s infinite; }
  .chatload .line { color: var(--muted); font-size: 14px; min-height: 1.4em; }
  .chatload .line.in { animation: fadeup .35s ease-out; }
  .skel { display: grid; grid-template-columns: 36px 1fr; gap: 6px 10px; padding: 6px 8px; }
  .skel .a { width: 36px; height: 36px; border-radius: 50%; grid-row: span 2; }
  .skel .b { height: 12px; border-radius: 6px; margin-top: 4px; }
  .skel .c { height: 12px; border-radius: 6px; }

  @media (prefers-reduced-motion: reduce) {
    .enter, .req.enter, .msg.new, .overlay, .overlay > .modal, .dot, #toast.show, .chatload,
    .chatload .logo, .chatload .line.in, .shimmer, .msg .shot:not(.loaded) { animation: none !important; }
    #status:not(.online) { animation: none; }
    #progress::before { animation-duration: 3s; }
    #loading .logo, #loadmsg.in { animation: none; }
    .spinner { animation-duration: 2s; }
    .msg.arrived { animation: none; }
  }
  .sys { color: var(--muted); font-size: 13px; font-style: italic; padding: 4px 8px; }
  .sys.err { color: var(--danger); }

  #newmsgs {
    display: none; position: absolute; left: 50%; transform: translateX(-50%); bottom: 76px;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 6px 14px; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(20,24,40,.2);
  }
  #send {
    display: flex; gap: 8px; padding: 12px 16px;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #text { flex: 1; }
  .iconbtn {
    background: none; border: 1px solid var(--border); border-radius: 10px; width: 42px; flex-shrink: 0;
    cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center;
  }
  .iconbtn:hover { color: var(--accent); border-color: var(--accent); }
  #attachbar {
    display: flex; align-items: center; gap: 10px; padding: 10px 16px 0;
    background: var(--panel); border-top: 1px solid var(--border);
  }
  #attachbar + #send { border-top: 0; }
  #attachbar img { height: 64px; max-width: 140px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border); }
  #attachinfo { flex: 1; color: var(--muted); font-size: 13px; }
  #attachx { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 8px; border-radius: 6px; }
  #attachx:hover { color: var(--danger); background: var(--hover); }
  .msg .shot {
    display: block; margin-top: 4px; max-width: 100%; border-radius: 10px; overflow: hidden;
    background: var(--panel-2); cursor: zoom-in;
  }
  .msg .shot img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .msg .shot.failed {
    cursor: default; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; padding: 12px; text-align: center;
  }
  main.dragging::after {
    content: 'Drop an image to send it'; position: absolute; inset: 8px; z-index: 5; pointer-events: none;
    border: 2px dashed var(--accent); border-radius: 14px; background: rgba(106, 76, 245, .08);
    display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--accent);
  }
  .overlay.lightbox { background: rgba(10, 12, 20, .85); cursor: zoom-out; }
  .lightbox img { max-width: 95vw; max-height: 90vh; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  #count { align-self: center; color: var(--muted); font-size: 12px; min-width: 32px; text-align: right; }

  /* ---------- modal & toast ---------- */
  .overlay {
    position: fixed; inset: 0; background: rgba(20,24,40,.35);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20;
  }
  .modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px; width: 100%; max-width: 360px; max-height: 90vh;
    display: flex; flex-direction: column; gap: 12px;
  }
  .modal h2 { margin: 0; font-size: 18px; }
  .modal h3 { margin: 6px 0 0; font-size: 14px; color: var(--muted); }
  .modal label.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; }
  .modal label.field input, .modal label.field textarea { font-weight: 400; }
  .modal .hint { color: var(--muted); font-size: 12px; font-weight: 400; }
  .modal.scroll { overflow-y: auto; }

  .profile { padding: 0; overflow: hidden; gap: 0; }
  .profile .banner { height: 72px; }
  .profile .inner { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 10px; }
  .profile .big {
    width: 84px; height: 84px; font-size: 32px; margin-top: -42px;
    border: 4px solid var(--panel); cursor: default;
  }
  .profile .big .presence { width: 18px; height: 18px; border-width: 3px; right: 0; bottom: 0; }
  .profile .pname { font-size: 20px; font-weight: 800; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .profile .pname .badge { margin: 0; }
  .profile .pstatus { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
  .profile .pstatus .dotsm { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .profile .pstatus .dotsm.on { background: var(--ok); }
  .profile .pbio {
    background: var(--panel-2); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap;
    overflow-wrap: anywhere; font-size: 14px;
  }
  .profile .pmeta { color: var(--muted); font-size: 12px; }
  .profile .btns { justify-content: flex-start; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { border-radius: 999px; }
  .avrow { display: flex; align-items: center; gap: 12px; }
  .avrow .avatar { width: 64px; height: 64px; font-size: 24px; cursor: default; }
  .picks { overflow-y: auto; display: flex; flex-direction: column; gap: 2px; max-height: 300px; }
  .picks label { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .picks label:hover { background: var(--hover); }
  .picks input { accent-color: var(--accent); }
  .modal .btns { display: flex; justify-content: flex-end; gap: 8px; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px);
    box-shadow: 0 6px 20px rgba(20,24,40,.15);

<script>
// ===== CONFIG =====
// Your Apps Script web app URL (ends in /exec).
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwReV9VO2nrcARHTODgtMcs3H6Q6RqxEfzxxRtJcPyknqqxj8E4R04_YhCJrwczRrrw/exec';
const MAX_MSG = 300;
// ==================

const POLL_ACTIVE = 2500;
const POLL_BUSY = 1500; // while the open chat had a message in the last 30s
const POLL_HIDDEN = 10000;

const $ = id => document.getElementById(id);
const log = $('log'), textEl = $('text');

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

let token = store.get('chat_token');
let me = null;          // { name, role }
let st = null;          // friends, requests, convos
let uv = null;          // version of st the server last sent
let latest = {};        // newest message id per chat
let read = null;        // last read message id per chat
let openId = store.get('chat_open') || 'global';
let openRev = null;     // changes when messages in the open chat are deleted
let lastId = 0;         // newest message id shown in the open chat
let epoch = 0;          // bumps on chat switch so stale responses are ignored
let polling = false, pollAgain = false, pollTimer = null;
let lastError = '';
let sideSig = '';
const shown = new Set();

// ---------- helpers ----------
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c); // strings become text, never HTML
  return el;
}

const key = n => String(n || '').toLowerCase().replace(/[^a-z0-9]/g, '');

function colorFor(n, lightness = 38) {
  let hsh = 0;
  for (const c of key(n)) hsh = (hsh * 31 + c.charCodeAt(0)) >>> 0;
  // Hues 30-310 skip red and pink, which are kept for admins.
  return `hsl(${30 + hsh % 280} 70% ${lightness}%)`;
}

// Profiles are fetched in batches as names appear on screen, and refreshed
// once they're more than a minute old.
const profiles = new Map(); // key -> { data, at }
const profileWanted = new Set();
let profileTimer = null;
let profileVer = 0;

function profileOf(n) {
  const p = profiles.get(key(n));
  return p && p.data;
}

function wantProfiles(names) {
  names.forEach(n => {
    const p = profiles.get(key(n));
    if (!p || Date.now() - p.at > 60000) profileWanted.add(n);
  });
  if (profileWanted.size && !profileTimer && token) profileTimer = setTimeout(fetchProfiles, 50);
}

async function fetchProfiles() {
  profileTimer = null;
  const names = [...profileWanted].slice(0, 50);
  names.forEach(n => {
    profileWanted.delete(n);
    // Mark as fetched now so a slow response doesn't cause repeat requests.
    profiles.set(key(n), { data: profileOf(n) || null, at: Date.now() });
  });
  try {
    const d = await api('profiles', { names });
    if (d.ok) storeProfiles(d.profiles);
  } catch (e) {}
  if (profileWanted.size) profileTimer = setTimeout(fetchProfiles, 50);
}

function storeProfiles(map) {
  for (const [k, p] of Object.entries(map)) profiles.set(k, { data: p, at: Date.now() });
  profileVer++;
  document.querySelectorAll('.avatar[data-user]').forEach(paintAvatar);
  renderSide();
}

// opts.dot shows an online dot; opts.click = false disables opening the profile.
function avatar(n, opts = {}) {
  const el = h('div', {
    class: 'avatar',
    'data-user': key(n),
    'data-name': n,
    'data-dot': opts.dot ? '1' : null,
    title: opts.click === false ? null : n,
    onclick: opts.click === false ? null : e => { e.stopPropagation(); openProfile(n); },
  });
  if (opts.click === false) el.style.cursor = 'default';
  paintAvatar(el);
  wantProfiles([n]);
  return el;
}

function paintAvatar(el) {
  const n = el.dataset.name;
  const p = profileOf(n);
  if (p && p.avatar) {
    el.textContent = '';
    el.style.background = '';
    el.style.backgroundImage = `url("${p.avatar}")`; // server only accepts base64 image data URLs
  } else {
    el.style.backgroundImage = '';
    el.style.background = colorFor(n, 80);
    el.textContent = (n || '?')[0].toUpperCase();
  }
  if (el.dataset.dot && p && p.online) el.append(h('span', { class: 'presence', title: 'Online' }));
}

function modal(cls, ...kids) {
  const box = h('div', { class: 'modal ' + (cls || '') }, ...kids);
  const overlay = h('div', { class: 'overlay', onclick: e => { if (e.target === overlay) overlay.remove(); } }, box);
  document.body.append(overlay);
  return { overlay, box, close: () => overlay.remove() };
}

async function openProfile(name) {
  const m = modal('profile');
  const render = () => {
    const p = profileOf(name) || { username: name };
    const isMe = me && key(name) === key(me.name);
    const rel = !st ? '' : st.friends.some(n => key(n) === key(name)) ? 'friend'
      : st.incoming.some(n => key(n) === key(name)) ? 'incoming'
      : st.outgoing.some(n => key(n) === key(name)) ? 'outgoing' : '';
    const run = (action, data, done) => async () => { if (await act(action, data)) { m.close(); if (done) done(); } };
    const big = avatar(p.username || name, { dot: true, click: false });
    big.classList.add('big');
    const btns = [];
    if (isMe) btns.push(h('button', { class: 'primary', onclick: () => { m.close(); openEditProfile(); } }, 'Edit profile'));
    else if (rel === 'friend') btns.push(
      h('button', { class: 'primary', onclick: () => { m.close(); openDm(p.username || name); } }, 'Message'),
      h('button', { class: 'ghost danger', onclick: () => { if (confirm(`Remove ${name} from your friends?`)) run('unfriend', { username: name })(); } }, 'Remove friend'));
    else if (rel === 'incoming') btns.push(
      h('button', { class: 'primary', onclick: run('friendRespond', { username: name, accept: true }) }, 'Accept request'),
      h('button', { class: 'ghost', onclick: run('friendRespond', { username: name, accept: false }) }, 'Decline'));
    else if (rel === 'outgoing') btns.push(
      h('button', { class: 'ghost', onclick: run('unfriend', { username: name }) }, 'Cancel request'));
    else btns.push(h('button', { class: 'primary', onclick: run('friendRequest', { username: name }, () => toast('Friend request sent')) }, 'Add friend'));
    if (!isMe && me && me.role === 'admin' && p.role && p.role !== 'admin') {
      if (p.muted) btns.push(h('button', { class: 'ghost', onclick: run('timeout', { username: name, minutes: 0 }, () => toast(`${name}'s timeout ended`)) }, 'End timeout'));
      else btns.push(...TIMEOUTS.map(([label, mins]) => h('button', { class: 'ghost', onclick: run('timeout', { username: name, minutes: mins }, () => toast(`${name} timed out for ${label}`)) }, 'Timeout ' + label)));
      btns.push(p.banned
        ? h('button', { class: 'ghost', onclick: run('unban', { username: name }, () => toast(`${name} unbanned`)) }, 'Unban')
        : h('button', { class: 'ghost danger', onclick: () => { if (confirm(`Ban ${name}?`)) run('ban', { username: name }, () => toast(`${name} banned`))(); } }, 'Ban'));
    }
    m.box.replaceChildren(
      h('div', { class: 'banner', style: `background:${colorFor(name, 80)}` }),
      h('div', { class: 'inner' },
        big,
        h('div', { class: 'pname' + (p.role === 'admin' ? ' admin-name' : '') }, p.username || name, p.role === 'admin' && h('span', { class: 'badge' }, 'ADMIN'),
          p.banned && h('span', { class: 'badge', style: 'background:var(--danger);color:#fff' }, 'BANNED'),
          p.muted && h('span', { class: 'badge', style: 'background:var(--panel-2);color:var(--muted)' }, 'TIMED OUT')),
        h('div', { class: 'pstatus' },
          h('span', { class: 'dotsm' + (p.online ? ' on' : '') }),
          p.status || (p.online ? 'Online' : 'Offline')),
        p.bio && h('div', { class: 'pbio' }, p.bio),
        p.created && h('div', { class: 'pmeta' }, 'Joined ' + new Date(p.created).toLocaleDateString([], { year: 'numeric', month: 'long', day: 'numeric' })),
        h('div', { class: 'btns' }, btns)));
  };
  render();
  // Always get a fresh copy when opening someone's profile.
  try {
    const d = await api('profiles', { names: [name] });
    if (d.ok) { storeProfiles(d.profiles); if (m.overlay.isConnected) render(); }
  } catch (e) {}
}

const STATUS_PRESETS = ['Doing coding', 'Playing Minecraft', 'Touching grass', 'Doing homework', 'AFK'];

async function shrinkImage(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = rej;
      i.src = url;
    });
    // Center-crop to a 128px square JPEG so it fits in a Sheet cell.
    const size = 128;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const s = Math.min(img.naturalWidth, img.naturalHeight);
    const g = c.getContext('2d');
    g.fillStyle = '#fff';
    g.fillRect(0, 0, size, size);
    g.drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
    return c.toDataURL('image/jpeg', 0.85);
  } finally {
    URL.revokeObjectURL(url);
  }
}

function openEditProfile() {
  const p = profileOf(me.name) || {};
  let pic = p.avatar || '';
  const preview = h('div', { class: 'avatar' });
  const paintPreview = () => {
    preview.style.background = pic ? '' : colorFor(me.name, 80);
    preview.style.backgroundImage = pic ? `url("${pic}")` : '';
    preview.textContent = pic ? '' : me.name[0].toUpperCase();
  };
  paintPreview();
  const file = h('input', { type: 'file', accept: 'image/*', class: 'hidden' });
  file.onchange = async () => {
    if (!file.files[0]) return;
    try { pic = await shrinkImage(file.files[0]); paintPreview(); }
    catch (e) { toast("Couldn't read that image", true); }
    file.value = '';
  };
  const status = h('input', { maxlength: 40, placeholder: 'What are you up to?' });
  status.value = p.status || '';
  const bio = h('textarea', { maxlength: 200, placeholder: 'Tell people about yourself' });
  bio.value = p.bio || '';
  const bioCount = h('span', { class: 'hint' });
  const countBio = () => { bioCount.textContent = `${bio.value.length}/200`; };
  bio.oninput = countBio;
  countBio();

  const save = h('button', { class: 'primary', type: 'submit' }, 'Save');
  const cur = h('input', { type: 'password', placeholder: 'Current password', autocomplete: 'current-password' });
  const next = h('input', { type: 'password', placeholder: 'New password', autocomplete: 'new-password' });

  const m = modal('scroll',
    h('h2', null, 'Edit profile'),
    h('form', {
      style: 'display:flex;flex-direction:column;gap:12px',
      onsubmit: async e => {
        e.preventDefault();
        save.disabled = true;
        const d = await act('updateProfile', { avatar: pic, status: status.value, bio: bio.value });
        save.disabled = false;
        if (d) { storeProfiles(d.profiles); toast('Profile saved'); m.close(); }
      },
    },
      h('div', { class: 'avrow' }, preview, file,
        h('button', { class: 'ghost', type: 'button', onclick: () => file.click() }, 'Upload picture'),
        h('button', { class: 'ghost', type: 'button', onclick: () => { pic = ''; paintPreview(); } }, 'Remove')),
      h('label', { class: 'field' }, 'Status', status),
      h('div', { class: 'chips' }, STATUS_PRESETS.map(t =>
        h('button', { class: 'ghost', type: 'button', onclick: () => { status.value = t; } }, t)),
        h('button', { class: 'ghost', type: 'button', onclick: () => { status.value = ''; } }, 'Clear')),
      h('label', { class: 'field' }, h('span', null, 'About me ', bioCount), bio),
      h('div', { class: 'btns' },
        h('button', { class: 'ghost', type: 'button', onclick: () => m.close() }, 'Cancel'),
        save)),
    h('h3', null, 'Change password'),
    h('form', {
      style: 'display:flex;flex-direction:column;gap:8px',
      onsubmit: async e => {
        e.preventDefault();
        // Swap in the new token before act() polls: the old one was just revoked.
        const d = await act('changePassword', { current: cur.value, password: next.value }, d => {
          token = d.token;
          store.set('chat_token', token);
        });
        if (!d) return;
        cur.value = next.value = '';
        toast('Password changed. Other devices were logged out.');
      },
    }, cur, next, h('div', { class: 'btns' }, h('button', { class: 'ghost', type: 'submit' }, 'Change password'))));
  status.focus();
}

function fmtTime(t) {
  return new Date(t).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
}

let toastTimer;
function toast(msg, isErr, onClick) {
  let el = $('toast');
  if (!el) { el = h('div', { id: 'toast' }); document.body.append(el); }
  el.textContent = msg;
  el.className = (isErr ? 'err' : '') + (onClick ? ' click' : '');
  el.onclick = onClick ? () => { el.style.display = 'none'; onClick(); } : null;
  void el.offsetWidth; // restart the pop-in animation
  el.classList.add('show');
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3500);
}

// ---------- network ----------
async function api(action, data) {
  const shows = action === 'send' || action === 'image';
  if (shows) progress(1);
  try {
    return await apiRaw(action, data);
  } finally {
    if (shows) progress(-1);
  }
}

async function apiRaw(action, data) {
  // A plain string body is sent as text/plain, which avoids a CORS preflight
  // (Apps Script can't answer those).
  const res = await fetch(SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({ action, token, ...data }),
  });
  const d = await res.json();
  if (!d.ok && d.auth) signOut(d.error);
  return d;
}

// For button actions: shows errors as a toast, returns the response or null.
// Top progress bar, on while any save/load the user started is running.
let working = 0;
function progress(n) {
  working = Math.max(0, working + n);
  $('progress').classList.toggle('on', working > 0);
}

// The button the user just pressed, so act() can show a spinner on it.
let pressed = null, pressedAt = 0;
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('button');
  if (b) { pressed = b; pressedAt = Date.now(); }
}, true);
document.addEventListener('submit', e => {
  if (e.submitter) { pressed = e.submitter; pressedAt = Date.now(); }
}, true);

function takePressed() {
  // Generous window because confirm() dialogs pause between click and act().
  const b = pressed && Date.now() - pressedAt < 15000 && pressed.isConnected ? pressed : null;
  pressed = null;
  if (b) { b.classList.add('busy'); b.disabled = true; }
  return b;
}

let opsInFlight = 0; // polls that overlap an action may carry stale friends/chats
let stateGen = 0;

// For button actions: shows errors as a toast, returns the response or null.
// `optimistic(st)` updates the sidebar straight away; it's undone on failure.
async function act(action, data, onOk, optimistic) {
  const btn = takePressed();
  const before = optimistic && st ? JSON.stringify(st) : null;
  if (before) { optimistic(st); renderSide(); renderHeader(); }
  opsInFlight++;
  progress(1);
  try {
    const d = await api(action, data);
    if (!d.ok) {
      if (!d.auth) toast(d.error || 'Something went wrong', true);
      if (before) { st = JSON.parse(before); renderSide(); renderHeader(); }
      return null;
    }
    if (onOk) onOk(d);
    return d;
  } catch (e) {
    toast('Could not reach the server', true);
    if (before) { st = JSON.parse(before); renderSide(); renderHeader(); }
    return null;
  } finally {
    opsInFlight--;
    stateGen++;
    uv = null; // ask for a fresh friends/chats list on the next poll
    progress(-1);
    if (btn) { btn.classList.remove('busy'); btn.disabled = false; }
    pollNow();
  }
}

const drop = (list, n) => { const i = list.findIndex(x => key(x) === key(n)); if (i >= 0) list.splice(i, 1); };
const has = (list, n) => list.some(x => key(x) === key(n));

// ---------- auth ----------
let authMode = 'login';
document.querySelectorAll('.tabs button').forEach(b => {
  b.onclick = () => {
    authMode = b.dataset.mode;
    document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    document.querySelector('#authform .primary').textContent = authMode === 'login' ? 'Log in' : 'Create account';
    $('apass').autocomplete = authMode === 'login' ? 'current-password' : 'new-password';

});

$('authform').addEventListener('submit', async e => {

function signOut(msg) {

$('mename').onclick = () => { if (me) openProfile(me.name); };

async function logOut() {

function start() {
  $('auth').classList.add('hidden');

// ---------- loading screen ----------
const LOADING_LINES = [
  'Please wait. Idiosy is occurring.',
  'Loading poor decisions\u2026',
  'Establishing questionable connections\u2026',
  'Encrypting your nonsense\u2026',
  'Contacting the spreadsheet\u2026',
  'Attempting social interaction\u2026',
];
const LOADING_MIN_MS = 1000; // long enough to read one line, so it doesn't just flash
let loading = false, loadingSince = 0, loadingTimer = null;

function showLoading() {
  loading = true;
  loadingSince = Date.now();
  $('loading').classList.remove('hidden');
  let i = Math.floor(Math.random() * LOADING_LINES.length);
  const next = () => {
    const el = $('loadmsg');
    el.classList.remove('in');
    void el.offsetWidth; // restart the fade animation
    el.textContent = LOADING_LINES[i++ % LOADING_LINES.length];
    el.classList.add('in');
  };
  next();
  clearInterval(loadingTimer);
  loadingTimer = setInterval(next, 2200);
}

function hideLoading(now) {
  if (!loading) return;
  loading = false;
  setTimeout(() => {
    if (loading) return; // shown again meanwhile
    clearInterval(loadingTimer);
    $('loading').classList.add('hidden');
  }, now ? 0 : Math.max(0, LOADING_MIN_MS - (Date.now() - loadingSince)));
}

// ---------- polling ----------
async function poll() {
  if (!token) return;
  if (polling) { pollAgain = true; return; }
  polling = true;
  const myEpoch = epoch;
  const myGen = stateGen;
  try {
    const d = await api('poll', {
      open: openId, after: lastId, eafter: eMax, uv, rev: openRev, pingAfter: pingTop,
      k: me ? key(me.name) : undefined, known: st ? st.convos.map(c => c.id) : undefined, // lets the server batch its reads
    });
    if (!d.ok) {
      if (!d.auth && d.error !== lastError) { lastError = d.error; sys('Server error: ' + d.error, true); }
      hideLoading(); // so the error is visible
      return;
    }
    lastError = '';
    setStatus(true);
    me = d.me;
    latest = d.latest;
    settings = d.settings || settings;
    if ((d.api || 0) !== serverApi) { serverApi = d.api || 0; log.querySelectorAll('.post').forEach(paintCommentCount); }
    if (pingTop === null) pingTop = d.pingTop; // first poll: don't replay old notifications
    else if (d.pings && d.pings.length) {
      pingTop = Math.max(pingTop, ...d.pings.map(p => p.n));
      handlePings(d.pings);
    }
    // A poll that overlapped an action may describe the world before it.
    if (d.state && myGen === stateGen && !opsInFlight) { st = d.state; uv = d.uv; }
    loadRead();

    if (myEpoch === epoch) {
      if (d.open !== openId && !isPendingChat(openId)) {
        // Chat is gone (left the group, unfriended, etc.)
        switchTo('global');
        return;
      }
      if (d.reset) {
        const sending = [...log.querySelectorAll('.pending')];
        clearLog();
        openRev = d.rev;
        if (!d.messages.length && !sending.length) sys(emptyText()).classList.add('empty');
        log.append(...sending);
      }
      if (d.messages) renderBatch(d.messages, !d.reset);
      if (d.messages && d.messages.length && !d.reset) lastActivity = Date.now();
      if (d.edited) d.edited.forEach(updateMessage);
      if (d.reset) { hideLoading(); scrollDown(); }
      markRead();
    }
    renderSide();
    renderHeader();
    updateComposer();
    updateTitle();
    loadMyCode();
  } catch (e) {
    setStatus(false);
  } finally {
    polling = false;
    if (pollAgain) { pollAgain = false; poll(); } else schedule();
  }
}

let lastActivity = 0; // when the open chat last had a new message

function schedule() {
  clearTimeout(pollTimer);
  // Check a bit more often while messages are flowing, back off when quiet.
  const busy = Date.now() - lastActivity < 30000;
  if (token) pollTimer = setTimeout(poll, document.hidden ? POLL_HIDDEN : busy ? POLL_BUSY : POLL_ACTIVE);
}

function pollNow() {
  clearTimeout(pollTimer);
  poll();
}

function setStatus(ok) {
  $('status').className = ok ? 'online' : 'offline';
  $('status').title = ok ? 'Connected' : 'Reconnecting…';
}

// ---------- unread ----------
function loadRead() {
  if (read || !me) return;
  const saved = store.get('chat_read_' + key(me.name));
  // First time on this device: treat everything as already read.
  read = saved ? JSON.parse(saved) : { ...latest };
  saveRead();
}

function saveRead() {
  if (me && read) store.set('chat_read_' + key(me.name), JSON.stringify(read));
}

function markRead() {
  if (!read) return;
  const top = Math.max(lastId, latest[openId] || 0);
  if (top > (read[openId] || 0)) { read[openId] = top; saveRead(); }
}

const isUnread = id => id !== openId && read && (latest[id] || 0) > (read[id] || 0);

// ---------- sidebar ----------
function convoLabel(c) {
  if (c.type === 'global') return 'Global feed';
  if (c.type === 'group') return c.name;
  return c.members.find(n => key(n) !== key(me.name)) || 'DM';
}

let seenRows = null; // row ids from the last render, so new rows can animate in

function renderSide() {
  if (!st || !me) return;
  const sig = JSON.stringify([st, latest, openId, read, me, profileVer]);
  if (sig === sideSig) return;
  sideSig = sig;
  const seen = new Set();
  const fresh = (el, id) => {
    seen.add(id);
    if (seenRows && !seenRows.has(id)) el.classList.add('enter');
    return el;
  };

  $('adminbtn').classList.toggle('hidden', me.role !== 'admin');
  const mine = profileOf(me.name);
  $('mename').replaceChildren(avatar(me.name, { dot: true, click: false }),
    h('span', { class: 'two' },
      h('b', { class: me.role === 'admin' ? 'admin-name' : null }, me.role === 'admin' ? h('span', { class: 'badge' }, 'ADMIN') : '', me.name),
      h('span', { class: 'st' }, (mine && mine.status) || 'Set a status')));

  const convos = st.convos.slice().sort((a, b) =>
    a.type === 'global' ? -1 : b.type === 'global' ? 1 : (latest[b.id] || 0) - (latest[a.id] || 0));
  $('convos').replaceChildren(...convos.map(c => {
    const label = convoLabel(c);
    const icon = c.type === 'dm' ? avatar(label, { dot: true }) : h('div', { class: 'avatar icon' }, c.type === 'global' ? '#' : '⁂');
    const unread = isUnread(c.id);
    return fresh(h('button', {
      class: 'row' + (c.id === openId ? ' on' : '') + (unread ? ' unread' : ''),
      onclick: () => switchTo(c.id),
    }, icon, h('span', { class: 'label' }, label), unread && h('span', { class: 'dot' })), 'c:' + c.id);
  }));

  const reqs = [];
  st.incoming.forEach(n => reqs.push(fresh(h('div', { class: 'req' },
    h('b', null, n), ' wants to be friends',
    h('div', { class: 'actions' },
      h('button', { class: 'primary', style: 'padding:4px 12px', onclick: () => respond(n, true) }, 'Accept'),
      h('button', { class: 'ghost', onclick: () => respond(n, false) }, 'Decline'))), 'i:' + key(n))));
  st.outgoing.forEach(n => reqs.push(fresh(h('div', { class: 'row' },
    avatar(n), h('span', { class: 'label' }, n, h('span', { class: 'muted' }, 'pending')),
    h('button', { class: 'x', title: 'Cancel request', onclick: () => unfriend(n) }, '✕')), 'o:' + key(n))));
  $('requests').replaceChildren(...reqs);

  $('friends').replaceChildren(...(st.friends.length
    ? st.friends.slice().sort((a, b) => a.localeCompare(b)).map(n => fresh(h('div', { class: 'row', onclick: () => openDm(n) },
        avatar(n, { dot: true }),
        h('span', { class: 'label two' }, h('b', { style: 'font-weight:500', class: profileOf(n) && profileOf(n).role === 'admin' ? 'admin-name' : null }, n),
          profileOf(n) && profileOf(n).status && h('span', { class: 'st' }, profileOf(n).status)),
        h('button', {
          class: 'x', title: 'Remove friend',
          onclick: e => { e.stopPropagation(); if (confirm(`Remove ${n} from your friends?`)) unfriend(n); },
        }, '✕')), 'f:' + key(n)))
    : [h('div', { class: 'muted' }, 'No friends yet. Share your friend code, or add someone by their username or code!')]));
  seenRows = seen;
}

// Friend actions update the sidebar immediately; the server catches up after.
function respond(n, accept) {
  return act('friendRespond', { username: n, accept }, null, s => {
    drop(s.incoming, n);
    if (accept && !has(s.friends, n)) s.friends.push(n);
  });
}

function unfriend(n) {
  return act('unfriend', { username: n }, null, s => { drop(s.friends, n); drop(s.outgoing, n); });
}

function requestFriend(n) {
  return act('friendRequest', { username: n }, null, s => {
    if (has(s.friends, n)) return;
    if (has(s.incoming, n)) { drop(s.incoming, n); s.friends.push(n); } // they'd already asked us
    else if (!has(s.outgoing, n)) s.outgoing.push(n);
  });
}

function renderHeader() {
  if (isFeed() && me && !$('fbrow').querySelector('.avatar')) $('fbrow').prepend(avatar(me.name, { click: false }));
  const c = st && st.convos.find(c => c.id === openId);
  $('title').style.cursor = c && c.type === 'dm' ? 'pointer' : '';
  $('title').onclick = c && c.type === 'dm' ? () => openProfile(convoLabel(c)) : null;
  const isGroup = c && c.type === 'group';
  if (c) pendingTitle = null;
  $('title').textContent = c ? convoLabel(c) : pendingTitle || (openId === 'global' ? 'Global' : 'Loading\u2026');
  $('sub').textContent = !c ? (pendingTitle ? 'Direct message' : openId === 'global' ? 'Everyone' : '')
    : c.type === 'global' ? 'Posts from everyone' + (settings.slow ? ` \u00b7 Slow mode: ${settings.slow}s` : '')
    : c.type === 'dm' ? 'Direct message'
    : `${c.members.length} members: ${c.members.join(', ')}`;
  $('gadd').classList.toggle('hidden', !isGroup);
  $('gleave').classList.toggle('hidden', !isGroup);
  textEl.placeholder = c ? `Message ${c.type === 'global' ? 'everyone' : convoLabel(c)}…` : 'Say something…';
}

function emptyText() {
  if (openId === 'global') return 'No posts yet. Be the first to post something!';
  return 'This is the start of the chat.';
}

// ---------- switching chats ----------
let pendingTitle = null; // title for a chat the sidebar doesn't know about yet

const isPendingChat = id => String(id).startsWith('pending:');
const isFeed = () => openId === 'global';

// The Global feed shows posts newest-first with its own composer at the top;
// the composer's attachment bar and notes move up there while it's open.
function setFeedMode(on) {
  document.body.classList.toggle('feedmode', on);
  log.classList.toggle('feed', on);
  $('newmsgs').textContent = on ? 'New posts \u2191' : 'New messages \u2193';
  const note = $('composernote'), bar = $('attachbar');
  if (on) {
    $('feedbox').prepend(note, bar); // above the post box, like in chats
    if (me) $('fbrow').replaceChildren(avatar(me.name, { click: false }), $('posttext'));
  } else {
    $('send').before(note, bar);
  }
}

// Messages of recently opened chats, kept in memory only (never saved to the
// device, since DMs are private), so switching back is instant.
const chatCache = new Map();

function rememberChat() {
  if (!openRev || isPendingChat(openId)) return;
  const msgs = [...log.querySelectorAll('.msg:not(.pending)')].map(el => el._m).filter(m => m && m.id);
  chatCache.delete(openId);
  chatCache.set(openId, { msgs, rev: openRev, eMax });
  while (chatCache.size > 12) chatCache.delete(chatCache.keys().next().value);
}

function switchTo(id) {
  rememberChat();
  openId = id;
  if (!isPendingChat(id)) store.set('chat_open', id);
  epoch++;
  openRev = null;
  eMax = 0;
  closePicker();
  clearLog();
  setFeedMode(isFeed());
  const cached = chatCache.get(id);
  if (cached) {
    // Show what we had straight away; the next poll adds anything new, and
    // reloads fully if something was deleted meanwhile.
    openRev = cached.rev;
    eMax = cached.eMax;
    if (cached.msgs.length) renderBatch(cached.msgs, false);
    else sys(emptyText()).classList.add('empty');
    scrollDown();
    markRead();
  } else {
    showChatLoading();
  }
  document.body.classList.remove('side-open');
  renderSide();
  renderHeader();
  updateComposer();
  pollNow();
}

// Spinning logo, changing lines and placeholder messages until the chat loads.
const CHAT_LOADING_LINES = [
  'Fetching messages\u2026',
  'Contacting the spreadsheet\u2026',
  'Reading your friends\u2019 nonsense\u2026',
  'Please wait. Idiosy is occurring.',
  'Unscrambling messages\u2026',
];
let chatLoadTimer = null;

function showChatLoading() {
  const line = h('div', { class: 'line in' });
  let i = Math.floor(Math.random() * CHAT_LOADING_LINES.length);
  const next = () => {
    line.classList.remove('in');
    void line.offsetWidth;
    line.textContent = CHAT_LOADING_LINES[i++ % CHAT_LOADING_LINES.length];
    line.classList.add('in');
  };
  next();
  clearInterval(chatLoadTimer);
  chatLoadTimer = setInterval(() => { if (line.isConnected) next(); else clearInterval(chatLoadTimer); }, 2000);
  const skel = w => h('div', { class: 'skel' },
    h('div', { class: 'a shimmer' }), h('div', { class: 'b shimmer', style: 'width:90px' }), h('div', { class: 'c shimmer', style: `width:${w}%` }));
  log.append(h('div', { class: 'chatload', 'aria-live': 'polite' },
    h('div', { class: 'top' }, h('img', { class: 'logo', alt: '', src: $('favicon').href }), line),
    skel(55), skel(35), skel(70), skel(45)));
}

async function openDm(name) {
  const id = 'dm_' + [key(me.name), key(name)].sort().join('_');
  if (st && st.convos.some(c => c.id === id)) return switchTo(id); // no need to ask the server
  // Switch away from the current chat right now, so nothing typed while the
  // server sets up the DM can land in the wrong chat.
  const temp = 'pending:' + key(name);
  pendingTitle = name;
  switchTo(temp);
  const d = await act('openDm', { username: name });
  if (openId !== temp) return; // clicked somewhere else meanwhile
  switchTo(d ? d.convo : 'global');
}

$('addfriend').addEventListener('submit', async e => {
  e.preventDefault();
  const input = $('addfriend').querySelector('input');
  const name = input.value.trim();
  if (!name) return;
  const words = codeWords(name);
  // 4 words that can't be a username (or are all code words) are a friend code.
  if (words.length === 4 && (words.every(w => CODE_WORDS.includes(w)) || name.length > 20)) {
    const bad = words.filter(w => !CODE_WORDS.includes(w));
    if (bad.length) return toast(`"${bad[0]}" isn't one of the code words. Check the spelling!`, true);
    if (codesOff) return toast("Friend codes aren't switched on yet. Add them by username for now.", true);
    input.value = '';
    const d = await act('addByCode', { code: words.join(' ') });
    if (!d) { if (!input.value) input.value = name; return; }
    toast(`You're now friends with ${d.username}!`);
    return;
  }
  input.value = '';
  const d = await requestFriend(name);
  if (!d && !input.value) input.value = name;
  if (!d) return;
  input.value = '';
  toast(d.status === 'friends' ? `You're now friends with ${d.username}!` : `Friend request sent to ${d.username}`);
});

// ---------- groups ----------
function picker({ title, withName, exclude = [], button, onSubmit }) {
  const friends = (st ? st.friends : []).filter(n => !exclude.some(x => key(x) === key(n)));
  const nameInput = withName && h('input', { placeholder: 'Group name', maxlength: 30 });
  const boxes = friends.map(n => h('input', { type: 'checkbox', value: n }));
  const close = () => overlay.remove();
  const submit = h('button', { class: 'primary', type: 'submit' }, button);
  const overlay = h('div', { class: 'overlay', onclick: e => { if (e.target === overlay) close(); } },
    h('form', {
      class: 'modal',
      onsubmit: async e => {
        e.preventDefault();
        const picked = boxes.filter(b => b.checked).map(b => b.value);
        if (!picked.length) return toast('Pick at least one friend', true);
        submit.disabled = true;
        if (await onSubmit(picked, nameInput ? nameInput.value : '')) close();
        else submit.disabled = false;
      },
    },
      h('h2', null, title),
      nameInput,
      friends.length
        ? h('div', { class: 'picks' }, friends.map((n, i) => h('label', null, boxes[i], avatar(n), n)))
        : h('div', { class: 'muted' }, exclude.length > 1 ? 'All your friends are already here.' : 'Add some friends first.'),
      h('div', { class: 'btns' },
        h('button', { class: 'ghost', type: 'button', onclick: close }, 'Cancel'),
        friends.length && submit)));
  document.body.append(overlay);
  (nameInput || boxes[0] || submit).focus();
}

$('newgroup').onclick = () => picker({
  title: 'New group', withName: true, button: 'Create',
  onSubmit: async (members, name) => {
    if (!name.trim()) { toast('Give the group a name', true); return false; }
    const d = await act('createGroup', { name, members });
    if (d) switchTo(d.convo);
    return !!d;
  },
});

$('gadd').onclick = () => {
  const c = st.convos.find(c => c.id === openId);
  picker({
    title: 'Add people', exclude: c.members, button: 'Add',
    onSubmit: async members => !!(await act('addToGroup', { convo: openId, members })),
  });
};

$('gleave').onclick = async () => {
  if (!confirm('Leave this group?')) return;
  const id = openId;
  switchTo('global');
  const d = await act('leaveGroup', { convo: id }, null, s => { s.convos = s.convos.filter(c => c.id !== id); });
  if (!d) switchTo(id);
};

// ---------- messages ----------
// "Bottom" means where new things appear: the bottom of a chat, the top of the feed.
function nearBottom() {
  if (isFeed()) return log.scrollTop < 80;
  return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
}

function scrollDown() {
  log.scrollTop = isFeed() ? 0 : log.scrollHeight;
  $('newmsgs').style.display = 'none';
}

// Feed posts are kept newest-first; pending posts sit above everything.
function placeInFeed(el) {
  const id = Number(el.dataset.id) || Infinity;
  const after = [...log.children].find(c => c.classList.contains('msg') && !c.classList.contains('pending') && Number(c.dataset.id) < id);
  if (el.classList.contains('pending')) log.insertBefore(el, log.querySelector('.msg, .sys:not(.err)'));
  else log.insertBefore(el, after || null);
}

function clearLog() {
  clearInterval(chatLoadTimer);
  log.replaceChildren();
  shown.clear();
  lastId = 0;
}

function canDelete(m) {
  return me && (me.role === 'admin' || key(m.name) === key(me.name));
}

function buildMessage(m, pending) {
  if (isFeed()) return buildPost(m, pending);
  const time = h('span', { class: 'time' });
  if (pending) time.append(h('span', { class: 'spinner' }), 'sending');
  else time.textContent = fmtTime(m.time);

  const el = h('div', { class: 'msg' + (pending ? ' pending' : ''), 'data-user': key(m.name), 'data-time': m.time || Date.now() },
    avatar(m.name),
    h('div', { class: 'head' },
      h('span', { class: 'name' + (m.admin ? ' admin-name' : ''), style: `color:${colorFor(m.name)}`, onclick: () => openProfile(m.name) }, m.name),
      m.admin && h('span', { class: 'badge' }, 'ADMIN'),
      time),
    h('div', { class: 'body' }, m.text ? richText(m.text) : null, m.img && imageBlock(m)),
    h('div', { class: 'reacts' }),
    !pending && h('div', { class: 'acts' },
      h('button', { title: 'Add reaction', onclick: e => openPicker(e.currentTarget, el) }, '\u{1F642}+'),
      !isMine(m) && h('button', { title: 'Report', onclick: () => openReport(el._m) }, '\u2691'),
      canDelete(m) && h('button', { class: 'del danger', title: 'Delete', onclick: () => deleteMessage(el._m, el) }, '\u{1F5D1}')));
  el._m = m;
  el.dataset.id = m.id || '';
  if (m.text && mentionsMe(m.text) && !isMine(m)) el.classList.add('mentioned');
  paintReactions(el);
  if (m.e) eMax = Math.max(eMax, m.e);
  return el;
}

const isMine = m => me && key(m.name) === key(me.name);

function buildPost(m, pending) {
  const time = h('span', { class: 'time' });
  if (pending) time.append(h('span', { class: 'spinner' }), 'posting');
  else time.textContent = new Date(m.time).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const cbtn = h('button', { onclick: () => toggleComments(el) });
  const el = h('div', { class: 'msg post' + (pending ? ' pending' : ''), 'data-user': key(m.name), 'data-time': m.time || Date.now() },
    h('div', { class: 'phead' },
      avatar(m.name),
      h('div', { class: 'who2' },
        h('div', { class: 'line' },
          h('span', { class: 'name' + (m.admin ? ' admin-name' : ''), style: `color:${colorFor(m.name)}`, onclick: () => openProfile(m.name) }, m.name),
          m.admin && h('span', { class: 'badge' }, 'ADMIN')),
        time)),
    h('div', { class: 'body' }, m.text ? richText(m.text) : null),
    m.img && imageBlock(m, 520),
    h('div', { class: 'reacts' }),
    !pending && h('div', { class: 'pfoot' },
      h('button', { title: 'React', onclick: e => openPicker(e.currentTarget, el) }, '\u{1F642} React'),
      cbtn),
    !pending && h('div', { class: 'acts' },
      !isMine(m) && h('button', { title: 'Report', onclick: () => openReport(el._m) }, '\u2691'),
      canDelete(m) && h('button', { class: 'del danger', title: 'Delete', onclick: () => deleteMessage(el._m, el) }, '\u{1F5D1}')));
  el._m = m;
  el._cbtn = cbtn;
  el.dataset.id = m.id || '';
  if (m.text && mentionsMe(m.text) && !isMine(m)) el.classList.add('mentioned');
  paintReactions(el);
  paintCommentCount(el);
  if (m.e) eMax = Math.max(eMax, m.e);
  return el;
}

let serverApi = 0; // features the backend supports; comments need 3

function paintCommentCount(el) {
  if (!el._cbtn) return;
  el._cbtn.classList.toggle('hidden', serverApi < 3); // backend not updated yet
  const n = el._m.cc || 0;
  el._cbtn.textContent = '\u{1F4AC} ' + (n ? `${n} comment${n === 1 ? '' : 's'}` : 'Comment');
  el._cbtn.classList.toggle('on', !!el._cmts);
}

// ---------- comments ----------
async function toggleComments(el, focus = true) {
  if (el._cmts) { el._cmts.remove(); el._cmts = null; paintCommentCount(el); return; }
  const post = el._m;
  const list = h('div', { class: 'comments' }, h('div', { class: 'shimmer', style: 'height:34px;border-radius:12px' }));
  const input = h('input', { placeholder: 'Write a comment\u2026', maxlength: 300 });
  const form = h('form', { class: 'cform', onsubmit: e => { e.preventDefault(); sendComment(el, input); } },
    input, h('button', { class: 'primary', type: 'submit' }, 'Reply'));
  el._cmts = h('div', { class: 'comments enter' }, list, form);
  el.append(el._cmts);
  paintCommentCount(el);
  if (focus) input.focus();
  await loadComments(el);
}

async function loadComments(el) {
  const box = el._cmts;
  if (!box) return;
  try {
    const d = await api('comments', { post: el._m.id });
    if (!box.isConnected) return;
    const list = box.firstElementChild;
    if (!d.ok) { list.replaceChildren(h('div', { class: 'muted' }, d.error || "Couldn't load comments")); return; }
    const pending = [...list.querySelectorAll('.cmt.pending')];
    list.replaceChildren(...d.comments.map(c => buildComment(el, c)), ...pending);
  } catch (e) {
    if (box.isConnected) box.firstElementChild.replaceChildren(h('div', { class: 'muted' }, "Couldn't load comments"));
  }
}

function buildComment(postEl, c, pending) {
  const convo = 'p:' + postEl._m.id;
  const row = h('div', { class: 'cmt' + (pending ? ' pending' : '') + (c.text && mentionsMe(c.text) && !isMine(c) ? ' mentioned' : '') },
    avatar(c.name),
    h('div', { class: 'col' },
      h('div', { class: 'bubble' },
        h('b', { class: c.admin ? 'admin-name' : '', style: `color:${colorFor(c.name)}`, onclick: () => openProfile(c.name) }, c.name),
        c.admin && h('span', { class: 'badge' }, 'ADMIN'),
        richText(c.text || '')),
      h('div', { class: 'meta' },
        pending ? 'sending\u2026' : fmtTime(c.time),
        !pending && !isMine(c) && h('button', { onclick: () => openReport(c, convo) }, 'Report'),
        !pending && canDelete(c) && h('button', {
          onclick: async () => {
            row.classList.add('removing');
            const d = await act('deleteMessage', { convo, id: c.id });
            if (!d) { row.classList.remove('removing'); return; }
            row.remove();
            postEl._m = Object.assign({}, postEl._m, { cc: Math.max(0, (postEl._m.cc || 1) - 1) });
            paintCommentCount(postEl);
          },
        }, 'Delete'))));
  return row;
}

async function sendComment(postEl, input) {
  const text = input.value.trim();
  if (!text || !me) return;
  input.value = '';
  const list = postEl._cmts && postEl._cmts.firstElementChild;
  const pending = buildComment(postEl, { name: me.name, admin: me.role === 'admin', text }, true);
  if (list) { list.querySelectorAll('.shimmer, .muted').forEach(x => x.remove()); list.append(pending); }
  try {
    const d = await api('send', { convo: 'p:' + postEl._m.id, text });
    if (!d.ok) {
      pending.remove();
      if (!input.value) input.value = text;
      if (!d.auth) toast(d.error || 'Could not comment', true);
      return;
    }
    pending.replaceWith(buildComment(postEl, d.message));
    postEl._m = Object.assign({}, postEl._m, { cc: (postEl._m.cc || 0) + 1 });
    paintCommentCount(postEl);
    if (settings.slow && me.role !== 'admin') { slowUntil = Date.now() + settings.slow * 1000; updateComposer(); }
  } catch (e) {
    pending.remove();
    if (!input.value) input.value = text;
    toast('Could not reach the server', true);
  }
}

// Jump to a post in the feed (e.g. from a "commented on your post" notification).
function openPost(id) {
  if (openId !== 'global') switchTo('global');
  const started = Date.now();
  const look = () => {
    const el = log.querySelector(`.msg.post[data-id="${id}"]`);
    if (el) {
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
      if (!el._cmts) toggleComments(el, false);
      else loadComments(el);
    } else if (Date.now() - started < 15000 && openId === 'global') setTimeout(look, 300);
  };
  look();
}

// ---------- mentions ----------
function myMentionRe() {
  if (!me) return null;
  const parts = me.name.split(/[\s_-]+/).map(p => p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return new RegExp('@' + parts.join('[\\s_-]*') + '(?![A-Za-z0-9])', 'i');
}

function mentionsMe(text) {
  const re = myMentionRe();
  return !!re && re.test(text);
}

// Message text with @mentions highlighted (built from text nodes, never HTML).
function richText(text) {
  const mine = myMentionRe();
  // (?!) never matches, for when we don't know our own name yet.
  const re = new RegExp('(' + (mine ? mine.source : '(?!)') + ')|(@[A-Za-z0-9_-]+)', 'gi');
  const out = [];
  let last = 0, m;
  while ((m = re.exec(text))) {
    out.push(text.slice(last, m.index));
    out.push(h('span', { class: 'ment' + (m[1] ? ' you' : '') }, m[0]));
    last = m.index + m[0].length;
  }
  out.push(text.slice(last));
  return h('span', null, out.filter(x => x !== ''));
}

// ---------- reactions ----------
const REACTIONS = ['\u{1F44D}', '\u2764\uFE0F', '\u{1F602}', '\u{1F62E}', '\u{1F622}', '\u{1F480}', '\u{1F525}'];

function paintReactions(el, popEmoji) {
  const m = el._m;
  const bar = el.querySelector('.reacts');
  if (!bar) return;
  const r = m.r || {};
  bar.replaceChildren(...REACTIONS.filter(e => r[e] && r[e].length).map(e => {
    const names = r[e];
    const mine = me && names.some(n => key(n) === key(me.name));
    return h('button', {
      class: (mine ? 'mine' : '') + (e === popEmoji ? ' pop' : ''),
      title: names.join(', '),
      onclick: () => toggleReaction(el, e),
    }, e, h('span', null, String(names.length)));
  }));
}

// Messages whose reactions changed (from a poll): repaint in place.
function updateMessage(m) {
  if (m.e) eMax = Math.max(eMax, m.e);
  const el = log.querySelector(`.msg[data-id="${m.id}"]`);
  if (!el || el._busy) return;
  const countChanged = (el._m.cc || 0) !== (m.cc || 0);
  el._m = m;
  paintReactions(el);
  paintCommentCount(el);
  if (countChanged && el._cmts) loadComments(el);
}

async function toggleReaction(el, emoji) {
  closePicker();
  const m = el._m;
  if (!m.id || !me) return;
  // Show it straight away, then settle on whatever the server says.
  const before = JSON.stringify(m.r || {});
  const r = JSON.parse(before);
  const names = r[emoji] || [];
  const i = names.findIndex(n => key(n) === key(me.name));
  if (i >= 0) names.splice(i, 1); else names.push(me.name);
  if (names.length) r[emoji] = names; else delete r[emoji];
  el._m = Object.assign({}, m, { r });
  el._busy = true;
  paintReactions(el, i < 0 ? emoji : null);
  const d = await act('react', { convo: openId, id: m.id, emoji });
  el._busy = false;
  el._m = d ? d.message : Object.assign({}, m, { r: JSON.parse(before) });
  if (d && d.message.e) eMax = Math.max(eMax, d.message.e);
  paintReactions(el);
}

let pickerEl = null;
function openPicker(btn, el) {
  closePicker();
  const rect = btn.getBoundingClientRect();
  pickerEl = h('div', { class: 'picker', role: 'menu' },
    REACTIONS.map(e => h('button', { title: 'React ' + e, onclick: () => toggleReaction(el, e) }, e)));
  document.body.append(pickerEl);
  const w = pickerEl.offsetWidth;
  pickerEl.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, rect.right - w)) + 'px';
  pickerEl.style.top = Math.max(8, rect.top - pickerEl.offsetHeight - 6) + 'px';
  el.classList.add('picking');
  pickerEl._msg = el;
}

function closePicker() {
  if (!pickerEl) return;
  if (pickerEl._msg) pickerEl._msg.classList.remove('picking');
  pickerEl.remove();
  pickerEl = null;
}
document.addEventListener('mousedown', e => {

log.addEventListener('scroll', closePicker);
