async function deleteMessage(m, el) {
  el.classList.add('removing'); // fade out now, put back if the server says no
  const d = await act('deleteMessage', { convo: openId, id: m.id }, d => {
    openRev = d.rev; // we already applied our own delete, no need to reload
  });
  if (d) { el.remove(); groupMessages(); }
  else el.classList.remove('removing');
}

function addMessage(m) {
  if (shown.has(m.id)) return;
  shown.add(m.id);
  const el = buildMessage(m);
  if (isFeed()) placeInFeed(el); else log.appendChild(el);
}

// Consecutive messages from one person within 5 minutes share a header.
function groupMessages() {
  if (isFeed()) return; // posts stand alone
  let prev = null;
  for (const el of log.children) {
    const isMsg = el.classList.contains('msg');
    el.classList.toggle('cont', isMsg && !!prev && !el.classList.contains('pending') &&
      prev.dataset.user === el.dataset.user && el.dataset.time - prev.dataset.time < 300000);
    prev = isMsg && !el.classList.contains('pending') ? el : null;
  }
}

function sys(text, isErr) {
  const stick = nearBottom();
  const el = h('div', { class: 'sys' + (isErr ? ' err' : '') }, text);
  if (isFeed()) log.prepend(el); else log.appendChild(el);
  if (stick) scrollDown();
  return el;
}

function renderBatch(msgs, animate) {
  if (!msgs.length) return;
  const stick = nearBottom();
  log.querySelectorAll('.sys.empty').forEach(e => e.remove());
  const before = new Set(log.children);
  msgs.forEach(addMessage);
  if (animate) {
    // Slide in only what just arrived, not a whole chat loading at once.
    for (const el of log.children) {
      if (!before.has(el) && el.classList.contains('msg') && !el.classList.contains('pending')) el.classList.add('new');
    }
  }
  lastId = Math.max(lastId, ...msgs.map(m => m.id));
  // Keep messages still being sent at the end new things appear.
  log.querySelectorAll('.pending').forEach(p => isFeed() ? log.prepend(p) : log.appendChild(p));
  groupMessages();
  if (stick) scrollDown();
  else $('newmsgs').style.display = 'block';
}

// ---------- composer state: timeouts and slow mode ----------
let slowUntil = 0, slowTimer = null;

function updateComposer() {
  const note = $('composernote');
  const btn = isFeed() ? $('postbtn') : document.querySelector('#send button[type=submit]');
  const muted = me && me.muted > Date.now();
  const slowLeft = Math.ceil((slowUntil - Date.now()) / 1000);
  const waiting = isPendingChat(openId); // DM still being created
  textEl.disabled = !!muted || waiting;
  $('attach').disabled = !!muted || waiting;
  $('posttext').disabled = !!muted;
  $('postimg').disabled = !!muted;
  if (muted) {
    note.textContent = `You're timed out until ${new Date(me.muted).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}. You can still read messages.`;
    note.className = 'composer-note warn';
  } else if (openId === 'global' && settings.slow && slowLeft > 0) {
    note.textContent = `Slow mode is on. You can post again in ${slowLeft}s.`;
    note.className = 'composer-note';
  } else {
    note.className = 'composer-note hidden';
  }
  if (!btn.classList.contains('busy')) btn.disabled = !!muted || waiting || (openId === 'global' && slowLeft > 0);
  clearTimeout(slowTimer);
  if (slowLeft > 0 || muted) slowTimer = setTimeout(updateComposer, 500);
}

async function send(text, att) {
  const btn = isFeed() ? $('postbtn') : document.querySelector('#send button[type=submit]');
  const myEpoch = epoch;
  btn.disabled = true;
  // Show the message right away while the server catches up.
  const pending = buildMessage({
    name: me ? me.name : '', admin: me && me.role === 'admin', text,
    ...(att && { img: 'local', local: att.data, w: att.w, h: att.h }),
  }, true);
  log.querySelectorAll('.sys.empty').forEach(e => e.remove());
  if (isFeed()) log.prepend(pending); else log.appendChild(pending);
  scrollDown();
  try {
    const d = await api('send', { convo: openId, text, ...(att && { image: att.data, w: att.w, h: att.h }) });
    if (!d.ok) { pending.remove(); if (!d.auth) sys(d.error || 'Could not send', true); return false; }
    if (myEpoch !== epoch || !pending.isConnected) return true; // polling will deliver it
    const m = d.message;
    if (att && m.img) rememberImage(m.img, att.data); // no need to download what we just sent
    if (openId === 'global' && settings.slow && me.role !== 'admin') slowUntil = Date.now() + settings.slow * 1000;
    lastActivity = Date.now();
    if (shown.has(m.id)) {
      pending.remove(); // a poll already delivered it
    } else {
      shown.add(m.id);
      lastId = Math.max(lastId, m.id);
      const el = buildMessage(m);
      el.classList.add('arrived');
      pending.replaceWith(el);
      log.querySelectorAll('.sys.empty').forEach(e => e.remove());
      groupMessages();
      markRead();
    }
    return true;
  } catch (e) {
    pending.remove();
    sys('Could not send — check your connection', true);
    return false;
  } finally {
    btn.disabled = false;
    updateComposer();
  }
}

// ---------- images ----------
const MAX_IMAGE_CHARS = 290000; // server limit is 300,000
const imageCache = new Map();   // image id -> data URL
let attachment = null;          // { data, w, h } waiting to be sent

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("Couldn't read that image"));
    i.src = src;
  });
}

function readAsDataURL(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// Shrinks photos to fit the server limit. Small GIFs are kept as-is so they stay animated.
async function prepareImage(file) {
  if (!file || !file.type.startsWith('image/')) throw new Error("That file isn't an image");
  const url = URL.createObjectURL(file);
  try {
    const img = await loadImg(url);
    const w0 = img.naturalWidth, h0 = img.naturalHeight;
    if (file.type === 'image/gif') {
      const data = await readAsDataURL(file);
      if (data.length - data.indexOf(',') - 1 <= MAX_IMAGE_CHARS) return { data, w: w0, h: h0 };
    }
    for (const max of [1280, 1024, 800, 640, 480]) {
      const scale = Math.min(1, max / Math.max(w0, h0));
      const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      const g = c.getContext('2d');
      g.fillStyle = '#fff'; // transparent parts would turn black in a JPEG
      g.fillRect(0, 0, w, h);
      g.drawImage(img, 0, 0, w, h);
      for (const q of [0.82, 0.7]) {
        const data = c.toDataURL('image/jpeg', q);
        if (data.length - data.indexOf(',') - 1 <= MAX_IMAGE_CHARS) return { data, w, h };
      }
    }
    throw new Error('That image is too big');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function setAttachment(att) {
  attachment = att;
  $('attachbar').classList.toggle('hidden', !att);
  if (att) {
    $('attachimg').src = att.data;
    $('attachinfo').textContent = isFeed()
      ? `Picture added (${att.w}×${att.h}). Write something or just press Post.`
      : `Image ready to send (${att.w}×${att.h}). Add a caption or press Send.`;
  } else {
    $('attachimg').removeAttribute('src');
  }
}

async function attachFile(file) {
  try {
    setAttachment(await prepareImage(file));
    textEl.focus();
  } catch (e) {
    toast(e.message || "Couldn't read that image", true);
  }
}

function rememberImage(id, data) {
  imageCache.set(id, data);
  // Images are big, so only keep the most recent ones in memory.
  while (imageCache.size > 60) imageCache.delete(imageCache.keys().next().value);
}

function imageBlock(m, max = 320) {
  const scale = Math.min(1, max / m.w, max / m.h);
  const box = h('div', { class: 'shot', style: `width:${Math.round(m.w * scale)}px;aspect-ratio:${m.w}/${m.h}` });
  const img = h('img', { alt: 'Image' });
  box.append(img);
  box.onclick = () => { if (img.src) openLightbox(img.src); };
  img.onload = () => box.classList.add('loaded');
  if (m.local) img.src = m.local;
  else if (imageCache.has(m.img)) img.src = imageCache.get(m.img);
  else {
    // Download only when scrolled near, a few at a time.
    box.dataset.img = m.img;
    box.dataset.convo = openId;
    imageObserver.observe(box);
  }
  return box;
}

const imageQueue = [];
let imagesLoading = 0;
const imageObserver = new IntersectionObserver(entries => entries.forEach(e => {
  if (!e.isIntersecting) return;
  imageObserver.unobserve(e.target);
  imageQueue.push(e.target);
  pumpImages();
}), { root: log, rootMargin: '400px' });

function pumpImages() {
  while (imagesLoading < 3 && imageQueue.length) {
    const box = imageQueue.shift();
    imagesLoading++;
    fetchImage(box).finally(() => { imagesLoading--; pumpImages(); });
  }
}

async function fetchImage(box) {
  const id = box.dataset.img;
  try {
    let src = imageCache.get(id);
    if (!src) {
      const d = await api('image', { convo: box.dataset.convo, id });
      if (!d.ok) throw new Error(d.error);
      src = d.image;
      rememberImage(id, src);
    }
    const img = box.querySelector('img');
    img.onload = () => box.classList.add('loaded');
    img.src = src;
  } catch (e) {
    box.classList.add('failed');
    box.onclick = null;
    box.replaceChildren(e.message && !/fetch/i.test(e.message) ? e.message : "Couldn't load image");
  }
}

function openLightbox(src) {
  const overlay = h('div', { class: 'overlay lightbox', onclick: () => overlay.remove() }, h('img', { src, alt: 'Image' }));
  document.body.append(overlay);
}

$('attach').onclick = () => $('attachfile').click();
$('attachfile').onchange = () => {
  const f = $('attachfile').files[0];
  $('attachfile').value = '';
  if (f) attachFile(f);
};
$('attachx').onclick = () => { setAttachment(null); textEl.focus(); };

textEl.addEventListener('paste', e => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  attachFile(item.getAsFile());
});

// Drag and drop onto the chat. The counter stops flicker when crossing child elements.
let dragDepth = 0;
const mainEl = document.querySelector('main');
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
mainEl.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; mainEl.classList.add('dragging'); });
mainEl.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
mainEl.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; mainEl.classList.remove('dragging'); } });
mainEl.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault();
  dragDepth = 0;
  mainEl.classList.remove('dragging');
  const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
  if (f) attachFile(f); else toast("That file isn't an image", true);
});

// ---------- friend codes ----------
// Same list as Code.gs.

let myCode = null;

const codeWords = text => String(text || '').toLowerCase().split(/[^a-z]+/).filter(Boolean);

let loadingCode = false, codesOff = false;
async function loadMyCode() {
  if (myCode || !token || loadingCode || codesOff) return;
  loadingCode = true;
  const t = token;
  try {
    const d = await api('myCode', {});
    if (d.ok && token === t) { myCode = d.code; paintCode(); } // ignore if someone logged out meanwhile
    else if (!d.ok && d.error === 'Unknown action') { $('codecard').classList.add('hidden'); codesOff = true; } // backend not updated yet
  } catch (e) {
  } finally {
    loadingCode = false;
  }
}

function paintCode() {
  if (!myCode) return;
  $('codewords').replaceChildren(...myCode.split(' ').map(w => h('span', { class: 'cw' }, w)));
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied!'); }
  catch (e) { prompt('Copy your friend code:', text); } // clipboard can be blocked in embeds
}

function openCodeModal() {
  if (!myCode) return loadMyCode();
  let slots = myCode.split(' ');
  let active = 0;
  const slotBtns = [0, 1, 2, 3].map(i => h('button', { type: 'button', onclick: () => { active = i; draw(); } }));
  const search = h('input', { placeholder: 'Search words' });
  const grid = h('div', { class: 'wordgrid' });
  const draw = () => {
    slotBtns.forEach((b, i) => {
      b.textContent = slots[i] || 'pick a word';
      b.className = (i === active ? 'on' : '') + (slots[i] ? '' : ' empty');
    });
    const q = search.value.trim().toLowerCase();
    grid.replaceChildren(...CODE_WORDS.filter(w => w.includes(q)).map(w => h('button', {
      type: 'button', class: slots.includes(w) ? 'used' : '',
      onclick: () => { slots[active] = w; active = Math.min(3, slots.findIndex(x => !x) >= 0 ? slots.findIndex(x => !x) : active + 1); draw(); },
    }, w)));
  };
  search.oninput = draw;
  const save = h('button', { class: 'primary' }, 'Save new code');
  save.onclick = async () => {
    if (slots.filter(Boolean).length < 4) return toast('Pick 4 words', true);
    const d = await act('setCode', { words: slots });
    if (d) { myCode = d.code; paintCode(); toast('New friend code saved. Your old one no longer works.'); md.close(); }
  };
  const md = modal('wide scroll',
    h('h2', null, 'Your friend code'),
    h('div', { class: 'codebig' }, myCode.split(' ').map(w => h('span', { class: 'cw' }, w))),
    h('div', { class: 'hint', style: 'color:var(--muted);font-size:13px;text-align:center' },
      'Give these 4 words to a friend. When they type them into the Add box, you become friends straight away. Only share it with people you know!'),
    h('div', { class: 'btns', style: 'justify-content:center' },
      h('button', { class: 'ghost', onclick: () => copyText(myCode) }, 'Copy code')),
    h('h3', null, 'Change your code'),
    h('div', { class: 'hint', style: 'color:var(--muted);font-size:12px' }, 'Pick 4 words that describe you. Changing it stops your old code from working.'),
    h('div', { class: 'slots' }, slotBtns),

// ---------- notifications ----------
let settings = { slow: 0 };
let pingTop = null; // newest notification we've handled
let eMax = 0;       // newest reaction change seen in the open chat
const prefs = Object.assign({ sound: true, desktop: false }, JSON.parse(store.get('chat_prefs') || '{}'));
const savePrefs = () => store.set('chat_prefs', JSON.stringify(prefs));

function handlePings(pings) {
  // Skip what you're already looking at (comments live inside the feed, so they always count).
  const shown = pings.filter(p => p.kind === 'comment' || !(p.convo === openId && !document.hidden));
  if (!shown.length) return;
  if (prefs.sound) ding();
  const p = shown[shown.length - 1];
  const where = p.kind === 'dm' ? 'sent you a message' : p.kind === 'group' ? 'posted in a group'
    : p.kind === 'comment' ? 'commented' : 'mentioned you';
  const text = `${p.from} ${where}: ${p.text}`;
  const go = () => (p.kind === 'comment' || (p.convo === 'global' && p.id) ? openPost(p.post || p.id) : switchTo(p.convo));
  if (!document.hidden) toast(text, false, go);
  if (prefs.desktop && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    try {
      const n = new Notification(`${p.from} ${where}`, { body: p.text, icon: $('favicon').href, tag: 'idiocy-' + p.convo });
      n.onclick = () => { window.focus(); go(); n.close(); };
    } catch (e) {}
  }
}

// A short two-note chime, made in code so there's no sound file to load.
let audio = null;
function ding() {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t = audio.currentTime;
    [[880, 0], [1320, 0.09]].forEach(([f, dt]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + dt);
      g.gain.exponentialRampToValueAtTime(0.18, t + dt + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dt + 0.25);
      o.connect(g).connect(audio.destination);
      o.start(t + dt);
      o.stop(t + dt + 0.3);
    });
  } catch (e) {}
}
// Browsers only allow sound after the user has interacted with the page.
document.addEventListener('pointerdown', () => { try { if (audio && audio.state === 'suspended') audio.resume(); } catch (e) {} });

// "(2) Idiocy" plus a red dot on the tab icon when chats have unread messages.
const baseIcon = $('favicon').href;
let iconWithDot = null, lastUnread = -1;
function updateTitle() {
  const n = st ? st.convos.filter(c => isUnread(c.id)).length : 0;
  if (n === lastUnread) return;
  lastUnread = n;
  document.title = n ? `(${n}) Idiocy` : 'Idiocy';
  if (!n) { $('favicon').href = baseIcon; return; }
  if (iconWithDot) { $('favicon').href = iconWithDot; return; }
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0, 64, 64);
    g.fillStyle = '#e0344f';
    g.beginPath(); g.arc(50, 14, 13, 0, Math.PI * 2); g.fill();
    g.lineWidth = 4; g.strokeStyle = '#fff'; g.stroke();
    iconWithDot = c.toDataURL('image/png');
    if (lastUnread > 0) $('favicon').href = iconWithDot;
  };
  img.src = baseIcon;
}

function openSettings() {
  const sound = h('input', { type: 'checkbox' });
  sound.checked = prefs.sound;
  sound.onchange = () => { prefs.sound = sound.checked; savePrefs(); if (sound.checked) ding(); };
  const desk = h('input', { type: 'checkbox' });
  desk.checked = prefs.desktop && 'Notification' in window && Notification.permission === 'granted';
  desk.onchange = async () => {
    if (desk.checked) {
      if (!('Notification' in window)) { toast("This browser can't show notifications here", true); desk.checked = false; return; }
      const perm = await Notification.requestPermission().catch(() => 'denied');
      if (perm !== 'granted') { toast('Notifications are blocked. Allow them in your browser settings.', true); desk.checked = false; return; }
    }
    prefs.desktop = desk.checked;
    savePrefs();
  };
  const md = modal('',
    h('h2', null, 'Settings'),
    h('label', { class: 'toggle' }, h('span', null, 'Ping sound', h('div', { class: 'hint', style: 'color:var(--muted);font-size:12px' }, 'For DMs, group messages and @mentions')), sound),
    h('label', { class: 'toggle' }, h('span', null, 'Desktop notifications', h('div', { class: 'hint', style: 'color:var(--muted);font-size:12px' }, 'When this tab is in the background')), desk),
    h('div', { class: 'btns', style: 'justify-content:space-between' },
      h('button', { class: 'ghost danger', onclick: () => { md.close(); logOut(); } }, 'Log out'),
      h('button', { class: 'primary', onclick: () => md.close() }, 'Done')));
}

// ---------- admin panel ----------
const TIMEOUTS = [['10 min', 10], ['1 hour', 60], ['1 day', 1440]];

function timeoutButtons(name, done) {
  return TIMEOUTS.map(([label, mins]) => h('button', {
    class: 'ghost', onclick: async () => {
      if (await act('timeout', { username: name, minutes: mins })) { toast(`${name} timed out for ${label}`); if (done) done(); }
    },
  }, 'Timeout ' + label));
}

function openAdmin() {
  let tab = 'reports', data = null;
  const body = h('div', { class: 'alist' });
  const tabs = ['reports', 'users', 'settings'].map(t => h('button', { onclick: () => { tab = t; draw(); } }, t[0].toUpperCase() + t.slice(1)));
  const md = modal('wide scroll', h('h2', null, 'Admin panel'), h('div', { class: 'tabbar' }, tabs), body);
  const load = async () => {
    progress(1);
    try {
      const d = await api('adminData', {});
      if (!d.ok) { if (!d.auth) toast(d.error, true); return; }
      data = d;
      draw();
    } catch (e) {
      toast('Could not reach the server', true);
    } finally {
      progress(-1);
    }
  };
  let query = '';
  const draw = () => {
    tabs.forEach((b, i) => b.classList.toggle('on', ['reports', 'users', 'settings'][i] === tab));
    if (!data) {
      body.replaceChildren(...[1, 2, 3].map(() => h('div', { class: 'card shimmer', style: 'height:70px;border:0' })));
      return;
    }
    tabs[0].textContent = data.reports.length ? `Reports (${data.reports.length})` : 'Reports';
    if (tab === 'reports') {
      body.replaceChildren(...(data.reports.length ? data.reports.map(r => h('div', { class: 'card enter' },
        h('div', { class: 'meta' }, h('b', { style: 'color:var(--text)' }, r.sender), ` in ${r.where} \u00b7 reported by ${r.reporter} \u00b7 ${new Date(r.time).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' })}`),
        h('q', null, r.text || '(no text)'),
        h('div', { class: 'meta' }, 'Reason: ' + r.reason),
        h('div', { class: 'btns' },
          h('button', { class: 'primary', onclick: async () => { if (await act('resolveReport', { id: r.id, what: 'delete' })) { toast('Message deleted'); load(); } } }, 'Delete message'),
          h('button', { class: 'ghost', onclick: async () => { if (await act('resolveReport', { id: r.id, what: 'dismiss' })) load(); } }, 'Dismiss'),
          ...timeoutButtons(r.sender, load),
          h('button', { class: 'ghost danger', onclick: async () => { if (confirm(`Ban ${r.sender}?`) && await act('ban', { username: r.sender })) { toast(`${r.sender} banned`); load(); } } }, 'Ban')))) :
        [h('div', { class: 'muted', style: 'padding:20px;text-align:center' }, 'No open reports. Everyone\u2019s behaving (for now).')]));
    } else if (tab === 'users') {
      const search = h('input', { placeholder: 'Search users', value: query });
      search.oninput = () => { query = search.value; drawUsers(); };
      const list = h('div');
      const drawUsers = () => list.replaceChildren(...data.users
        .filter(u => key(u.username).includes(key(query)))
        .slice(0, 100)
        .map(u => h('div', { class: 'urow' },
          avatar(u.username),
          h('span', { class: 'nm' + (u.role === 'admin' ? ' admin-name' : ''), onclick: () => openProfile(u.username) }, u.username),
          u.role === 'admin' && h('span', { class: 'badge' }, 'ADMIN'),
          u.banned && h('span', { class: 'badge', style: 'background:var(--danger);color:#fff' }, 'BANNED'),
          u.muted > Date.now() && h('span', { class: 'badge', style: 'background:var(--panel-2);color:var(--muted)' }, 'TIMED OUT'),
          u.role !== 'admin' && h('span', { class: 'btns', style: 'display:flex;gap:6px;flex-wrap:wrap' },
            u.muted > Date.now()
              ? h('button', { class: 'ghost', onclick: async () => { if (await act('timeout', { username: u.username, minutes: 0 })) load(); } }, 'End timeout')
              : timeoutButtons(u.username, load)[1],
            u.banned
              ? h('button', { class: 'ghost', onclick: async () => { if (await act('unban', { username: u.username })) load(); } }, 'Unban')
              : h('button', { class: 'ghost danger', onclick: async () => { if (confirm(`Ban ${u.username}?`) && await act('ban', { username: u.username })) load(); } }, 'Ban')))));
      drawUsers();
      body.replaceChildren(search, h('div', { class: 'meta', style: 'color:var(--muted);font-size:12px' }, `${data.users.length} accounts`), list);
      search.focus();
    } else {
      body.replaceChildren(
        h('div', null, h('b', null, 'Slow mode for Global'),
          h('div', { class: 'hint', style: 'color:var(--muted);font-size:12px;margin:4px 0 8px' }, 'How long people wait between Global messages. Admins are exempt.')),
        h('div', { class: 'chips' }, [0, 5, 10, 30, 60].map(sec => h('button', {
          class: 'ghost', style: data.settings.slow === sec ? 'border-color:var(--accent);color:var(--accent)' : '',
          onclick: async () => {
            const d = await act('setSlowMode', { seconds: sec });
            if (d) { data.settings = d.settings; settings = d.settings; draw(); renderHeader(); toast(sec ? `Slow mode: ${sec}s` : 'Slow mode off'); }
          },
        }, sec ? sec + 's' : 'Off'))));
    }
  };
  draw();
  load();
}

// ---------- commands ----------
function handleCommand(input) {
  const [cmd, ...rest] = input.slice(1).split(' ');
  const arg = rest.join(' ').trim();
  const admin = me && me.role === 'admin';
  switch (cmd.toLowerCase()) {
    case 'help':
      sys(admin
        ? 'Admin commands: /clear (wipes Global), /ban <username>, /unban <username>. Hover any message to delete it.'
        : 'Hover your own messages to delete them. Add friends in the sidebar to DM them or make groups.');
      return true;
    case 'clear':
      if (!admin) return false;
      if (confirm('Delete ALL Global messages for everyone?')) act('clearGlobal');
      return true;
    case 'ban':
    case 'unban':
      if (!admin) return false;
      if (!arg) { sys(`Usage: /${cmd} <username>`); return true; }
      act(cmd.toLowerCase(), { username: arg }).then(d => { if (d) toast(`${d.username} ${cmd.toLowerCase() === 'ban' ? 'banned' : 'unbanned'}`); });
      return true;
  }
  return false;
}

// ---------- wiring ----------
$('send').addEventListener('submit', async e => {
  e.preventDefault();
  const text = textEl.value.trim();
  const att = attachment;
  if (!text && !att) return;
  if (isPendingChat(openId)) return;
  if (!att && text.startsWith('/') && handleCommand(text)) { textEl.value = ''; updateCount(); return; }
  textEl.value = '';
  setAttachment(null);
  updateCount();
  if (!(await send(text, att))) {
    // Put things back so nothing is lost, unless something new was started.
    if (!textEl.value) { textEl.value = text; updateCount(); }
    if (att && !attachment) setAttachment(att);
  }
  textEl.focus();
});

// Post box: grows as you type; Ctrl/Cmd+Enter posts, Enter makes a new line.
const POST_HINT = /Mac|iPhone|iPad/.test(navigator.platform) ? '\u2318+Enter to post' : 'Ctrl+Enter to post';
$('postcount').textContent = POST_HINT;
const postEl = $('posttext');
function growPost() {
  postEl.style.height = 'auto';
  postEl.style.height = Math.min(180, postEl.scrollHeight + 2) + 'px';
  const left = 1000 - postEl.value.length;
  $('postcount').textContent = left <= 100 ? `${left} left` : POST_HINT;
}
postEl.addEventListener('input', growPost);
postEl.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); submitPost(); } });
postEl.addEventListener('paste', e => {
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.kind === 'file' && i.type.startsWith('image/'));
  if (!item) return;
  e.preventDefault();
  attachFile(item.getAsFile());
});
$('postimg').onclick = () => $('attachfile').click();
$('postbtn').onclick = submitPost;

async function submitPost() {
  const text = postEl.value.trim();
  const att = attachment;
  if ((!text && !att) || $('postbtn').disabled) return;
  if (!att && text.startsWith('/') && handleCommand(text)) { postEl.value = ''; growPost(); return; }
  postEl.value = '';
  setAttachment(null);
  growPost();
  if (!(await send(text, att))) {
    if (!postEl.value) { postEl.value = text; growPost(); }
    if (att && !attachment) setAttachment(att);
  }
}

function updateCount() {
  const left = MAX_MSG - textEl.value.length;
  $('count').textContent = left <= 50 ? left : '';
}
textEl.addEventListener('input', updateCount);

$('newmsgs').onclick = scrollDown;
log.addEventListener('scroll', () => { if (nearBottom()) $('newmsgs').style.display = 'none'; });
$('menu').onclick = () => document.body.classList.add('side-open');
$('scrim').onclick = () => document.body.classList.remove('side-open');
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollNow(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.overlay').forEach(o => o.remove());
});

// ---------- start ----------
document.querySelectorAll('img.logo').forEach(img => { img.src = $('favicon').href; });
if (token) start(); else showAuth();
